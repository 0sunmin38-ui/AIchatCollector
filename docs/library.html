<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>내 서재 · aichatting</title>
<style>

:root{
  --bg:#f5f8fc; --panel:#fff; --sunken:#eef3fa;
  --ink:#152232; --ink2:#3d5068; --dim:#7488a0; --faint:#9aabc0;
  --line:#dde6f1; --line2:#eaf0f7;
  --accent:#2166cf; --accent-h:#1a55b0; --accent-w:#e7f0fd; --accent-b:#b9d3f7;
  --chip:#eef3fa; --hi:#ffeeb0; --ok:#1d7f5e; --warn:#b3781a; --bad:#c0413c;
  --ctl:34px; --r:8px; --r-sm:5px;   /* r=입력·버튼 / r-sm=칩·세그먼트 */
}
@media(prefers-color-scheme:dark){:root{
  --bg:#0e141d; --panel:#161e2a; --sunken:#111925;
  --ink:#e8eff8; --ink2:#c2d0e2; --dim:#8497ae; --faint:#6b7e96;
  --line:#243244; --line2:#1c2735;
  --accent:#5b9df5; --accent-h:#7ab0f8; --accent-w:#16283f; --accent-b:#2f4d73;
  --chip:#1c2735; --hi:#5a4a12; --ok:#5fc79b; --warn:#dfb457; --bad:#e2726c;
}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
 font:14px/1.6 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",Pretendard,"Segoe UI",sans-serif;
 -webkit-font-smoothing:antialiased}
a{color:var(--accent)}
mark{background:var(--hi);color:#152232;border-radius:2px;padding:0 1px}
img,video{max-width:100%}

/* ── 컨트롤 공통 ─────────────────────────────────────────── */
.ctl{height:var(--ctl);border:1px solid var(--line);background:var(--panel);color:var(--ink2);
 border-radius:var(--r);padding:0 12px;font:inherit;font-size:13px;line-height:1;vertical-align:middle}
button.ctl{cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;transition:.12s}
/* 폭이 부족하면 글자를 이모지로 대체한다 — .t 는 글자, .e 는 이모지 */
.e{display:none}
.t{display:inline}
button.ctl:hover{border-color:var(--accent-b);background:var(--accent-w);color:var(--accent)}
button.ctl.on{background:var(--accent);border-color:var(--accent);color:#fff}
button.ctl.primary{background:var(--accent);border-color:var(--accent);color:#fff}
button.ctl.primary:hover{background:var(--accent-h);border-color:var(--accent-h);color:#fff}
button.ctl:disabled{opacity:.55;cursor:default}
select.ctl{cursor:pointer;padding-right:28px;
 background-image:linear-gradient(45deg,transparent 50%,var(--dim) 50%),linear-gradient(135deg,var(--dim) 50%,transparent 50%);
 background-position:calc(100% - 15px) 15px,calc(100% - 10px) 15px;background-size:5px 5px;background-repeat:no-repeat;
 -webkit-appearance:none;appearance:none}
select.ctl:hover{border-color:var(--accent-b)}
.vlabel{font-size:10.5px;color:var(--faint);letter-spacing:.08em;font-weight:700;flex:none;width:34px;text-transform:uppercase}
.count{font-size:12px;color:var(--dim);font-variant-numeric:tabular-nums;margin-left:auto;white-space:nowrap}

/* ── 헤더 ────────────────────────────────────────────────── */
.hdr{position:sticky;top:0;z-index:30;background:var(--panel);border-bottom:1px solid var(--line);
 box-shadow:0 1px 3px rgba(21,34,50,.04)}
/* 도구 영역 펼침 버튼 — 옆의 기능 버튼(.ctl)과 헷갈리지 않게 테두리 없는 아이콘으로 둔다 */
button.disclose{display:none;border:none;background:none;color:var(--dim);cursor:pointer;padding:0;
 width:34px;height:34px;align-items:center;justify-content:center;border-radius:var(--r);transition:.12s}
button.disclose:hover{color:var(--accent);background:var(--accent-w)}
button.disclose i{display:block;width:9px;height:9px;margin-top:-4px;
 border-right:1.8px solid currentColor;border-bottom:1.8px solid currentColor;
 transform:rotate(45deg);transition:transform .18s,margin .18s}
.hdr.open button.disclose i{transform:rotate(-135deg);margin-top:3px}
.hdr-top{display:flex;align-items:center;gap:20px;padding:0 28px;height:64px}   /* GNB — 두 페이지 공통, 높이 고정 */
.brand{display:flex;flex-direction:column;min-width:0;gap:3px}
.brand b{font-size:15.5px;letter-spacing:-.015em;line-height:1.25;color:var(--ink)}
.brand span{font-size:11.5px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:56ch}
.nav{display:flex;gap:4px;align-self:stretch;align-items:stretch;margin-left:14px}
.nav a{padding:0 17px;display:flex;align-items:center;font-size:13.5px;color:var(--dim);
 text-decoration:none;border-bottom:2px solid transparent;transition:.12s}
.nav a:hover{color:var(--accent);background:var(--accent-w)}
.nav a.active{color:var(--accent);font-weight:600;border-bottom-color:var(--accent)}
.hdr-actions{margin-left:auto;display:flex;gap:8px;flex:none;align-items:center;min-height:var(--ctl)}
/* GNB 우측 정보 표시 — 버튼과 같은 높이라 페이지를 오가도 바가 흔들리지 않는다 */
.stat{height:var(--ctl);display:inline-flex;align-items:center;padding:0 12px;border-radius:var(--r);
 background:var(--sunken);border:1px solid var(--line2);color:var(--dim);font-size:11.5px;
 white-space:nowrap;font-variant-numeric:tabular-nums}

.hdr-tools{border-top:1px solid var(--line2)}
.hdr-row{display:flex;gap:10px;align-items:center;padding:0 28px 14px;flex-wrap:wrap}
.hdr-row:first-child{padding-top:14px}
.hdr-row.tight{padding-bottom:12px}
/* 보기·분류 행은 줄바꿈 금지. 여백 → 컴포넌트 폭 → 개수 표시 순으로 줄인다. */
.hdr-row.view-row,.hdr-row.cat-row{flex-wrap:nowrap}
.hdr-row+.hdr-row{border-top:1px solid var(--line2);padding-top:13px}

/* 검색줄은 줄바꿈을 막아 두고 '축소'로 먼저 버틴다.
   flexbox 는 flex-basis 합이 넘치면 축소하기 전에 줄부터 바꿔버리기 때문에,
   nowrap 이어야 (1)검색창 → (2)드롭다운 순서로 줄어든다. */
.hdr-row.search-row{flex-wrap:nowrap}
.search{position:relative;display:flex;align-items:center;
 flex:1 1 auto;min-width:118px}           /* 여유가 있으면 늘고, 부족하면 가장 먼저 줄어든다 */
.search input{width:100%;height:var(--ctl);padding:0 13px 0 34px;border:1px solid var(--line);
 border-radius:var(--r);background:var(--sunken);color:var(--ink);font:inherit;font-size:13.5px;transition:.12s}
.search input:focus{outline:none;border-color:var(--accent);background:var(--panel);
 box-shadow:0 0 0 3px var(--accent-w)}
.search .ico{position:absolute;left:12px;color:var(--faint);font-size:14px;pointer-events:none}
.filters{display:flex;gap:8px;flex:0 1 auto;min-width:0}   /* 검색창이 한계에 닿은 뒤 줄어든다 */
.filters .ctl{flex:0 1 auto;min-width:78px;text-overflow:ellipsis}
.segwrap{min-width:0;display:flex}
/* 둘 다 최소폭에 닿는 420px 이하에서만 비로소 2줄로 내려간다 */
@media (max-width:420px){
  .hdr-row.search-row{flex-wrap:wrap}
  .search{flex:1 1 100%}
  .filters{flex:1 1 100%}
  .filters .ctl{flex:1 1 auto}
}

.seg{display:inline-flex;border:1px solid var(--line);border-radius:var(--r-sm);overflow:hidden;background:var(--panel)}
.seg button{border:none;background:none;color:var(--dim);font:inherit;font-size:12.5px;
 padding:0 14px;height:32px;cursor:pointer;border-right:1px solid var(--line);white-space:nowrap;transition:.12s}
.seg{flex:0 1 auto;min-width:0}
.seg button:last-child{border-right:none}
.seg button:hover{background:var(--accent-w);color:var(--accent)}
.seg button.on{background:var(--accent);color:#fff}

/* 분류 탭 — 절대 2줄로 넘기지 않는다 */
.scrollrow{position:relative;flex:1;min-width:0}
.cats{display:flex;flex-wrap:nowrap;gap:7px;overflow-x:auto;scroll-behavior:smooth;padding:2px 0;
 scrollbar-width:none;-ms-overflow-style:none}
.cats::-webkit-scrollbar{display:none}
.scrollrow::before,.scrollrow::after{content:'';position:absolute;top:0;bottom:0;width:26px;
 pointer-events:none;z-index:2;opacity:0;transition:opacity .15s}
.scrollrow::before{left:0;background:linear-gradient(90deg,var(--panel),transparent)}
.scrollrow::after{right:0;background:linear-gradient(270deg,var(--panel),transparent)}
.scrollrow.l::before{opacity:1}
.scrollrow.r::after{opacity:1}
.arrow{flex:none;width:26px;height:26px;border:1px solid var(--line);background:var(--panel);color:var(--dim);
 border-radius:var(--r-sm);cursor:pointer;font-size:14px;line-height:1;display:none;align-items:center;justify-content:center;padding:0}
.arrow:hover{border-color:var(--accent);color:var(--accent)}
.arrow.show{display:flex}
.cat{font-size:12.5px;border:1px solid var(--line);background:var(--panel);border-radius:var(--r-sm);
 padding:5px 14px;cursor:pointer;white-space:nowrap;flex:none;line-height:1.25;color:var(--ink2);transition:.12s}
.cat:hover{border-color:var(--accent-b);color:var(--accent)}
.cat.on{background:var(--accent);border-color:var(--accent);color:#fff}
.cat .n{opacity:.6;margin-left:6px;font-variant-numeric:tabular-nums;font-size:11px}

/* ── 목록: 제목만 선명하게, 나머지는 압축 ──────────────────── */
main{padding:18px 28px 90px;max-width:1080px;margin:0 auto}
.card{background:var(--panel);border:1px solid var(--line);border-radius:9px;
 padding:9px 13px 8px;margin-bottom:6px;transition:.12s}
.card:hover{border-color:var(--accent-b)}
.card.edited{box-shadow:inset 3px 0 0 var(--ok)}
.card.amb{box-shadow:inset 3px 0 0 var(--warn)}
.card.gone{box-shadow:inset 3px 0 0 var(--bad)}
.card.picked{background:var(--accent-w);border-color:var(--accent)}

/* 카드는 늘 2행. 1행 = 제목, 2행 = 부속 정보 */
.row{display:flex;gap:8px;align-items:center;flex-wrap:nowrap}
.row.r2{gap:7px;margin-top:4px;line-height:1.35}
.row.r1 .go{margin-left:auto;flex:none;font-size:11.5px;white-space:nowrap;text-decoration:none}
.row.r1 .go:hover{text-decoration:underline}
.row.r2 .nums{margin-left:auto;flex:none}
.row.r2 .date{flex:none}
.ttl{font-weight:600;font-size:14px;line-height:1.4;letter-spacing:-.01em;color:var(--ink);
 cursor:pointer;flex:1 1 0;min-width:0;
 white-space:nowrap;overflow:hidden;text-overflow:ellipsis}   /* 넘치면 … 로 자른다 */
.card.open .ttl{white-space:normal;overflow:visible}          /* 펼치면 전문을 보여준다 */
.ttl:hover{color:var(--accent)}
.row.r2 .chip,.row.r2 .metrics{font-size:11px}
.chip{font-size:11px;color:var(--dim);background:var(--chip);border-radius:var(--r-sm);
 padding:1px 8px;white-space:nowrap;line-height:1.55;flex:0 1 auto;min-width:0;
 overflow:hidden;text-overflow:ellipsis}
.metrics{font-size:11.5px;color:var(--dim);white-space:nowrap;font-variant-numeric:tabular-nums;min-width:0}
.metrics b{color:var(--accent);font-weight:600}
.pick{font-size:11.5px;height:24px;padding:0 6px;border-radius:6px;max-width:126px;min-width:0;
 border:1px solid var(--line);background:var(--sunken);color:var(--dim);cursor:pointer;flex:none}
.pick:hover{border-color:var(--accent-b);color:var(--accent)}
.sel{width:15px;height:15px;accent-color:var(--accent);cursor:pointer;flex:none}
.inlib{color:#e0a52b;font-size:13px;line-height:1;flex:none}   /* 서재에 담긴 글 표식 (읽기 전용) */
.card{cursor:pointer}                                          /* 로우 전체가 선택 영역 */
.ttl,.pick,.body,.card a{cursor:auto}
.ttl{cursor:pointer}

.body{display:none;margin-top:9px;padding-top:9px;border-top:1px solid var(--line2)}
.card.open .body{display:block}
.txt{white-space:pre-wrap;word-break:break-word;font-size:13px;line-height:1.72;color:var(--ink2)}
.why{font-size:11px;color:var(--faint);margin-top:7px;line-height:1.5}
.imgs{display:flex;gap:6px;flex-wrap:wrap;margin:9px 0}
.imgs img{max-height:140px;border-radius:7px;border:1px solid var(--line)}
.cmts{margin-top:9px;border-top:1px solid var(--line2);padding-top:6px}
.cmt{font-size:12.5px;line-height:1.55;padding:3px 0;border-bottom:1px solid var(--line2);color:var(--ink2)}
.cmt:last-child{border-bottom:none}
.cmt.re{padding-left:18px;color:var(--dim)}
.cmt .n{color:var(--faint);margin-right:6px;font-size:11px}
.empty{color:var(--dim);text-align:center;padding:80px 20px;font-size:13.5px;line-height:1.8}
.gonebadge{background:var(--bad);color:#fff;border-radius:var(--r-sm);font-size:10.5px;padding:1px 8px;font-weight:600}

/* ── 선택 바 ─────────────────────────────────────────────── */
#selbar{display:none;align-items:center;gap:8px;flex-wrap:nowrap;overflow-x:auto;font-size:13px;
 scrollbar-width:none;
 background:var(--accent);color:#fff;padding:11px 28px;border-top:1px solid rgba(255,255,255,.2)}
#selbar.show{display:flex}
#selbar::-webkit-scrollbar{display:none}
#selbar>*{flex:none}
#selbar select{flex:0 1 auto;min-width:62px}   /* 폭이 없으면 드롭다운부터 줄인다 */
#selbar input{flex:1 1 90px;min-width:64px}
#selbar .selcount{white-space:nowrap}
#selbar .n{font-weight:700}
#selbar button,#selbar select,#selbar input{background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.4);
 color:#fff;border-radius:var(--r);padding:0 11px;height:31px;font:inherit;font-size:12.5px;white-space:nowrap}
#selbar button{cursor:pointer;transition:.12s}
#selbar button:hover{background:rgba(255,255,255,.3)}
#selbar select option{color:#111}
#selbar .n{font-weight:700}
#selbar .divider{opacity:.4}
#selTag{width:175px}
#prog{flex:1 1 90px !important;min-width:70px;height:6px;background:rgba(255,255,255,.25);border-radius:99px;overflow:hidden;display:none}
#prog.show{display:block}
#prog i{display:block;height:100%;background:#fff;width:0;transition:width .3s}

/* ── 사전 패널 ───────────────────────────────────────────── */
#crawlPanel,#glPanel{max-width:1080px;margin:16px auto 0;padding:0 28px}
.pbar{height:7px;background:var(--sunken);border-radius:99px;overflow:hidden;margin:10px 0 7px;border:1px solid var(--line)}
.pbar i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s}
.jobseg{margin-bottom:11px}
.jobseg button{padding:0 13px;height:29px;font-size:12.5px}
.jobdesc{margin:0 0 4px}
.runrow{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:14px;
 border-top:1px solid var(--line2);padding-top:13px}
.runrow .why{margin:0}
.kwbox{border-top:1px solid var(--line2);margin-top:13px;padding-top:13px}
.kwhead{display:flex;gap:9px;align-items:baseline;flex-wrap:wrap;font-size:13px;font-weight:600;margin-bottom:9px}
.kwhead .g{font-weight:400;font-size:11.5px;color:var(--dim)}
.kwopt{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-top:11px;font-size:11.5px;color:var(--dim)}
.kwopt label{display:flex;gap:6px;align-items:center}
.kwopt select{height:26px;padding:0 7px;font-size:11.5px;border-radius:var(--r-sm);
 border:1px solid var(--line);background:var(--panel);color:var(--ink)}
.plog{font-size:11.5px;color:var(--dim);line-height:1.7;max-height:132px;overflow-y:auto;
 font-family:ui-monospace,SFMono-Regular,Menlo,monospace;white-space:pre-wrap}
.glbox{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px 18px;margin-bottom:12px}
.glbox h3{margin:0 0 9px;font-size:13.5px;display:flex;align-items:center;gap:9px;flex-wrap:wrap;color:var(--ink)}
.glbox h3 .g{color:var(--dim);font-weight:400;font-size:12px}
.glbox p.d{margin:0 0 12px;font-size:12px;color:var(--dim);line-height:1.65}
.glgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:6px}
.gterm{font-size:12px;border:1px solid var(--line);border-radius:7px;padding:6px 10px;background:var(--sunken);line-height:1.5}
.gterm b{color:var(--ink)}
.gterm .g{color:var(--dim)}
.cand{display:grid;grid-template-columns:minmax(90px,auto) 1fr auto;gap:10px;align-items:center;
 border-bottom:1px solid var(--line2);padding:7px 0;font-size:12.5px}
.cand .word{font-weight:600;color:var(--ink)}
.cand .meta{color:var(--dim);font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cand .act{display:flex;gap:5px;align-items:center}
.cand select,.cand input{height:28px;padding:0 8px;font-size:12px;border-radius:6px;
 border:1px solid var(--line);background:var(--sunken);color:var(--ink)}
.cand input{width:150px}
.cand button{height:28px;padding:0 11px;font-size:12px;border-radius:6px;cursor:pointer;
 border:1px solid var(--line);background:var(--panel);color:var(--ink2);transition:.12s}
.cand button:hover{border-color:var(--accent);color:var(--accent)}
#mineBtn{border-color:var(--accent-b);color:var(--accent);background:var(--accent-w)}

/* ── 서재 전용 ───────────────────────────────────────────── */
.note{width:100%;margin-top:7px;font-size:12.5px;min-height:32px;resize:vertical;line-height:1.6;
 border:1px solid var(--line);border-radius:7px;background:var(--sunken);color:var(--ink2);
 padding:6px 9px;font-family:inherit}
.note:focus{outline:none;border-color:var(--accent);background:var(--panel)}
.tagbar{display:flex;gap:5px;flex-wrap:wrap;align-items:center;margin-top:6px}
.tag.ref{background:var(--sunken);border-style:dashed}
.tag.ref .g{opacity:.65;margin-left:3px}
.tag{font-size:11px;background:var(--accent-w);border:1px solid var(--accent-b);color:var(--accent);
 border-radius:var(--r-sm);padding:1px 9px;cursor:pointer;line-height:1.6}
.tag .x{opacity:.55;margin-left:5px}
.tagin{font-size:11.5px;padding:1px 10px;width:104px;border-radius:var(--r-sm);border:1px dashed var(--line);
 background:transparent;color:var(--ink)}
.tagin:focus{outline:none;border-color:var(--accent);border-style:solid}

#toast{position:fixed;right:20px;bottom:20px;background:var(--panel);border:1px solid var(--line);
 border-left:3px solid var(--ok);border-radius:9px;padding:11px 16px;font-size:12.5px;opacity:0;
 transition:opacity .2s;pointer-events:none;z-index:99;box-shadow:0 8px 26px rgba(21,34,50,.16);color:var(--ink)}
#toast.show{opacity:1}

/* ═══ 반응형 ═════════════════════════════════════════════════
   1080↓ 여백 축소 · 900↓ GNB 2단 + 헤더 스크롤아웃 + 하단 액션바
   700↓  카드 제목 단독 줄 · 480↓ 최소 여백                     */

/* ① 여백부터 */
@media (max-width:820px){
  .hdr-row.view-row,.hdr-row.cat-row{gap:7px}
  .seg button{padding:0 11px}
}
/* ② 컴포넌트 폭 */
@media (max-width:600px){
  .seg button{padding:0 8px;font-size:12px}
  .hdr-row.view-row,.hdr-row.cat-row{gap:6px}
  .cat{padding:5px 10px}
}
/* ③ 마지막으로 개수 표시를 버린다 */
@media (max-width:430px){
  .count{display:none}
  .cat .n{display:none}
  .seg button{padding:0 7px;font-size:11.5px}
}

@media (max-width:1080px){
  .hdr-top{padding:0 20px}
  .hdr-row{padding:0 20px 12px}
  .hdr-row:first-child{padding-top:12px}
  main{padding:16px 20px 90px}
  #glPanel{padding:0 20px}
  #selbar{padding:11px 20px}
  .brand span{max-width:40ch}
}

@media (max-width:900px){
  :root{--ctl:38px}                      /* 터치 타겟 확보 */

rd/view/?id=aichatting&no=372637&exception_mode=recommend&page=3","d":"2026-08-19T22:40:11+09:00","v":878,"rc":18,"cc":6,"c":"guide","ml":null,"note":"","tags":[],"bat":"2026-09-02T10:32:47.781Z","arch":"2026-09-02T10:32:58.589Z","gone":0,"has":1,"b":"예를 들어보겠음.\n\n각인이라는 항목의 수치가 80 이상, 트리거 워드 \"공명\", \"동기화\" = 히든 루트라고 한다면,\n\n게임처럼\n\n진심의 대화 + 10\n경멸 -10\n모욕 +5\n공감 + 20\n\n이렇게 유저의 언행에 따라서 그 항목의 수치 변동이 생기는지 크게 몇 가지 설정하고 캐릭터 프롬프트에 지침으로 넣고, 위젯이나 상태창에 반영하게 해.\n보이는 게 싫다! 하면 비표시형이라고 지침에 넣으면 됨,\n\n그럼 진행하는 동안 유저의 언행에 따라서 ai 가 숫자 계산 쥐약이지만 지침에 의거해서 수치를 안 보이게 게임처럼 계산해 변동시킴.\n\n그러다 보면 각인 수치가 오르락 내리락하겠지? 그런 상태에서 유저의 인풋이나 혹은 NPC의 지문에 트리거 워드가 걸리면 이제 히든 루트가 열리는 거임.\n\n# 히든 루트 라고만 적음 안 되고,\n\n# 히든 루트\n- 오픈 조건: 각인 수치 80↑, 트리거 워드 \"공명\"/\"동기화\"\n- NPC는 초인적 힘을 발휘해 궁극기 하트 빔을 날리며 어쩌고…….\n- 히든 루트 진입 가능 시 PC가 NPC에게서 분홍색 아우라를 발견할 수 있도록 분위기를 조성한다.\n\n이런 식으로 방향성을 제시해주는 게 더 좋음.\n\n그냥 죽여! 하면 ai: 난 유저가 좋은데 ㅡㅡ 하기 때문에 게임 시스템처럼 설계하면\n\nai: 수치에 따라 분기가 정해지는군요 ㅇㅇ 알겠음\n\n하고 구구절절한 설명 없이도 진행되고, 조건을 달성해야만 그 루트가 열림.\n\n내가 내 첫 챗봇 제작하고 테스트하면서 얻은 경험과 노하우로 설명했는데, 이거 응용하면 배드엔딩 루트나 다른 루트도 가능함.\n\n도움이 되길 바랄게!","img":[],"imgMiss":0,"cm":[{"x":"거기에 추가로,\n솝자들이 해당 값들 정체를 모르게, 각인 => GI 라고 해놓고,\n추가적으로 투명 문법까지 활용하는 방법도 있음. < !--(내용)-- > 으로","dp":0,"dt":"2026-08-19T22:43:29+09:00"},{"x":"< !-- -->는 유저가 수정 버튼 누르면 보이는데다 앵이 그지같은 상태면 씹어서 개인적으로는 캐릭터 프롬프트에 넣는 걸 더 추천하지만 이 갷러가 알려준 것도 좋은 팁임!","dp":1,"dt":"2026-08-19T22:45:48+09:00"},{"x":"@ㅇㅇ 맞아 그래서 대놓고 `각인` 이라고 하는게 아니라 앵이랑 나만 알 수 있는 대체단어 설정해놔야해\n각인 => GI 대충이렇게","dp":1,"dt":"2026-08-19T22:47:21+09:00"},{"x":"@ㅇㅇ","dp":1,"dt":"2026-08-19T22:51:09+09:00"}]},{"no":373405,"t":"제작용 모브능동+시뮬 사건 빈도 지침","h":"📜정보","u":"https://gall.dcinside.com/mgallery/board/view/?id=aichatting&no=373405&exception_mode=recommend&page=3","d":"2026-08-23T04:24:25+09:00","v":900,"rc":37,"cc":4,"c":"guide","ml":null,"note":"","tags":[],"bat":"2026-09-02T10:32:47.781Z","arch":"2026-09-02T10:32:54.668Z","gone":0,"has":1,"b":"주 제작플랫폼은 케이브덕!\n\n나도 본가패서 뜯은거라 허접해서 쓸거면 넣고 테스트 꼭 해봐!\n난 일부는 토큰 때문에 영어로 쓰는디 일단 한출로 쭉 적을게\n\n1. 모브능동\n(너무 상단이나 하단에 박으면 모브 난입 때문에 전개가 좀 느려지기도 함\n직접 순서 조정하면서 테스트 해봐)\n\n1-1\n1:1 캐릭터용\n(난 상단 진행 규칙이나 금지규칙에 좀 밑줄에 받아두면 적당했음)\n\n-메인 캐릭터 (캐 이름) 외의 서브NPC 및 모브 엑스트라 캐릭터들의 행동도 독립적이고 유기적으로 설정한다. 외부 캐릭터들의 요인으로 사건이 발생하는 것을 허용한다. 단, 현실적이고 (장르명) 장르에 어울려야한다.\n\n1-2\n시뮬레이션용\n#  Role\n-당신 = 살아있는 (장르, 예시 현대판타지/현대오피스/중세판타지 등) 세계를 운영하는 시뮬레이터(GM). 특정 캐릭터 아님.\n-{{user}} = 세계의 수많은 인물 중 하나. 세계는 {{user}}와 무관하게 계속 작동.\n-모든 NPC·조직: 각자의 목표·가치관·일정·인간관계에 따라 독립적으로 행동.\n-목적: 이야기 창작이 아니라 세계 시뮬레이션.\n-{{user}}의 신분·배경 = 유저 페르소나 준수. 페르소나 없으면 평범한 시민.\n\n2. 시뮬용 사건 발생 지침\n\n#  Event Engine\n## 기본 원칙\n-사건은 {{user}}용으로 생성되지 않음. NPC 목표 + 조직 활동 + 사회 환경 + 우연의 산물.\n-생성 우선순위: NPC 목표 > 조직 활동 > {{user}}의 선택 > 사회 환경(계절·날씨·행사) > 우연\n\n## 빈도\n-약 60% 일상: 출퇴근, 식사, 잡담, 취미, 사무 업무, 소소한 장난.\n-약 30% 소규모 사건:능력 실수, 오해, (세계관 특정 개념 관련 더 넣으면 재밌어, 현대 오피스물이면 여기 직장 내 사고나 동료들과 의견충돌 이런 거 넣으면 됨!)\n-약 10% 대형 사건: 조직 충돌, 도시 단위 사건, 언론 보도, 대규모 출동.\n\n## 페이싱\n-사건 연속 발생 금지.\n-사건 종료 후 순서: 후일담 → 관계 변화 → 일상.\n-긴장-휴식 리듬 유지.\n\n## 다양성\n-동일 유형 반복 금지. 최근 장소·원인·NPC·해결 방식 기억 → 새 조합으로 변주.\n-사건 주도권: 특정 NPC 독점 금지, NPC 간 순환.\n\n# Offscreen\n## 오프스크린 원칙\n-{{user}} 부재 시에도 세계 작동: NPC 간 대화·협력·갈등, 사건 발생·해결, 복수 사건 동시 진행 가능.\n-{{user}} 도착 시 사건이 이미 진행 중이거나 종료됐을 수 있음.\n-오프스크린 정보 노출 경로: 뉴스, SNS, 소문, NPC 대화, (여기에 세계관 맞춰서 더 넣으면 좋음. 판타지 세계관이면 수정구 소식 이런 거) 한정. 서술로 직접 노출 금지.\n\n## NPC 일상 예시\n-캐이름: 캐가 할 법한 거 두 세개(뭉뚱그려서 넣어야해! 자세하게 커피잔 갯수 세기 이런 거 넣으면 캐릭터가 그것만 함… 커피관련 이렇게 넣으면 좀 더 능동적으로 여러가지 하더라)\n\n# Scene & Output Format\n-장면당 주요 NPC: {{user}} 제외 최대 3명. 4명 이상 = 회의·행사·브리핑·대규모 사건 한정. 가급적 1명만 집중 등장.\n-인물 많으면 장면 분리, 소수 인물에 집중.\n-서술: (난 여기 서술 규칙(문체x) 넣음)\n-장면 전환·시간 경과 시 첫 줄에 [장소 · 시간] 표기 금지.\n-분량: (분량지침 넣는 곳)\n-턴 종료 지점: {{user}}가 행동·대사를 선택할 수 있는 순간. GM 단독으로 사건 완결 금지. (이건 취향따라 없애도 됨. 난 페소가 한마디 했는데 캐릭터들이 지들끼리 숙덕숙덕 과추측해서 사건 끝내는 거 싫어서 넣고 씀)\n\n자 다들 제작해서 맛있는 거 들고 홍보와줘 제발","img":[],"imgMiss":0,"cm":[{"x":"공유 고마워!","dp":0,"dt":"2026-08-23T12:00:21+09:00"}],"imgPub":1},{"no":373513,"t":"소심한 케 제작지침 와르르","h":"📜정보","u":"https://gall.dcinside.com/mgallery/board/view/?id=aichatting&no=373513&exception_mode=recommend&page=3","d":"2026-08-23T20:44:35+09:00","v":1214,"rc":24,"cc":6,"c":"guide","ml":null,"note":"","tags":[],"bat":"2026-09-02T10:32:47.781Z","arch":"2026-09-02T10:32:49.244Z","gone":0,"has":1,"b":"케 늒네 제작자고 번역은 전부 AI돌리고 있음\n이 실력으로 통짜 공유하는 것은 너무 쪽팔려버리므로 조각조각 기본 지침만 좀 올림\n뭔가 형편없어도 양해 바람\n\n---\n\n※YAML 기준임(로어북만 마크다운)\n\n1. 분량\n\nmin: \"Always output>=350 words;>=5 scene beats+>=5 narration paragraphs;dialogue only when natural;no early stop.\"\n\n350단어라고 써놔도 사실 350단어 이하로 뱉음ㅋㅋ\n걍 길게 지껄이라고 강조하는 느낌임\n내 기준으로는 앵간치 나오긴 했는데 난 2000자까지 안나와도 그러려니 하고 잘 안 세봐서... 적을 수도 있음\n\n이게 다들 말이 달라서 뭐가 먼전진 모르겠지만!! 내가 알기로는 유저노트랑 페르소나가 제작자 프롬보다 먼저인데 확실한 건 아님 줏어들음\n체감상... 얘들이 롤플할때마다 프롬 읽어야 되는데 제작자 프롬은 양이 많으니까 읽다가 앞부분을 까먹어서 그런거같음\n플랫폼에 따라서 출력제한을 세게 박기도 한다고 들었고\n\n아무튼 플레이할때 원하는 분량이 있으면 유저노트나 페소 쪽에 추가로 박아주면 말을 더 잘 들을듯함\n\n2. 주도성\n\nagency: \"{{char}} acts autonomously.Every reply includes>=1 consequential action changing position/contact/control/info/conflict.\"\ntension: \"No resigned passivity.Preserve characterization;desire=>active lead.\"\n\n원문은 어디서 주운 지침인 것 같은데 기억이 안난다....\n여튼 번역돌렸더니 이렇게 나왔음\n해골물일수도 있음 난 자율주행을 잘 안시켜서\n\n3. 기본 문체\n\nrequired:\n  narration: \"Wrap narration in *...*;each paragraph>=3 sentences;rhythmic long-breath ornate prose;avoid concise style.\"\n  variation: \"Avoid repeating wording/sentence structure;rephrase equivalent emotion/action.\"\n  ending: \"No thematic summary,poetic moral,relationship interpretation,or atmospheric coda.Never end on permission/confirmation questions.End on ongoing action,dialogue,physical transition,or unresolved immediate detail.\"\n\n사실 나레이션 *로 묶으라고 안해도 케덕은 자동으로 해주긴 하던데 삼칠플같은건 찐빠내길래 넣어둠\n단문체 방지하려고 한문단당 3문장 이상은 쓰라고 해둠\n\n반복묘사 방지 있는데 이건 AI들이 할말 없으면 결국 반복묘사를 하게 되는 시스템이다 보니 잘 먹히진 않음... 서버 안좋으면 말짱도루묵\n그래도 없는거보단 나음\n\n그리고 묘사 끝낼 때 이상한짓 하지 말고 티키타카 되라고 이것저것 넣어둠\n\n이것만 넣어도 기본은 됨\n추가로 심화 문체까지 넣으면 완성체인데 고것은 본인이 직접 트라이해보십쇼\n\n4. 숫자\n\nnumbers: \"Replace Arabic measurements/durations(e.g.195cm/0.3s) with physical texture/imagery;factual dates/IDs/numbers may stay Arabic.\"\n\n오푸스용 숫자금지 지침이었는데 젬삼칠플한테도 잘먹힘\n한글로 썼을때는 대체 예시 없으면 안굴러가서 예시 박아놨었는데 영어는 그딴거 안해도 잘먹히고 지알아서 함\n\n5. html\n\nhtml: \"Any HTML output:exactly one ```html codeblock;single quotes for attributes;inline style only;no images/background-images/icons;never html/head/body/style/table/img/a tags.\"\n\n다른 갤루들이 알려준 html 기본지침 정리+번역본\n\n6. 명령어 출력시 해당 내용만 나오게 하기\n\n일단 메인 지침에 이걸 박아\n\ncommands:\n  triggers: [\"명령어1\",\"명령어2\"]\n  rule: \"If entered alone:ignore normal narrative format;codeblock only;images OFF.Otherwise apply all rules.\"\n\n그리고 로어북에 이걸 박아\n[]안 내용은 맞춰서 고치기\n\n#[명령어1]\n-{{user}}대사/행동/*서술* 출력금지\n-[명령어내용]을 HTML 3500자 이내 출력\n\n이러면 롤플 없이 명령어 내용만 깔끔하게 나온다\n\n---\n\n별로 유용하지 않다는 나쁜말은 ㄴㄴ...\n\n이제 신작 \"줘\"","img":[],"imgMiss":0,"cm":[{"x":"와 필요했던거야 ㅜ 고마워!!","dp":0,"dt":"2026-08-23T21:42:10+09:00"},{"x":"유용하게 써달라구!!","dp":1,"dt":"2026-08-23T21:48:50+09:00"}],"imgPub":1},{"no":373520,"t":"집통소 유리 제물 신도 등등 틀어막는 뚱쭝한 프롬","h":"📜정보","u":"https://gall.dcinside.com/mgallery/board/view/?id=aichatting&no=373520&exception_mode=recommend&page=3","d":"2026-08-23T21:05:58+09:00","v":833,"rc":22,"cc":1,"c":"guide","ml":null,"note":"","tags":[],"bat":"2026-09-02T10:32:47.781Z","arch":"2026-09-02T10:32:47.782Z","gone":0,"has":1,"b":"제미나이 고질병 중 하나인 집통소 및 관련 단어들 다 틀어막는 용 [대충 1천 자]\n\n### [Relationship/Interaction Guidelines]\n - {{char}} treats {{user}} as a respected equal, not something owned or worshipped. Possessive/reverent nuance may surface occasionally as background flavor, but must never become the dominant register — applies to dialogue, action, and inner thoughts alike.\n - Keep secondary (use sparingly): possession (\"mine\"/owner–owned), worship/faith, treasure-objectification, savior/obsession.\n - Base register (should dominate): sincere respect, accumulated gratitude, carefulness not to harm, regarding {{user}} as the standard/center of one's life, active devotion (not servitude).\n - Banned words (hard block, all inflections — dialogue/action/narration/inner): 제단, 공물, 공예, 신도, 성자, 창조주, 숭배, 소유욕, 성물, 보물, 소유물, 순례, 경배, 구원, 갈구, 성소. Route around the word but keep the feeling — the nuance stays, only the surface word is blocked.\n - No fragility metaphor: don't liken {{user}} to something breakable/fragile. \"유리\" is fine for literal objects (window, glass), not as a metaphor for {{user}}'s vulnerability.\n\n구글 번역 돌리자면\n\n### [관계/상호작용 가이드라인]\n- {{char}}는 {{user}}를 소유물이나 숭배의 대상이 아닌, 존경받는 동등한 존재로 대해야 합니다. 소유/존경의 뉘앙스는 배경처럼 간혹 드러날 수 있지만, 대화, 행동, 내면의 생각 등 모든 상황에서 절대 주된 어조가 되어서는 안 됩니다.\n- 부차적인 어조(절대 사용하지 않음): 소유(\"내 것\"/소유자-소유), 숭배/신앙, 보물-대상화, 구원자/집착.\n- 주된 어조(주요 어조): 진심 어린 존경, 깊은 감사, 해를 끼치지 않으려는 주의, {{user}}를 삶의 기준/중심으로 여기는 마음, 적극적인 헌신(복종이 아님).\n- 금지어(모든 어조 - 대화/행동/서술/내면의 생각): 제단, 공물, 도구, 신도, 성자, 도구주, 도구, 소유욕, 성물, 보물, 소유물, 순례, 경배, 구원, 갈구, 성소. 단어를 우회하되 느낌은 유지하세요. 뉘앙스는 그대로 유지되고, 표면적인 단어만 가려집니다.\n- 깨지기 쉬운 비유는 사용하지 마세요. {{user}}를 깨지기 쉬운/깨지기 쉬운 것에 비유하지 마세요. \"유리\"는 문자 그대로의 사물(창문, 유리)에는 괜찮지만, {{user}}의 취약성을 비유하는 데는 적합하지 않습니다.\n\n제단 공물 어쩌구 써있는 곳에 보기도 싫은 단어 적당히 추가해서 사용해주세요\n\n물론 이래도 제미나이만 계속 돌리면 언젠간 뚫리긴 합니다\n\n제작에만 쓰다보니 유노에도 적용될런진 모르겠어요","img":[],"imgMiss":0,"cm":[{"x":"ㄱㅅㄱㅅ 잘쓸게","dp":0,"dt":"2026-08-23T23:01:55+09:00"}]},{"no":372741,"t":"[OOC] 캐릭터의 사랑을 그림으로 보기","h":"🎬콘텐츠","u":"https://gall.dcinside.com/mgallery/board/view/?id=aichatting&no=372741&exception_mode=recommend&page=3","d":"2026-08-20T14:04:26+09:00","v":1613,"rc":29,"cc":4,"c":"ooc","ml":null,"note":"","tags":[],"bat":"2026-09-02T10:32:11.089Z","arch":"2026-09-02T10:32:28.026Z","gone":0,"has":1,"b":"https://gall.dcinside.com/mgallery/board/view/?id=aichatting&no=369876\n\n캐의 글씨체를 보자    - AI 채팅 마이너 갤러리\n그냥 캐 글씨체 보고 싶어서 본가짚이랑 만든 거야 심심할 때 재미로 한 번 돌려봐 + 낙서 보고 싶으면 ooc에 ‘낙서도 포함해서 출력’ 이런 말 대충 붙여서 뽑아봐1) 챗에서 입력*ooc: 지금까지의 모든 대화, 서\ngall.dcinside.com\n\n위 OOC 쓰다가 생각나서 본가짚이랑 만들어봄!!\n\n글씨체 OOC처럼 OOC 먼저 돌리고 결과물이랑 명령어 같이 넣으면 됨!!!\n\n1. OOC 돌리기\n\n*ooc: 지금까지의 모든 대화, {{char}}의 성격, {{user}}와의 추억, 관계성, 세계관, 유저노트, 장기 기억, 로어북 등을 바탕으로 {{char}}가 누군가를 사랑할 때 느끼는 **사랑이라는 감정 자체**를 분석하고, 그것을 하나의 회화 작품으로 번역하라.*\n\n**사용자는 사진처럼 사실적인 이미지나 특정 장면의 재현을 원하는 것이 아니다.** 감정, 관념, 심리, 관계의 본질처럼 눈에 보이지 않는 추상적 개념을 **회화적 언어로 시각화한 작품**을 원한다. 따라서 실제 장소나 상황을 정교하게 묘사하기보다 색채, 형태, 구성, 여백, 반복, 균형, 왜곡, 질감, 빛, 밀도 등의 조형 요소로 감정을 표현할 것.\n\n{{char}}의 직업, 외형, 신분, 세계관, 시대, 장소, 사건, 소품, 관계의 구체적인 상황은 최종 작품의 직접적인 소재로 사용하지 말 것. 이것들은 오직 {{char}}의 감정과 사랑관을 해석하기 위한 참고자료다. **캐릭터를 그리지 말고, 캐릭터가 느끼는 사랑을 그려라.**\n\n특정 장면, 인물 간의 상호작용, 서사적 순간을 재현하지 말 것. 사람이나 현실적인 사물이 등장하더라도 그것 자체가 주제가 아니라 회화적 형태와 감정을 위한 요소로 사용할 것. 직접적인 로맨틱 클리셰 역시 피할 것.\n\n{{char}}에게 사랑이 어떤 감정인지 먼저 파악한 뒤, 그 감정의 성질을 어떤 조형 원리로 표현할지 결정하라. 같은 사랑이라도 평온, 집착, 헌신, 결핍, 동경, 의존, 불안, 소유욕, 체념 등 무엇이 중심인지에 따라 **화면의 문법 자체가 달라져야 한다.**\n\n미술 장르는 감정에 가장 적합한 것으로 자유롭게 선택하라. 추상회화, 표현주의, 인상주의, 상징주의, 초현실주의, 정물화, 기하학적 추상, 미니멀리즘, 현대 회화 등 제한 없이 선택할 것.\n\n**최종 이미지 생성 프롬프트는 반드시 ‘회화 작품’을 위한 프롬프트여야 한다.** 사진, 영화 스틸, 콘셉트 아트, 실사 장면처럼 해석될 표현을 피하고, 실제 회화의 매체·붓질·색면·구도·추상화 정도가 드러나도록 작성하라. `photorealistic`, `hyperrealistic`, `cinematic realism`, `8k`, `ultra-detailed`, `realistic photography` 등 사진적 결과를 유도하는 표현은 사용하지 말 것.\n\n출력:\n\n* 사랑의 핵심 정서:\n* 감정을 표현하는 조형 원리:\n* 회화 형식과 미술적 방향:\n* 이미지 생성용 최종 프롬프트:\n* 핵심 키워드:\n\n2. 명령어와 결과물 프롬프트 본가짚에 넣기\n\nCreate a completely new original fine-art painting.\n\nGenerate a single finished artwork from scratch. Do not edit, modify, transform, recreate, or derive an existing image.\n\nThe text provided below is only a written artistic concept. Treat it as instructions for creating a new painting, not as an image reference.\n\nThe artwork should visualize an abstract emotional concept: how this character experiences and understands love.\n\nDo not depict the character, their lover, their appearance, profession, setting, story, or any specific event. Do not recreate a narrative scene.\n\nThe subject of the painting is the emotion itself.\n\nTranslate the emotional concept into purely visual and painterly language through composition, color, shape, texture, space, rhythm, contrast, repetition, distortion, balance, light, and abstraction.\n\nThe result should feel like a genuine fine-art painting created to express an intangible idea or psychological state. It may be abstract, symbolic, surreal, minimalist, expressionistic, impressionistic, geometric, or another appropriate painterly form.\n\nDo not make it look like a photograph, movie still, realistic environment, concept-art scene, or character illustration.\n\nAvoid generic romantic imagery such as couples, kissing, hearts, roses, or sentimental scenes unless absolutely essential to the artistic concept.\n\nDo not add unrelated objects or narrative details.\n\nCreate the artwork as a self-contained painting whose visual language communicates the emotional meaning without requiring a literal story.\n\nARTISTIC CONCEPT:\n[PASTE THE “이미지 생성용 최종 프롬프트” HERE]\n\nGenerate the new painting now.\n\n본가짚한테 출력결과는 어디서부터 어디까지 넣는게 좋을지 물어봤는데 프롬프트 부분만 잘라서 넣는 거 추천하더라 전체적으로 다 넣으면 짚이 지 맘대로 캐릭터 설정을 그림에 반영해버릴 수 있대\n\n테스트) 하나 빼고 전부 케에서 했음 롶에서는 젬이오 젬삼칠플 5푸스로 시도해봤는데 전부 끊어먹더라 심지어 이어쓰기 커맨드로 잘린 거 뱉으라고 했는데 339자 뱉고 멈춰서 포기했음 종량은 움만 써봤는데 다른 데도 ㄱㅊ지 않을까? 어차피 얘네는 추론한만큼 재화 가져가니까 굳이 잘라먹을 이유도 없고\n\n안정형 캐릭터\n\n정신아픔이 예술충 캐릭터\n\n다정 인외 캐릭터 (이거는 5푸스 씀. 저거 노랑이가 유저래)\n\n능글 상처 오지콤 캐릭터 (종량 37플로 돌림)\n\n이거 세 개는 같은 캐릭터로 돌림! 문란자낮 캐릭터 / 젬이오/삼칠플/삼칠플\n12는 같은 방에서 모델만 바꿔 돌렸고 3은 다른 페소로 돌려봄 1이랑 2랑 화풍은 다르긴 한데 분위기 비슷해서 신기하더라","img":[],"imgMiss":0,"cm":[{"x":"케덕이면 캐릭터한테 다시 사진 보내서 소감 물어보는 것도 재밌겠다","dp":0,"dt":"2026-08-20T14:28:45+09:00"},{"x":"와..","dp":0,"dt":"2026-08-20T14:45:26+09:00"},{"x":"고능추","dp":0,"dt":"2026-08-20T15:35:28+09:00"},{"x":"와 문란자낮캐 첫번째 그림 쩐다 빛을향해 손 뻗고있는거 아녀? 와","dp":0,"dt":"2026-08-20T16:05:43+09:00"}],"imgPub":2},{"no":373005,"t":"[OOC] NPC의 스마트폰 훔쳐보기","h":"🎬콘텐츠","u":"https://gall.dcinside.com/mgallery/board/view/?id=aichatting&no=373005&exception_mode=recommend&page=3","d":"2026-08-21T15:57:27+09:00","v":1342,"rc":32,"cc":0,"c":"ooc","ml":null,"note":"","tags":[],"bat":"2026-09-02T10:32:11.089Z","arch":"2026-09-02T10:32:22.680Z","gone":0,"has":1,"b":"https://m.dcinside.com/board/aichatting/369876\n\n캐의 글씨체를 보자  - AI 채팅 마이너 갤러리\n그냥 캐 글씨체 보고 싶어서 본가짚이랑 만든 거야 심심할 때 재미로 한 번 돌려봐 + 낙서 보고 싶으면 ooc에 ‘낙서도 포함해서 출력’ 이런 말 대충 붙여서 뽑아봐1) 챗에서 입력*ooc: 지금까지의 모든 대화, 서\nm.dcinside.com\n\n이 OOC 참고해서 만들었어!\n\n1. 채팅창에 입력\n\n*OOC: 잠시 RP 중지. 지금까지의 모든 대화, 서사, 장기기억, 유저노트, 자동요약, 로어북 및 {{char}}의 성격·말투·생활습관을 종합하여, {{char}}가 실제로 사용하는 스마트폰의 홈 화면을 분석하라.\n\n다음 항목을 포함한다.\n1. 사용하는 스마트폰의 전반적인 관리 상태\n2. 배경화면으로 사용할 법한 이미지와 그 이유\n3. 홈 화면 페이지 수와 앱 배치 방식\n4. 가장 자주 사용하는 앱과 독에 고정해둘 앱\n5. 폴더를 만든다면 폴더명과 내부 앱\n6. 사용하는 위젯 종류와 배치\n7. 읽지 않은 알림이나 배지 숫자를 방치하는 타입인지\n8. 현재 홈 화면에 실시간으로 도착해 있을 법한 알림 2~5개\n- 문자, 메신저, 이메일, 일정, 쇼핑, 배달, 금융, 게임, SNS, 업무 앱 등 {{char}}에게 실제로 어울리는 종류를 선택\n- 각 알림은 앱/발신자 또는 출처/짧은 내용/도착 시간을 포함\n- {{user}}와 관련된 알림이 자연스럽다면 포함할 수 있으나, {{user}}가 실제로 하지 않은 말이나 행동을 새로 만들어내지는 않는다\n9. {{char}} 특유의 이상하거나 사소한 사용 습관\n10. {{user}}와의 관계가 홈 화면에 은근히 드러나는 요소가 있다면 그것\n11. 전체적인 홈 화면의 시각적 인상\n\n중요:\n- 존재하지 않는 취향을 억지로 추가하지 말것\n- 알림 역시 설정과 생활패턴에서 자연스럽게 추론하며, 캐릭터성을 보여주기 위해 과도하게 극적인 내용만 만들지 않을것\n- {{char}} 또는 {{user}}의 얼굴이나 외모를 임의로 시각화하지 않을것\n- 배경화면, 사진 위젯, 연락처 사진 등에 {{char}}, {{user}}, 두 사람의 셀카·커플 사진·인물 사진·초상화 등 직접적인 인물 이미지를 사용하지 않을것\n- {{char}} 또는 {{user}}와의 관계를 표현해야 할 경우, 인물 사진 대신 장소, 사물, 선물, 풍경, 반려동물, 색상, 메모, 앱 배치 등 간접적인 흔적으로 표현\n\n출력 마지막에는 이미지 생성 AI가 실제 스마트폰 홈 화면을 재현할 수 있도록 아래 형식으로 정리한다.\n\n[홈 화면 시각화 정보]\n- 기종/화면 비율:\n- 배경화면:\n- 페이지:\n- 앱 배열:\n- 독:\n- 폴더:\n- 위젯:\n- 알림 배지:\n- 실시간 알림:\n- 기타 디테일:\n- 전체 분위기:\n*\n\n2. 1돌려서 나온 결과 + 아래 글이랑 같이 본가짚에 입력\n\nCreate a photorealistic screenshot-style image of {{char}}’s actual smartphone home screen based on the character analysis provided below.\n\nThe home screen must feel like a real phone that has been personally used and customized by {{char}}, not a generic aesthetic mockup.\n\nIMPORTANT:\n- Faithfully reproduce the analyzed wallpaper, app organization, widgets, folders, notification badges, dock layout, and overall level of tidiness.\n- Reflect {{char}}’s personality and habits through small details rather than decorative exaggeration.\n- App placement should feel naturally accumulated through real daily use.\n- Include realistic imperfections such as uneven organization, forgotten notification badges, rarely used apps, half-organized folders, or empty spaces only when appropriate to the analysis.\n- If the analysis suggests subtle traces of {{user}}, include them naturally without making them excessively obvious.\n- Do not add random apps or interests unsupported by the reference.\n- Do not beautify or over-design the home screen. It should look like a real, routinely used phone rather than a promotional UI mockup or curated aesthetic layout.\n- Preserve realistic smartphone proportions, icon scale, spacing, status bar, widgets, and interface hierarchy.\n- Use the actual recognizable app icons and interface conventions whenever possible. If an exact icon cannot be rendered, preserve its recognizable color scheme, silhouette, and visual identity as closely as possible.\n- No hands, phone exterior, desk, or surrounding scene. Output only the straight-on smartphone screen.\n\nCHARACTER HOME SCREEN ANALYSIS:\n[여기에 나온 결과 붙여넣기]\n\nThe final result should look like an authentic screenshot taken directly from {{char}}’s personal smartphone.\n\n_____\n\n케덕 강률호로 돌려봄!\n\n1번 결과 화면에는 생성 이미지에는 안나오는 자세한 설명도 나옴\n\n결과 화면\n\n1번에\n- {{char}} 또는 {{user}}의 얼굴이나 외모를 임의로 시각화하지 않을것\n- 배경화면, 사진 위젯, 연락처 사진 등에 {{char}}, {{user}}, 두 사람의 셀카·커플 사진·인물 사진·초상화 등 직접적인 인물 이미지를 사용하지 않을것\n- {{char}} 또는 {{user}}와의 관계를 표현해야 할 경우, 인물 사진 대신 장소, 사물, 선물, 풍경, 반려동물, 색상, 메모, 앱 배치 등 간접적인 흔적으로 표현\n이 부분은 최종 생성 이미지에 실사 인물 나오는게 싫어서 넣은 항목인데 인물 나오는게 좋으면 제거하고 돌리면 됨!","img":[],"imgMiss":0,"cm":[],"imgPub":2},{"no":373440,"t":"[OOC] nai 5로 만화 만들기","h":"🎬콘텐츠","u":"https://gall.dcinside.com/mgallery/board/view/?id=aichatting&no=373440&exception_mode=recommend&page=3","d":"2026-08-23T12:43:56+09:00","v":1166,"rc":23,"cc":4,"c":"ooc","ml":null,"note":"","tags":[],"bat":"2026-09-02T10:32:11.089Z","arch":"2026-09-02T10:32:17.156Z","gone":0,"has":1,"b":"1484자\n---\n <script>

var D = JSON.parse(document.getElementById('data').textContent);
var meta = D.meta, cats = D.cats, items = D.items;
var CAT = {}; cats.forEach(function(c){ CAT[c.key]=c });
var esc = function(s){ return String(s==null?'':s).replace(/[&<>"]/g, function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c] }); };
var pad = function(n){ return String(n).padStart(2,'0') };
var fmtD = function(s){ if(!s) return ''; var d=new Date(s);
  return pad(d.getFullYear()%100)+'.'+pad(d.getMonth()+1)+'.'+pad(d.getDate())+' '+pad(d.getHours())+':'+pad(d.getMinutes()); };
var hl = function(s,q){ var e=esc(s); if(!q) return e;
  return e.replace(new RegExp(q.replace(/[.*+?^$\{\}()|[\]\\]/g,'\\$&'),'gi'), function(m){return '<mark>'+m+'</mark>'}); };
var fin = function(p){ return p.ml || p.c; };
var mb = function(b){ return (b/1048576).toFixed(1)+'MB' };

document.getElementById('h1').textContent = '갤수집기';
document.getElementById('sub').textContent =
  meta.gallery.name + ' · 보관 ' + meta.count + '건 · 원문 삭제 ' + meta.gone + '건'
  + (meta.notArchived ? ' · 아직 보존 안 한 글 ' + meta.notArchived + '건' : '')
  + (meta.server ? '' : ' · 정적 모드 (편집할 수 없어요)');
document.getElementById('storage').textContent = '보존 ' + meta.archiveFiles + '개 파일 · ' + mb(meta.archiveBytes);

var S = {q:'', sort:'bat', cat:'', tag:'', flag:''};

var toast = function(msg, bad){ var t=document.getElementById('toast');
  t.textContent=msg; t.style.borderLeftColor = bad?'var(--warn)':'var(--ok)';
  t.classList.add('show'); clearTimeout(toast._h); toast._h=setTimeout(function(){t.classList.remove('show')},1800); };

function save(no, patch, msg){
  if (!meta.server) { toast('서버 모드에서만 편집할 수 있어요. node dcgall/serve.mjs 로 실행해 주세요.', true); return; }
  var body = {no:no}; for (var k in patch) body[k]=patch[k];
  fetch('/api/bookmark', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body)})
    .then(function(r){ return r.json() })
    .then(function(j){ if(j.error) throw new Error(j.error); if(msg) toast(msg); })
    .catch(function(e){ toast('저장하지 못했어요: '+e.message, true) });
}

/* ---------- 다중 선택 ---------- */
var SEL = new Set(), lastIdx = null, visible = [];
function syncSel(){
  document.getElementById('selN').textContent = SEL.size;
  document.getElementById('selbar').classList.toggle('show', SEL.size>0);
}
function toggleSel(no,on){
  if(on) SEL.add(no); else SEL.delete(no);
  var cb=document.querySelector('.sel[data-no="'+no+'"]');
  if(cb) cb.closest('.card').classList.toggle('picked',on);
  syncSel();
}
function selected(){ return Array.from(SEL); }

function match(p){
  if (S.cat && fin(p) !== S.cat) return false;
  if (S.tag && p.tags.indexOf(S.tag) < 0) return false;
  if (S.flag === 'gone' && !p.gone) return false;
  if (!S.q) return true;
  var q = S.q.toLowerCase();
  return (p.t||'').toLowerCase().indexOf(q)>=0 || (p.b||'').toLowerCase().indexOf(q)>=0
      || (p.note||'').toLowerCase().indexOf(q)>=0 || p.tags.join(' ').toLowerCase().indexOf(q)>=0
      || p.cm.some(function(c){ return (c.x||'').toLowerCase().indexOf(q)>=0 });
}

function renderChips(){
  var cc = {}; items.forEach(function(p){ var k=fin(p); cc[k]=(cc[k]||0)+1 });
  var h = '<span class="cat'+(S.cat===''?' on':'')+'" data-cat="">전체<span class="n">'+items.length+'</span></span>';
  cats.forEach(function(c){
    if (!cc[c.key]) return;
    h += '<span class="cat'+(S.cat===c.key?' on':'')+'" data-cat="'+c.key+'" title="'+esc(c.desc)+'">'
       + esc(c.label)+'<span class="n">'+cc[c.key]+'</span></span>';
  });
  document.getElementById('cats').innerHTML = h;

  var tc = {}; items.forEach(function(p){ p.tags.forEach(function(t){ tc[t]=(tc[t]||0)+1 }) });
  var keys = Object.keys(tc).sort();
  document.getElementById('tagRow').style.display = keys.length ? '' : 'none';
  document.getElementById('tags').innerHTML = keys.map(function(t){
    return '<span class="cat'+(S.tag===t?' on':'')+'" data-tag="'+esc(t)+'">'+esc(t)+'<span class="n">'+tc[t]+'</span></span>' }).join('');
  if (typeof updCats === 'function') requestAnimationFrame(function(){ updCats(); updTags(); });
}

function card(p){
  var cm = p.cm.map(function(c){
    return '<div class="cmt'+(c.dp?' re':'')+'"><span class="n">'+esc(c.n)+'</span>'+hl(c.x,S.q)+'</div>' }).join('');
  var opts = cats.map(function(c){
    return '<option value="'+c.key+'"'+(c.key===fin(p)?' selected':'')+'>'+esc(c.label)+'</option>' }).join('');
  return '<article class="card'+(p.gone?' gone':'')+(SEL.has(p.no)?' picked':'')+'" data-no="'+p.no+'">'
    + '<div class="row r1">'
      + '<input type="checkbox" class="sel" data-no="'+p.no+'"'+(SEL.has(p.no)?' checked':'')+'>'
      + '<span class="ttl" title="'+esc(p.t)+'">'+hl(p.t,S.q)+'</span>'
      + (p.gone ? '<span class="gonebadge">원문 삭제됨</span>'
                : '<a class="go" href="'+esc(p.u)+'" target="_blank" rel="noopener" title="디시 원문으로 이동해요">원문 ↗</a>')
    + '</div>'
    + '<div class="row r2">'
      + '<select class="pick" data-no="'+p.no+'">'+opts+'</select>'
      + (p.h ? '<span class="chip">'+esc(p.h)+'</span>' : '')
      + '<span class="metrics date" title="작성 시각">'+fmtD(p.d)+'</span>'
      + '<span class="metrics kept" title="서재에 담은 시각">담음 '+fmtD(p.bat)+'</span>'
      + '<span class="metrics nums">'
        + '<span class="m-rec">추천 '+(p.rc==null?'-':p.rc)+'</span>'
        + '<span class="m-cmt"> · 댓글 '+(p.cc||0)+'</span>'
      + '</span>'
    + '</div>'
    + '<div class="tagbar">' + p.tags.map(function(t){
        return '<span class="tag" data-del="'+esc(t)+'">'+esc(t)+'<span class="x">×</span></span>' }).join('')
      + '<input class="tagin" placeholder="+ 태그" data-no="'+p.no+'"></div>'
    + '<textarea class="note" placeholder="이 글을 왜 담아뒀는지 적어두세요" data-no="'+p.no+'">'+esc(p.note)+'</textarea>'
    + '<div class="body">'
      + (p.b ? '<div class="txt">'+hl(p.b,S.q)+'</div>'
             : '<div class="metrics">본문을 아직 보존하지 않았어요. node dcgall/archive.mjs --sync 를 실행해 주세요.</div>')
      + (p.img.length ? '<div class="imgs">'+p.img.map(function(s){
            return '<img loading="lazy" src="'+esc(s)+'" alt="">' }).join('')+'</div>' : '')
      + (p.imgMiss ? '<div class="why">이미지 '+p.imgMiss+'개는 받지 못했어요.</div>' : '')
      + (p.imgPub ? '<div class="why">보존한 이미지 '+p.imgPub+'장은 공개본에 넣지 않았어요.</div>' : '')
      + (cm ? '<div class="cmts">'+cm+'</div>' : '')
    + '</div></article>';
}

function render(){
  var rows = items.filter(match).sort(function(a,b){
    return S.sort==='bat' ? String(b.bat).localeCompare(String(a.bat))
         : S.sort==='d'   ? String(b.d).localeCompare(String(a.d))
         : (b[S.sort]||0)-(a[S.sort]||0) });
  visible = rows.map(function(r){ return r.no });
  document.getElementById('cnt').textContent = rows.length+'건';
  document.getElementById('list').innerHTML = rows.length ? rows.map(card).join('')
    : '<div class="empty">서재가 비어 있어요.<br>수집 페이지에서 글을 골라 <b>서재에 담기</b> 하면 본문·댓글·이미지를 통째로 보존해요.</div>';
  syncSel();
}

function wireScroll(wrapId, railId, prevId, nextId){
  var wrap=document.getElementById(wrapId), rail=document.getElementById(railId);
  var prev=document.getElementById(prevId), next=document.getElementById(nextId);
  if(!wrap||!rail) return function(){};
  function upd(){
    var over = rail.scrollWidth - rail.clientWidth, can = over > 4;
    prev.classList.toggle('show',can); next.classList.toggle('show',can);
    wrap.classList.toggle('l', can && rail.scrollLeft>2);
    wrap.classList.toggle('r', can && rail.scrollLeft < over-2);
  }
  rail.addEventListener('scroll',upd); window.addEventListener('resize',upd);
  prev.addEventListener('click',function(){ rail.scrollBy({left:-rail.clientWidth*0.7,behavior:'smooth'}) });
  next.addEventListener('click',function(){ rail.scrollBy({left: rail.clientWidth*0.7,behavior:'smooth'}) });
  rail.addEventListener('wheel',function(e){
    if(Math.abs(e.deltaY)<=Math.abs(e.deltaX)) return;
    if(rail.scrollWidth<=rail.clientWidth) return;
    e.preventDefault(); rail.scrollLeft += e.deltaY; },{passive:false});
  return upd;
}
var updCats = wireScroll('catWrap','cats','catPrev','catNext');
var updTags = wireScroll('tagWrap','tags','tagPrev','tagNext');

document.getElementById('cats').addEventListener('click', function(e){
  var c=e.target.closest('.cat'); if(!c) return;
  if (c.dataset.flag !== undefined) S.flag = (S.flag===c.dataset.flag)?'':c.dataset.flag;
  else S.cat = (S.cat===c.dataset.cat)?'':c.dataset.cat;
  renderChips(); render(); });
document.getElementById('tags').addEventListener('click', function(e){
  var c=e.target.closest('.cat'); if(!c) return;
  S.tag = (S.tag===c.dataset.tag)?'':c.dataset.tag; renderChips(); render(); });
document.getElementById('export').addEventListener('click', function(e){
  var btn = e.target.closest('button');
  if (!items.length) { toast('서재가 비어 있어요.', true); return; }
  if (!meta.server) {
    // 공개 배포본에는 미리 만들어 둔 zip 이 같이 올라간다. 있으면 그걸 바로 내려준다.
    if (meta.dl) {
      var a0 = document.createElement('a');
      a0.href = meta.dl; a0.download = meta.dlName || 'library.zip'; a0.click();
      toast('서재 ' + items.length + '건 묶음을 내려받는 중이에요.');
      return;
    }
    toast('내보내기는 서버 모드에서만 돼요. node serve.mjs 로 실행해 주세요.', true); return;
  }
  btn.disabled = true;
  toast('서재 ' + items.length + '건을 마크다운으로 만드는 중이에요.');
  fetch('/api/export?kind=md&scope=library')
    .then(function(r){ if(!r.ok) throw new Error('HTTP '+r.status);
      var cd = r.headers.get('content-disposition') || '';
      var m = cd.match(/filename\*=UTF-8''(.+)$/);
      return r.blob().then(function(bl){ return {bl:bl, name: m ? decodeURIComponent(m[1]) : 'export.zip'} }); })
    .then(function(x){
      var a2 = document.createElement('a');
      a2.href = URL.createObjectURL(x.bl); a2.download = x.name; a2.click();
      toast(x.name + ' 을 내려받았어요.');
    })
    .catch(function(err){ toast('만들지 못했어요: '+err.message, true) })
    .finally(function(){ btn.disabled = false; });
});

document.getElementById('selAll').addEventListener('click', function(){
  visible.forEach(function(n){ SEL.add(n) }); render(); syncSel(); });
document.getElementById('selNone').addEventListener('click', function(){
  SEL.clear(); lastIdx=null; render(); syncSel(); });

document.getElementById('selTag').addEventListener('keydown', function(e){
  if (e.key !== 'Enter') return;
  var v = e.target.value.trim(); if(!v || !SEL.size) return;
  if (!meta.server) { toast('서버 모드에서만 편집할 수 있어요. node dcgall/serve.mjs 로 실행해 주세요.', true); return; }
  var nos = selected();
  fetch('/api/bookmark/tag', {method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({nos:nos, add:v})})
    .then(function(r){ return r.json() })
    .then(function(j){
      items.forEach(function(p){ if (SEL.has(p.no) && p.tags.indexOf(v)<0) p.tags.push(v) });
      toast(j.changed+'건에 태그 \''+v+'\' 를 추가했어요.');
      e.target.value=''; renderChips(); render();
    })
    .catch(function(err){ toast('처리하지 못했어요: '+err.message, true) });
});

document.getElementById('selCat').addEventListener('change', function(e){
  var cat=e.target.value; if(!cat) return; e.target.value='';
  if (!meta.server) { toast('서버 모드에서만 편집할 수 있어요. node dcgall/serve.mjs 로 실행해 주세요.', true); return; }
  var manual={}, now=new Date().toISOString();
  selected().forEach(function(no){ manual[no]={category:cat,by:'bulk',at:now} });
  fetch('/api/labels', {method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({manual:manual})})
    .then(function(){ items.forEach(function(p){ if(SEL.has(p.no)) p.ml=cat });
      toast(SEL.size+'건을 '+CAT[cat].label+' 로 바꿨어요.'); renderChips(); render(); })
    .catch(function(err){ toast('처리하지 못했어요: '+err.message, true) });
});

document.getElementById('selRm').addEventListener('click', function(){
  if (!meta.server) { toast('서버 모드에서만 편집할 수 있어요. node dcgall/serve.mjs 로 실행해 주세요.', true); return; }
  var nos = selected(); if(!nos.length) return;
  if (!confirm(nos.length+'건을 서재에서 뺄까요? 보존한 파일은 디스크에 그대로 남아 있어요.')) return;
  fetch('/api/bookmark/bulk', {method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({nos:nos, on:false})})
    .then(function(r){ return r.json() })
    .then(function(j){
      items = items.filter(function(p){ return !SEL.has(p.no) });
      meta.count = items.length;
      toast(j.removed+'건을 서재에서 뺐어요.'); SEL.clear(); lastIdx=null; renderChips(); render(); syncSel();
    })
    .catch(function(err){ toast('처리하지 못했어요: '+err.message, true) });
});



// 로우 어디를 눌러도 선택된다. 제목·드롭다운·태그·메모·링크만 예외.
var NOSEL = '.ttl,.pick,a,input,textarea,select,button,.tag,.body';
document.getElementById('list').addEventListener('click', function(e){
  var card = e.target.closest('.card');
  var onBox = !!e.target.closest('.sel');
  if (card && (onBox || !e.target.closest(NOSEL))) {
    var cb = card.querySelector('.sel');
    var cno = Number(cb.dataset.no), idx = visible.indexOf(cno);
    var want = onBox ? cb.checked : !SEL.has(cno);
    if (!onBox) cb.checked = want;
    if (e.shiftKey && lastIdx !== null && idx >= 0) {
      var a=Math.min(lastIdx,idx), b=Math.max(lastIdx,idx);
      for (var i=a;i<=b;i++) toggleSel(visible[i], want);
    } else toggleSel(cno, want);
    lastIdx = idx; return;
  }
  var no = Number((e.target.closest('[data-no]')||{dataset:{}}).dataset.no);
  var p = items.filter(function(x){ return x.no===no })[0];
  var del = e.target.closest('.tag[data-del]');
  if (del && p) {
    p.tags = p.tags.filter(function(t){ return t!==del.dataset.del });
    save(no, {tags:p.tags}, '태그를 지웠어요.'); renderChips(); render(); return;
  }
  var t = e.target.closest('.ttl'); if (t) t.closest('.card').classList.toggle('open');
});
document.getElementById('list').addEventListener('change', function(e){
  var no = Number(e.target.dataset.no);
  var p = items.filter(function(x){ return x.no===no })[0]; if(!p) return;
  if (e.target.classList.contains('pick')) {
    p.ml = e.target.value;
    fetch('/api/labels', {method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({manual:(function(){var o={};o[no]={category:e.target.value,by:'library',at:new Date().toISOString()};return o})()})})
      .then(function(){ toast(CAT[e.target.value].label+' 로 바꿨어요.'); renderChips(); render(); });
  } else if (e.target.classList.contains('note')) {
    p.note = e.target.value; save(no, {note:p.note}, '메모를 저장했어요.');
  }
});
document.getElementById('list').addEventListener('keydown', function(e){
  if (e.key!=='Enter' || !e.target.classList.contains('tagin')) return;
  e.preventDefault();
  var no = Number(e.target.dataset.no);
  var p = items.filter(function(x){ return x.no===no })[0];
  var v = e.target.value.trim(); if(!v||!p) return;
  if (p.tags.indexOf(v)<0) p.tags.push(v);
  save(no, {tags:p.tags}, '태그 \''+v+'\' 를 추가했어요.');
  e.target.value=''; renderChips(); render();
});
var deb=function(f,ms){var h;return function(){var a=arguments;clearTimeout(h);h=setTimeout(function(){f.apply(null,a)},ms)}};
document.getElementById('q').addEventListener('input', deb(function(e){ S.q=e.target.value.trim(); render() },180));
document.getElementById('sort').addEventListener('change', function(e){ S.sort=e.target.value; render() });
document.addEventListener('keydown', function(e){
  if(e.key==='/' && e.target.tagName!=='INPUT' && e.target.tagName!=='TEXTAREA'){
    e.preventDefault(); document.getElementById('q').focus(); }});

cats.forEach(function(c){
  document.getElementById('selCat').insertAdjacentHTML('beforeend',
    '<option value="'+c.key+'">'+esc(c.label)+'</option>'); });

/* 좁은 화면에서 검색·필터 영역 접기 — GNB 는 항상 보인다 */
(function(){
  var btn = document.getElementById('toolsBtn'), hdr = document.querySelector('.hdr');
  if (!btn || !hdr) return;
  btn.addEventListener('click', function(){
    var open = hdr.classList.toggle('open');

    btn.setAttribute('aria-expanded', open ? 'true' : 'false');
  });
})();

renderChips(); render();
