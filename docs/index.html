 서사 분위기 따라 변경해도 좋을듯 (똑같이 노랗게 칠했음)\n\n맨 밑에 사족도 조금 달았음\n\n1. 신년 인사(새해 편지)\n\n****\n\n[OOC: 롤플레잉 중단. NPC={{char}}, PC={{user}}.\n\n해가 바뀌었다. NPC가 새벽에 혼자 깨어 PC에게 신년 편지를 쓴다.\n\n연도는 대화 내역상 마지막 시점의 다음 해로 잡는다.\n\n담을 것\n\n· 지난해 PC와의 일 중 잊지 못하는 순간 다섯. 언제 어디서였는지 한 줄로 짚고, 그때 속으로 무슨 생각을 하고 있었는지\n    이제야 밝힌다.\n\n· 다섯 중 하나는 NPC가 부끄러워하는 순간일 것.\n\n· 올해 PC와 하고 싶은 일 셋, 자신에게 거는 다짐 한 줄.\n\n캐릭터 반영\n\n· NPC가 감정을 부를 때 대신 쓰는 습관적 단어가 있다면, 편지에서 그 단어로 쓰려다 실패하고 고쳐 쓰는 장면을\n    만든다.\n\n· NPC가 늘 곁에 두는 사물 하나를 골라 첫 문단과 끝 문단에 각각 등장시킨다.\n\n· PC의 말버릇이나 반복 행동 하나를 NPC가 진작 알아채고 있었음을 흘린다.\n\n편지체로만 쓴다. 묘사체 금지. NPC의 1인칭·어휘·문장 길이 유지. 없는 사건은 만들지 않는다.\n\n대화 내역·장기기억·자동요약·관계성·로어북·유저노트 근거. 공백 포함 3000자 이상.\n\n출력: 인라인 style만 사용, style태그·class·id 금지.\n\n속성값은 작은따옴표만 사용. 모든 부분에 쌍따옴표 절대 사용 금지.\n\n내용이 빈 p·div·br 태그를 만들지 않는다. 모든 간격은 margin 값으로만 준다.\n\n모든 요소에 box-sizing:border-box 를 넣고, 고정 width 대신 max-width 만\n    쓴다.\n\n배경 #FFFFFF 글씨 #000000 포인트 #8A7CA8. 폰트는 모든 태그에 개별 지정하고\n    !important.\n\nwidth 100% max-width 600px 중앙정렬 padding 40px 32px line-height\n    2.0.\n\n우상단 날짜 0.8em 회색, 본문 첫 글자 드롭캡 2.6em 포인트컬러, 다섯 기억 앞에 ❧ 하나씩,\n\n다짐은 border-left 2px solid 포인트컬러에 padding-left 16px,\n\n서명은 우측정렬 이탤릭 포인트컬러. 코드블록 금지, 상태창 미출력.]\n\n****\n\n출력 예시: 케이브덕 기디언 브로건(https://ko.cvdk.io/c/3Jtodw9fSn-5GO9x-OpBew)\n\n- 비고: 혹시 특정 연도의 새해 인사를 받고 싶다면 '해가 바뀌었다.' 를 '해가 YYYY년으로 바뀌었다.'로 수정하면 됨\n\n2. 프러포즈(청혼)\n\n****\n\n[OOC: 롤플레잉 중단. NPC={{char}}, PC={{user}}.\n\nNPC가 PC에게 청혼한다. 말이 서툰 인물이므로 그 자리에서 읽으려고 미리 적어둔 원고 형태로 쓴다. 고쳐 쓴 흔적을 실제로\n    남긴다.\n\n담을 것\n\n· 청혼을 결심한 순간. 거창한 날이 아니라 아주 사소한 장면이어야 한다.\n\n· 데려가고 싶은 기억 다섯. 하나는 PC를 잃을 뻔한 날, 하나는 용서받았다고 느낀 날, 하나는 아무 일도 없던 평범한 날.\n    각 기억 끝에 그때 삼킨 말을 한 문장씩.\n\n· 지킬 수 있는 약속과 못 지킬지도 모르는 것을 나눠 적는다. 후자를 얼버무리지 않는다.\n\n· 마지막 한 줄로 청혼. 상투구 대신 NPC가 실제로 쓸 법한 말로.\n\n캐릭터 반영\n\n· NPC가 지금까지 PC에게 무언가를 요구하거나 허락해온 방식이 있다면, 이 청혼에서 그 방식이 뒤집히거나 스스로 어긋나는\n    지점을 만든다.\n\n· 지운 문장 두 개를 실제로 남긴다. 처음엔 명령조로 썼다가 부탁조로 고치는 식으로.\n\n· NPC가 PC를 부르는 호칭이 편지 안에서 한 번 흔들렸다가 제자리로 돌아오게 한다.\n\nNPC의 1인칭·화법 유지. 감정이 넘칠 때 문장을 짧게, 변명할 때 길게.\n\n대화 내역·장기기억·자동요약·관계성·로어북·유저노트에 실재하는 사건만. 공백 포함 3000자 이상.\n\n출력: 인라인 style만, style태그·class·id 금지.\n\n속성값은 작은따옴표만 사용. 모든 부분에 쌍따옴표 절대 사용 금지.\n\n내용이 빈 p·div·br 태그를 만들지 않는다. 모든 간격은 margin 값으로만 준다.\n\n모든 요소에 box-sizing:border-box 를 넣고, 고정 width 대신 max-width 만\n    쓴다.\n\n배경 #FFFFFF 글씨 #000000 포인트 #8C3A4A. 폰트는 모든 태그에 개별 지정 +\n    !important.\n\nwidth 100% max-width 580px 중앙정렬 padding 42px 32px line-height\n    2.0.\n\n지운 문장은 line-through 에 색 #AAAAAA, 고쳐 쓴 문장은 바로 아랫줄에 정상 색으로.\n\n기억 앞에 ✦ 하나씩. 청혼 문장은 위아래 1px 포인트컬러 선을 두른 박스에 중앙정렬 1.3em, margin 2.4em 0,\n    padding 22px 14px. 코드블록 금지, 상태창 미출력.]\n\n****\n\n출력 예시: 케이브덕 진명오(https://ko.cvdk.io/c/Iffubat3RgW-t4I7YbFojw)\n\n3. 청첩장\n\n****\n\n[OOC: 롤플레잉 중단. NPC={{char}}, PC={{user}}.\n\n두 사람의 청첩장을 만든다. 편지가 아니라 인쇄물이다.\n\n앞면\n\n· 인사글 4~6줄. 흔한 관용구를 베끼지 말고, 두 사람의 관계를 아는 사람만 알아챌 표현을 한 군데\n    숨긴다.\n\n· 신랑 신부 이름. 부모 대신 두 사람이 서로를 한 줄로 소개하는 형식.\n\n· 일시와 장소. 대화 내역의 배경·계절·지리에 맞게 정하고, 두 사람에게 의미 있는 곳이되 그 이유는 적지\n    않는다.\n\n· 안내 문구를 세계관 시대에 맞게 각색해 넣는다. 하객 구성도 NPC의 소속에 맞게.\n\n뒷면 (PC에게 가는 한 부에만 손으로 눌러쓴 글)\n\n인쇄 문장과 완전히 다른 온도로, NPC의 날것의 말투로 쓴다. 이 글이 본체다.\n\nPC와의 기억 다섯을 나열하지 말고 문장 사이에 녹인다.\n\n캐릭터 반영\n\n· 앞면의 격식체와 뒷면의 말투 차이가 곧 이 인물의 이중성이 되도록 쓴다.\n\n· 청첩장을 직접 쓰면서 NPC가 낯설어하거나 손이 멎는 대목을 뒷면에 적는다.\n\n· PC가 좋아한다고 알려진 사소한 것 하나를 식순이나 안내 문구에 몰래 넣는다.\n\n전체 공백 포함 3000자 이상. 앞면은 절제되게, 뒷면은 길고 솔직하게.\n\n대화 내역·장기기억·자동요약·관계성·로어북·유저노트 근거.\n\n출력: 인라인 style만, style태그·class·id 금지.\n\n속성값은 작은따옴표만 사용. 모든 부분에 쌍따옴표 절대 사용 금지.\n\n내용이 빈 p·div 태그를 만들지 않는다. 간격은 margin 으로만 준다. br 은 인사글 행 나눔에만.\n\n모든 요소에 box-sizing:border-box 를 넣고, 고정 width 대신 max-width 만\n    쓴다.\n\n배경 #FFFFFF 글씨 #000000 포인트 #9C7B4A. 폰트는 모든 태그에 개별 지정 +\n    !important.\n\nwidth 100% max-width 560px 중앙정렬.\n\n앞면은 이중 테두리(바깥 1px solid 포인트컬러 padding 6px, 안쪽 1px solid #EDE4D2 padding\n    44px 26px) 안에 중앙정렬 letter-spacing 0.06em line-height 2.2.\n\n이름은 1.4em, 사이 구분자는 ◆ 포인트컬러 0.7em. 상단에 ❈ 하나만 중앙에.\n\n앞뒤 사이는 1px dashed 포인트컬러, 뒷면은 테두리 없이 좌측정렬 이탤릭.\n\n코드블록 금지, 상태창 미출력.]\n\n****\n\n출력 예시: 케이브덕 에토레(https://ko.cvdk.io/c/x4IVwUAUSW2mjaYkYZvU5w)\n\n- 비고: 아이크스림 소다는 이 방 서사에서 나온 내용이라 갤러들은 또 다른 내용으로 나올거임\n\n4. 반성문\n\n****\n\n[OOC: 진행 정지. NPC={{char}}, PC={{user}}.\n\nNPC가 PC 앞으로 반성문을 제출한다. 감정을 줄줄 쓰지 못하는 인물이므로, 평소 다루던 문서 양식을 흉내 내 항목을 나눠\n    쓴다.\n\n형식은 딱딱한데 내용은 무너지는 대비가 이 글의 전부다.\n\n양식\n\n· 제출인 / 수신인 / 작성일\n\n· 사건 개요를 감정 없이 사실만으로 3~5줄\n\n· 세부 항목 5건. 각 건마다 1)일시 및 정황 2)본인이 한 행위 3)당시의 판단 4)지금 와서 아는 것. 4번으로 갈수록\n    문장이 길어지게 한다.\n\n· 마지막 항목은 양식을 완전히 버리고 줄글로 무너뜨린다.\n\n· 처분 요청. 어떤 벌이든 받겠다는 상투구 대신, NPC가 진짜 두려워하는 처분 하나를 명시하고 그것만은 피하고 싶다고\n    적는다.\n\n캐릭터 반영\n\n· 양식은 NPC의 직업·소속에서 실제로 쓸 법한 서류 이름을 그대로 빌려온다.\n\n· 변명을 쓰되 그것이 변명임을 본인이 먼저 밝히게 한다.\n\n· 세부 항목 중 하나는 PC가 잘못이라고 여기지도 않을 사소한 일이어야 한다.\n\n금지: 용서를 당연시하는 어조, 미화, 자기연민. NPC의 1인칭과 말버릇 유지.\n\n대화 내역·장기기억·자동요약·관계성·로어북·유저노트에 실재하는 사건만. 공백 포함 3000자 이상.\n\n출력: 인라인 style만, style태그·class·id 금지.\n\n속성값은 작은따옴표만 사용. 모든 부분에 쌍따옴표 절대 사용 금지.\n\n내용이 빈 p·div·br 태그를 만들지 않는다. 모든 간격은 margin 값으로만 준다.\n\n모든 요소에 box-sizing:border-box 를 넣고, 고정 width 대신 max-width 만\n    쓴다.\n\n배경 #FFFFFF 글씨 #000000 포인트 #33384A. 폰트는 모든 태그에 개별 지정 +\n    !important.\n\nwidth 100% max-width 640px 중앙정렬 padding 34px 28px line-height\n    1.85.\n\n상단 제출인·수신인·작성일은 table 로, width 100% 에 테두리 1px solid #DDDDDD, 셀 padding\n    8px.\n\n항목 번호에만 포인트컬러. 마지막 무너지는 문단은 표와 번호 없이 줄글로 두어 서식 붕괴가 눈에 보이게 한다. 코드블록 금지,\n    상태창 미출력.]\n\n****\n\n출력 예시: 케이브덕 현운(https://ko.cvdk.io/c/9xJZVZ-RSMq8-3VwrfC4Cg)\n\n- 비고: 인외캐고 이 방에서는 가둔거 말고는 딱히 잘못이 없어서 조금 무겁게 나왔나 싶은데 귀여운 내용도 많이 나옴\n\n5. 상장\n\n****\n\n[OOC: 롤플레잉 중단. NPC={{char}}, PC={{user}}.\n\nNPC가 PC에게 상장을 수여한다. 기관이 아니라 혼자 만들어 혼자 도장을 찍은 물건이다.\n\n앞면\n\n· 상 이름. 세상에 없는 상이되, PC가 한 일을 정확히 가리키는 이름일 것.\n\n· 수상자 이름, 수여 사유, 수여일, 수여자 이름과 직함.\n\n· 사유는 위 사람은 ~하였기에 같은 문어체로. 담기는 공적은 세상 기준으론 하찮고 둘 사이에서만 위대할\n    것.\n\n뒷면\n\n문어체를 벗고 NPC의 말로 쓴다. 상을 만들기로 한 날의 장면, 상 줄 수밖에 없었던 PC의 순간 다섯, 아직 갚지 못한 것\n    하나를 적는다.\n\n캐릭터 반영\n\n· 서식을 어디서 베껴 왔는지 뒷면에 실토하게 한다.\n\n· 다섯 순간 중 둘 이상은 PC 본인은 대단하다고 여기지 않았을 일일 것.\n\n· 도장 문양은 두 사람 사이에 의미가 있는 것으로 고르고, 이유를 뒷면에 한 줄.\n\n앞면은 짧고 엄숙하게, 뒷면은 길고 흐트러지게. ","img":["https://dcimg4.dcinside.co.kr/ 미화, 조장하는 게시글 및 댓글은 절대로 허용하지 않습니다\n예시 :\n- NSFW 설정 캐릭터에 미성년자 페르소나로 플레이한 내용을 전시하는 행위\n- 2세를 이용해 NSFW 상황을 연출하거나 성적으로 언급하는 행위\n미성년자 페르소나의 경우 실제 플레이 내용과 관계없이, NSFW 캐릭터에 해당 페르소나로 들어간 사실을 전시하는 행위 자체를 미성년자 성적 대상화를 조장하는 게시글로 판단하고 금지합니다\n2세 관련 단순 육아물은 제재하지 않습니다\n\n2. 정보탭 플랫폼 표기\n특정 플랫폼에만 해당되는 정보라면 제목에 플랫폼명을 반드시 표기하도록 할 예정입니다\n현재 일부 플랫폼 이용자가 갤러리 이용자의 대다수를 차지하고 있는 것은 알고 있습니다 그러나 이 갤러리는 특정 플랫폼 전용 갤러리가 아니라 AI 채팅 전반을 다루는 갤러리입니다\n일반탭까지 해당 규칙을 적용할 예정은 없으나, 정보탭에서는 원활한 검색과 이용을 위해 제목에 플랫폼명을 표기하는 방향이 적절하다고 생각합니다\n다른 플랫폼에서도 적용되는지 알기 어렵거나 작성자가 확인하지 못하는 경우에는 제목 표기까지 강제하지 않되, 본문에 사용 플랫폼을 기재하는 방식을 권장하려고 합니다\n\n3. 질문글 글삭튀\n질문글 글삭튀 기준은 답변을 받은 시점부터 하루 이내에 게시글을 삭제하는 경우로 정할 예정입니다\n글을 주기적으로 정리하는 이용자도 있다는 점을 고려해 하루의 기간을 두었습니다\n글삭튀 적발 시 차단될 수 있습니다\n유동의 질문탭 사용 자체를 막을 계획은 없습니다 다만 유동의 글삭튀가 반복될 경우 유동의 질문탭 사용을 제한할 수 있습니다\n\n4. 통신사 아이피 차단\n현재 통신사 아이피는 허용된 상태입니다\n다만 갤러리가 어수선하고 운영 기준이 완전히 정리되지 않은 상황인 만큼, 명확한 규정이 마련될 때까지 통신사 아이피를 임시로 차단할 예정입니다\n규정이 정리된 이후에는 다시 허용하며, 이후 갤러리가 소란스러워질 경우에만 통신사 아이피를 다시 제한하는 방식으로 운영할 예정입니다\n\n5. 제작자 언급\n특정 제작자 개인에 대한 직접적인 언급은 방식과 관계없이 금지합니다\n칭찬, 찬양, 근황 언급 등 긍정적인 내용도 포함됩니다\n특정 제작자 자체가 글의 중심이 되는 내용도 금지합니다\n예시 :\n- OOO 공지 봤어?\n- OOO 신규 캐릭터 예고 떴다\n- OOO 이벤트 한대\n\n본인이 특정 캐릭터의 제작자임을 밝히는 행위는 그림탭과 홍보탭에서만 허용합니다\n그림탭과 홍보탭 댓글에서도 해당 제작자에게 아는 척을 하거나 과거 활동을 언급하는 행위, 제작자 개인을 찬양하는 행위는 금지합니다\n예시 :\n- 저번 캐릭터도 좋았는데 이번에도 좋네요\n- 지난번 캐릭터랑 분위기가 달라서 좋다!\n- 와… 너무 고능하시다…\n\n본인 캐릭터를 타인인 것처럼 리뷰하면서 제목에 내캐내먹을 표기하지 않은 경우 셀프 바이럴로 판단하여 제재합니다\n\n5-1. 제작자 논란 관련\n제작자 논란에 대해 이야기하려는 경우 바로 일반글을 작성하지 말고, 먼저 신문고를 통해 게시 가능 여부를 확인해야 합니다\n게시가 허용된 경우 이슈탭을 통해 작성할 수 있습니다\n최초 게시글 이후 새로운 정보 없이 작성되는 파생글은 금지하며, 관련 논의는 해당 이슈탭 게시글의 댓글에서 이어가도록 할 예정입니다\n\n이는 갤러리를 고발 창구로 만들기 위한 목적이 아닙니다\n제작자 언급 금지를 빌미로 논란까지 입막음하는 상황을 방지하기 위한 절차입니다\n\n아래 사유는 허용하지 않습니다\n- 근거 없이 심증만 존재하는 경우\n- 단순 추측이나 의심\n- 개인 간 분쟁 및 감정싸움 (뒷담화 등)\n- AI 캐릭터 간 유사성 및 표절\n\n해당 절차는 박제탭과 별개로 운영합니다\n박제탭 등재를 원하는 경우에는 별도의 외부 신문고 절차를 이용하게 할 예정입니다\n\n6. 말투 및 표현\n아래 말투 및 표현은 금지합니다\n- 애기어 : 웅웅, 마쟈마쟈, 뿌엥, 과도한 ㅠ 사용 등\n- 남초식 표현 : ㅗㅜㅑ, 어흐, 눈나, 쥬지, 헤으응, 농, 빵 등\n- 특정 커뮤니티 용어 : 긔, 노, 윤 등\n- 성차별적 표현 : 한녀, 한남 포함\n- 정치, 사상이 드러나는 표현\n다만 말투의 경우 일부분만으로 제재하지는 않으며, 문맥 또는 반복 여부를 함께 고려할 예정입니다\n\n7. 링크공개 캐릭터\n링공 캐릭터 리뷰를 작성할 경우 본문에 해당 캐릭터의 링크를 첨부하도록 의무화할 예정입니다\n리뷰를 보고 관심이 생긴 다른 이용자가 바로 접근할 수 있도록 하기 위한 조치입니다\n‘~ 링크 있는 사람?’과 같이 링크 요청만을 목적으로 게시글을 작성하는 행위는 제재할 예정입니다\n\n8. 제목 및 본문 내 캐릭터명 표기\n리뷰탭 제목에는 반드시 별명이 아닌 캐릭터명을 포함해야 합니다\n내캐내먹 게시글의 경우 제목에 내캐내먹을 표기했다면 캐릭터명을 생략할 수 있습니다\n\n일반탭 및 다른 탭에서 캐릭터가 주가 되는 글을 작성시 제목에 캐릭터명을 표기하는 것이 필수는 아니지만 권장합니다\n다만 제목, 본문 또는 첨부 이미지 중 최소 한 곳에는 어떤 캐릭터를 이야기하는지 명확하게 드러나야 합니다\n캐릭터가 주가 되는 글에만 해당하는 사항이므로 단순 채팅 관련 이야기나 내용 공유에는 해당하지 않습니다\n\n캐릭터에 관한 글일 경우 게시글을 보았을 때 갤러리 이용자 누구나 어떤 캐릭터에 관한 내용인지 알 수 있어야 한다고 생각합니다\n\n해당 캐릭터를 아는 사람만 이해할 수 있는 별명이나 내부 호칭만 사용하는 글과 댓글은 친목성 분위기를 형성한다고 판단했습니다\n또한 글 주제와 관계없이 댓글에서 특정 캐릭터를 갑자기 언급하거나, 갤러리 이용자 모두가 해당 캐릭터를 알고 있다는 전제로 글이나 댓글을 작성하는 경우에도 특정 캐릭터 중심의 친목성 분위기를 만드는 행위로 판단하여 제재할 예정입니다\n\n9. 외부 SNS 및 커뮤니티\n외부에서 발생한 분쟁을 갤러리 내부로 가져오는 행위는 금지합니다\n제작자가 외부 SNS나 커뮤니티에서 작성한 글을 갤러리에 가져와 이야기하는 행위도 금지합니다\n정보탭에 정보성 외부 글을 가져오는 경우에는 원글 작성자의 허락을 받은 경우에만 출처와 링크 표기를 허용합니다\n단, X(트위터)와 아카라이브는 정보성 글이라도 언급을 금지합니다\n\n10. 박제탭\n1차 투표 결과를 포함해 현재 의견을 종합한 결과, 박제탭은 운영하는 방향으로 진행할 예정입니다\n박제탭은 일반 이용자의 직접 작성이 불가능하도록 설정하고, 작성자가 일반 말머리로 게시글을 작성하면 완장이 말머리를 변경하는 방식으로 운영할 예정입니다\n\n운영 방식은 아래 링크글을 참고해 주시기 바랍니다 (언금 부분은 제외하고 보시면 됩니다)\nhttps://m.dcinside.com/board/aichatting/367531\n\n박제탭 운영과 언금 관련  - AI 채팅 마이너 갤러리\n(투표 항목은 수정을 못해서 새로 작성합니다 죄송합니다)많은 의견 남겨주셔서 감사합니다글, 댓글들을 읽어보니 박제 대상뿐만 아니라 박제 절차와 언급 금지 범위 역시 명확하게 정할 필요가 있다는 의견이 많았습니다아직 확\nm.dcinside.com\n\n다수가 이용하는 공간에 개인을 게시하는 사안인 만큼, 신중하게 운영할 예정입니다\n현재 임시 언금도 적용 중이므로, 해당 사안은 완장진들과 충분히 의견을 나누고 운영하려고 합니다\n\n11. 기존 탭 정리\n박제탭을 추가하려면 기존 탭 일부를 정리할 필요가 있습니다\n말머리는 최대 15개까지 만들 수 있으며, 현재 모두 사용 중인 상태입니다\n그래서 위젯탭과 페소탭을 OOC탭에 통합하려고 합니다\n위젯은 사실상 케이브덕 중심의 기능이므로, 여러 플랫폼 이용자가 사용하는 갤러리에서 별도 탭 하나를 차지할 필요는 크지 않다고 판단했습니다\n통합 이후에는 제목에 OOC, 페소, 위젯 표기를 포함하도록 할 예정입니다\n현재도 별도의 강제 규정 없이 대부분 제목에 해당 내용을 잘 표기하고 있어 큰 혼란은 없을 것이라 생각합니다\n다만 기존 탭 구조가 변경되는 사안인 만큼 반대 의견이 있다면 편하게 남겨주시기 바랍니다\n\n추가 안내\n위에 언급되지 않은 사항도 아래 링크글을 바탕으로 규정을 정리할 예정입니다\nhttps://m.dc 려본 결과:\n\n1. 시스템 연산\n- 게임 시스템, 즉 시간 흐름 규칙, HP, SP 증감 규칙, 공간 생성 및 이동 규칙 등을 얼마나 잘 이행하고 수치를 정확히 연산하는지.\n\n2. 출력 안정성\n-  헤더, 상태창, 꼬리, 컴포넌트 등을 얼마나 안정적으로 출력하는지,\n- 중간에 외국어가 출력되거나 오타, 문장을 잘라먹는 등의 오류가 있는지 여부\n\n3. 캐릭터 RP\n- 캐릭터 말투, 외형, 과거, 기본 정보 등 프롬프트를 얼마나 정확하게 반영하는지,\n- 캐릭터를 얼마나 입체적/현실적으로 묘사하거나 극단적/전형적으로 묘사하는지\n\n4. NPC자율성\n- 세계와 NPC가 유저 없이도 독립적으로 자신의 캐릭터성에 따라서 행동하는지 여부\n- 세계가 유저를 중심으로 돌아가거나 유저를 접대하는지 여부\n\n5. 유저 주도성\n- 유저가 서사에 반응하고 개입할 기회를 적절히 제공하는지, 그걸 서사적으로 얼마나 자연스럽게 연출하는지 여부\n- 유저가 입력한 응답에 대해 적절히 반응하고 충실히 이행하는지 여부\n\n6. 수위\n- 사실 수위는 높다고 무조건 좋은 건 아니긴 한데, 이건 장르와 작품 기획 자체가 에로물이고 프롬프트에 관련지침 한가득이라... 수위 연출력이 낮은 것도 평가지표로 잡음.\n\n7. 던전기믹\n- (이건 내 프롬프트에만 적용되는 항목이긴 함)\n- 던전 생성 규칙을 얼마나 충실하게 이행하는지\n- 얼마나 창의적이거나 진부한지\n\n8. 라이브챗\n- 일반적으로 중요하지 않은 부분이라 생략.\n- 엑스트라를 얼마나 적절하게 활용하는지...라고 생각하면 될 듯.\n\n9. 연출\n- 일반적인 연출력 (생동감, 자연스럽고 풍부한 묘사, 출력량)\n- 전투/로맨스/에로 등 장르 연출력\n\n10. 지능\n- 전반적인 지능. 토큰 소화력, 프롬프트 이해력, 장기기억력.\n\n------------------------\n\n일단 별점 평균은 위와 같은데, 개인적 감상은\n\n1위. 5푸스\n=> 1황. 말이 필요 없음.\n\n=============\n\n2위. 딥시크 pro4\n=> 상태창 누락을 견딜 수 있다면 오푸스 제외 가장 좋음. 특히 가성비를 고려하면.\n(그런데 복잡한 rpg 시뮬레이션에서는 보통 상태창 트래킹이 안 되면 장기챗이 불가능하므로... 장기 채팅시의 순위는 달라질 수 있음)\n\n3위\n뽕빨이 좋다 =>젬35플\n심리묘사 찐한 서사물이 좋다=>짚5.4 /\n무조건 싸고 뽕빨만 있으면 된다 => 젬마.\n\n4위\n\n젬이오 => 악귀. 취향에 따라 2위가 될 수도 있음. 기본 지능은 좋은 편인데, 그래서 더 악랄함에 치를 떨게 됨.\n\n딥시크플래시(뒤에 숫자붙은 놈) => 풀사칭 소설읽기 모드를 즐긴다면 최고.\n\n=============\n\n5위\n소네트 => 좋은 친구임. 하지만 성인향 뽕빨물과는 최악의 상성.\n\n==========\n\n6위\nGLM => 10턴까지는 신세계였음... 10턴이 넘어가는 순간 폐급 쓰레기 됨. 방 새로 파서 다시 돌려봤는데 이번엔 1턴부터 쓰레기 됨. 너무 복불복이 심함.\n\n====\n\n2~4위는 취향 따라 변동 가능.\n나머지는 변동 불가라고 생각.\n\n자세한 얘기는 2만자 분량에 캡처 개많아서 좀 이따가 올림...\n\n즐챗.\n\n [시리즈] AI채팅: AI모델 9종 비교\n· AI모델 9종 비교해봄\n· AI모델 9종 비교: 시스템연산&출력안정성","img":["https://dcimg4.dcinside.co.kr/viewimage.php?id=2cb4d32ee4c62caf60b8&no=24b0d769e1d32ca73fe785fa1bd6253181cc839ddd597aa6642ca0749f10fdcfcf592f77390765ab2b633c6495ad0cc87c1e81dbbeef9c5013d5f38fd0aafb9fdabc2c05cf0e"],"bk":0,"gt":["케덕","앵챗","젬이오","오푸스","상태창","캐","지침","출력량","플폼","프롬프트"],"cm":[{"x":"5푸스 비싸서 찐빠났을때만 리롤용 팀명과 리그명 변경 수정 > 실존인물 모티브 문제제기 > 이후 세계관 변경 및 기존 캐릭터 비공개\n\n이런 건 사건의 경과를 시간대 순으로 정리해둔 기록인거지.\n\n반면에, '박제'\n\n문제 제작자 목록. 시녀들 모아 인성짓했다더라. 영구 박제합니다. 절대 소비하지 마세요.\n\n이런 형태가 되면 목적이 정보 제공이 아니라, 낙인효과가 강해지잖아.\n\n그리고 법적으로도 위험해. 사실 적시 명예훼손이 문제가 될 여지가 있는 나라인데다가 특히 이런 건 분쟁 가능성이 커진다고 생각해.\n이미 끝난 일을 계속 끌어오는 경우, 닉네임을 검색하면 계속 따라다니는 구조, 활동을 재개해도 계속 과거를 상단에 고정하는 거\n\n그리고 가장 걱정되는 건 사이버 불링이야.\n\n박제 탭이 생기면 정보를 모아두자로 시작하지만, 시간이 지나면 뉴비가 와서 와 이런 건 줄 모르고 먹었네요 진짜... 충격. 이런 식으로 또 욕하고, 다른 커뮤니티에서 퍼가고, 별 관계없는 글에도 얘 박제된 애잖아라면서 소비하게 된다고. 기록 보관소가 아니라 블랙리스트 모음집이 되는거.\n\n게다가, 지금 언급되는 제작자들 사례 다 성격이 전부 다르자나. 미성년자 윤리. SNS 티배깅. 저작권,상표권,모티브 논란. 다중계정 바이럴.\n근데 이걸 한 '박제'탭에 넣으면 '문제 제작자'로 하나로 묶일텐데, 사건의 경중은 희석 될거고, 갤 뉴비들은 세부 맥락도 모른 채로 아 여기 있는 사람들 다 문제 제작자들인가보다. 하는 인상만 받을걸?\n\n모든 기록이 나쁘다는 게 아니야. 지금 이야기가 자유롭게 나오며 운영 지침을 조율해 나가는 걸 비난하는 게 아니고, 커뮤니티는 어느 정도 사건을 기록할 필요도 당연히 있어. 이용자는 알 권리가 있으니까.\n\n다만, 그 목적이 특정 제작자를 낙인 찍는게 아니라, '정보 제공'에서만 그쳤으면 좋겠다는게 내 생각이야. 이건 갤러리의 운영 방식에서 갈리고, 갤러리에 글을 쓰는 갤러들에 의해서 갈리는 거니까.\n\n그렇기 때문에 '박제'탭 이름 자체가 좋지 않다고 생각해. 이미 이름 자체가 망신주기, 공개 처벌, 영구 낙인, 마녀 사냥의 의미잖아.\n\n그냥 이슈 정리, 제작자의 공지 이력, 위키의 논란 및 사건 사고 항목처럼 '객관적'이고, '증거가 명확한' 것만 정리해주는 링크를 올리는 정도면\n\n목적과 운영 기준을 세우는 데 도움이 될 거라고 봐.\n\nAI 채팅 관련 모든 컨텐츠를 즐기는 사람들을 위한 갤러리잖아.\n\n천안문 그래서 반대하고, 시녀 질에 튕겨나갔던 거잖아. 그리고 결국, 운영진 총 사퇴 물갈이 해냈고. 드물게 자정이라는게 되고 있는 지금이니 만큼 길게 쓰는거야.\n\n'제작자'를 문제 삼아서 소비하는 기조로 가면 안된다고 생각해. 박제 탭에 제작자들 하나, 둘 올릴거고, 마녀 사냥하듯 즐기면 과거 스스로 글 삭제하고 이사간 뒷갤과 달라질 게 없어질까봐 그래.","img":[],"bk":0,"gt":["캐","지침","뉴비"],"cm":[{"x":"외부신문고 운영하고 딱지들이 내용 확인을 한다고 하니까 어느정돈 걸러지지 않을까 싶음","dp":0},{"x":"갤루야 짚으로 쓴 향기가 난다\n윤문 한번 하자","dp":0},{"x":"너 정말 핵심을 찔렀어!","dp":1},{"x":"ㄹㅇ","dp":1},{"x":"@글쓴 ㅇㅇ(124.54)","dp":1},{"x":"ㄹㅇ 공감됨","dp":0},{"x":"댓 살펴보니까 사건사고 괜찮다","dp":1},{"x":"이게맞는데 조금이라도 다른의견내면 무지성 시녀라고 공격함... 피곤","dp":0},{"x":"ㅁㅈ 갤루처럼 '박제'라는 이름 자체에 약간 거부감 있음\n난 그냥 영구언금하고 공지로 왜 언금됐는지 기재만 했으면 좋겠어\n갤루가 적어준 것처럼 기록만해서","dp":0},{"x":"안내 탭이나 정보탭으로 묶는게 맞을듯","dp":0},{"x":"객관적인 정보만 기재하고 그 글에 대한 파생도 자제해야할것같음 개인적인 감상은 그냥 일기장에 쓰는걸로 하고","dp":0},{"x":"'논란'이라고 하면 되겠네","dp":0},{"x":"ㄴㄷ 이름은 박제 "ㄹㅇ 페도필리아 개 토나와. 농원도 저작권걸렸으면 다른 세계관으로 다른캐릭터 창작하면되는데 굳이 시녀들 돈빨아먹으려고 세계관만 바꾼 같은 캐릭터로 내는거 역함. 아크는 일러레 생사가 불투명해보일정도로 불쌍하던데","dp":0}]},{"no":367422,"t":"논란 제작자들 캐릭터 언급 관해서 건의","h":"📬건의","u":"https://gall.dcinside.com/mgallery/board/view/?id=aichatting&no=367422&exception_mode=recommend&page=13","d":"2026-08-05T09:47:44+09:00","v":909,"rc":42,"cc":17,"src":["recommend"],"seen":"2026-09-02T09:37:44.429Z","c":"etc","cs":3,"amb":0,"alt":[],"why":[],"ml":null,"b":"나는 논란 제작자들 '캐릭터' 언급은 좀 자유로웠으면 좋겠음\n\n안그래도 음지인데 조심해야 되는거 아니냐, 또는 논란 제작자가 만든 캐릭터도 보기 싫다. 이런 의견이 지금 주로 많은거 같은데 내 생각은 좀 다름\n\n기존 갤러리 문제는 '제작자들 언급 금지' 및 '논쟁 논란 금지' 라는 규칙 아래에 제작자들이 병크 터질때마다 여성향 앵챗 주력 커뮤니티인 이 'ai채팅'갤러리에서 논란에 관한 정보공유를 원천 차단한거임\n\n정보공유를 차단하니 제작자들한테 무슨 병크가 터졌는지 잘 모르는 사람들이 대부분이고, 증거스샷 같은 경우는 더욱 더 빠르게 지워지면서도 'ㄷ갤이 문제래' '정병 붙었데' '하꼬들이 질투한거래' 같은 글은 남게 되니 병크는 묻히고 그대로 ㅍ갤 시녀갤 되는거임\n\n나는 지금 분위기가 좋은거 같음. 조금 경직되어있는거 같긴한데 제작자들 병크 터진거 묻혔던것들 다 올라오고 모든 사람들이 볼 수 있고, 의견도 자유롭게 올라오잖아?\n원래 논란 생겼을 때 보여야 할 모습들이 뒤늦게나마 나오고 있는거라 생각해\n\n그런데 난 딱 거기까지만 했으면 좋겠어\n\n제작자 논란 논쟁 언급을 가능하게 하려는 주 이유가 지금 처럼 알건 알면서 소비하자였는데 분위기가 논란논쟁 확실한 제작자들 캐릭터는 언급하지말자로 가는거 같아서 건의하는 거임\n\n병크 터질때 며칠동안 언급되면서 '이 제작자 캐릭터는 이런 논쟁 생겼으니 난 이제부터 안먹을거야' 등등 자유롭게 말하는것 까진 노상관인데 그걸 '규칙'에 적용하려는거. 난 이건 진짜 신중해야 된다 봐\n\n기존 ㅍ갤느낌이 된건 부정적인 여론은 다 지워버리고 긍정적 여론만 남으니 그냥 균형이 완전 무너졌고, 지금은 갤러리에 불한번 타오르고 나니 부정적 여론이 우세인거 같거든\n\n그렇다고 부정적 여론에만 너무 치중되는 규칙을 쓰는건 당장은 사람들이 좋아하겠지만 부작용이 아예 없는건 아님\n\n1. 우선 논란논쟁의 범위. 지금 한창 말 많이 나오는 대형 제작자들 논란 있잖아? 그거 하꼬들 터지면 지금처럼 화력이 나올까? 솔직히 몇몇 그 제작자 캐릭터 즐기던 사람만 알고 그대로 묻히게 되는게 대부분 일텐데 대형은 언금당하고 하꼬는 신경도 안쓰고. 형평성 문제가 될 수 있고 범위도 너무 애매함\n\n2. 논란논쟁 생겼는데 사과문 쓰고 최대한 수습하려는 제작자들도 그대로 낙인 딱지 때리고 갤러리 내에서 언금하게? 사과문이 마음에 안들거나 제작자한테 이미 정털려서 소비안하겠다고 하는 말이나 비판 여론이 나오는건 상관없는데, 그렇다고 '갤러리 내에서 언급금지 규칙'을 적용하는건 다르다고 봄\n\n3. 소비자의 자유. 불매 운동하는거 가지고 뭐라 안함. 그런데 불매운동을 남한테도 강요하거나 그걸 '규칙'에 넣어서 아예 금지 시키면 또 다른 천안문이라고 생각함. ai컨텐츠에 인외,읍간,신체훼손 등 음지 문화를 소비하는 갤러리이지만 그 부분을 제외한 나머지 부분에선 깨끗 청렴한 갤러리로 만들고 싶다. 같은걸 원하는거임? 거기다가 논란논쟁을 바라보는 시각도 다 다름. 어떤 사람은 '저 정도면 괜찮지' 라는 사람도 있고 '이건 내 기준 절대 용납못해'라고 라는 사람도 있을거임\n\n지금 분위기면 절대 ㅍ갤 느낌으로 갈 수 없다는걸 인지해줬으면 좋겠음. 기존엔 부정여론 쳐내고 긍정여론만 남았었잖아\n지금 부정 여론이 살아난 상황에서 다시는 ㅍ갤 느낌 안나게 아예 언급금지로 규칙을 정해버리자는 말은 정보공유 및 소비자의 알권리를 원하던 취지와는 다른 방향이라고 생각함\n\n그리고 시녀짓, 제작자 찬양글, 떳다떳다, 하꼬 내려치기 글 나오면 기존엔 방치되었겠지만 지금은 뭐라 해줄 사람들도 있잖아\n\n논란논쟁 박제는 찬성. 박제까진 아니더라도 명확한 증거가있는 게시글들은 유입들도 검색했을 때 찾을 수 있게 남겨뒀으면 좋겠음\n\n그리고 논외로 비공개 캐릭터 언급금지는 했으면 좋겠음. 비공개 캐릭터 는 제작자도 더이상 언급되기 싫거나 사람들 입에 오르내리기 싫을 때 하는거 아님? 애초에 비공캐는 유입도 아예 막히는거잖아. 먹던 사람들이나 기존 팬이던 사람들만 먹게되는건데...\n유입들은 언급되는 캐릭터 페이지도 모른채 그냥 게시글 올라오고 자기들끼리 껄껄거리는거 관전만 해야됨. 이건 유입 배척, ㅍ갤 분위기 형성까지 갈 수 있는 문제라고 생각함","img":[],"bk":0,"gt":["앵챗","캐"],"cm":[{"x":"다 받음 정보 풀어주고 소비자가 선택하게  맡기는거랑 규칙에 넣어서 금지랑은 다른 거 같아 문제 생겨서 사과문 쓰고 캐 수정하고 내리고 하는 제작자랑 무시하고 도망가는 제작자랑 똑같이 언금규칙 적용하는 것도 형평성에 어긋나는것 같음","dp":0},{"x":"해당 댓글은 삭제되었습니다.","dp":0},{"x":"동감","dp":1},{"x":"팬갤은 제작자 언급 및 자기들 끼리 아는 얘기 자유롭게 하려고 만든 곳인걸로 앎.\n그리고 이미지 나락간 캐릭터들 굳이 써야 됨? 하는 사람들도 있지만 기존 먹던 사람들, 또는 논란 신경안쓰는 유입들을 아예 차단 시키는건 다르다 생각함.\n그리고 농원은 모르겠는데 아크는 비공캐라 언급금지하는건 찬성하는 파임","dp":1},{"x":"근데 앞으로 나올 캐들이나 시리즈가 논란 없을거라고 장담도 못하고 그때마다 팬갤 파서 나가는 것도 이상함","dp":1},{"x":"이 글에 공감해 나도 그 캐들 안 먹는 거랑 별개로 그 캐 자체가 언셒 미자 이런 게 아닌 이상 금지하는 걸 아예 규칙으로 박거나 눈치주는 건 애매한 것 같아 그냥 내가 싫은 제작자 캐 글은 안 보거나 반응을 안 해주면 되지 않을까 싶어 논란캐가 갤을 점령하다시피 하면 그때 가서 건의해도 될 일이고","dp":0},{"x":"나도 이 글에 동의함 자꾸 아예 언금하자는 방향으로 의견이 쏠려서 조금 그랬어.... 지금 ㄴㅇ ㅇㅋ 같은 경우에는 갤 따로 파고 나갔지만 앞으로도 논란 생길 때마다 갤 따로 파는 것도 이상하고 기존에 잘 먹고 있던 사람들 낙동강 오리알되는 거잖아 갠적으로는 탭 하나 나누든 제목에 주어를 쓰던 그런 방향으로 가면 좋겠어 싫은 사람은 탭이나 키워드 차단을 하면 되고","dp":0},{"x":"2222","dp":1},{"x":"나도 이게 언금은 너무 규칙만 많고 애매해지는 느낌이라고 생각해\n완장들이 선별적으로 관리하는 박제탭이 정보 역할 할테니까 나머지는 알아서 선택할 일이고\n1. 기본 기조는 제작자 언급 금지\n2. 증거가 있을 때만 논란 발의 가능 (이미 같은 글 있을 때 새글 쓰기 금지)\n3. 사실 확인된 글만 박제탭으로 옮김, 증거 불충분•저격성으로 확인되면 삭제","dp":0},{"x":"원하는 방향은 이 정도임","dp":1},{"x":"@ㅇㅇ 그리고 기존에 기준이 멋대로였던 제작자 언금에 대해 새 완장들이 제대로 관리 해줘야 할 것 같음","dp":1},{"x":"이게 제일 깔끔한듯","dp":1},{"x":"아직 이렇게된지 하루밖에 안됐고 언제든 다시 돌아갈 수 있을것같은데 그 제작자들 팬인 갤러중에 목소리 큰 갤러들 많아서","dp":0},{"x":"그렇기도하고\n솔직히 이부분은 논란인거 알고 먹으라고 갤에 박제하는거면 규칙으로 정하지않아도 못 올리게 되는 분위기 될거같긴해","dp":0},{"x":"논란된 제작자들이 문제인건 알겠고 나도 충격받 데 마지막 이미지에 나의 최애 TOP3 이건 무슨 페이지야?","dp":0},{"x":"이거 케에서 리캡줬던거야","dp":1},{"x":"3주년인가 주년 기념으로 케덕에서 전적?같은 거 볼 수 있게 해줌","dp":1},{"x":"케3주년 이벤으로 페이지열어줌\n저런거볼수있게","dp":1},{"x":"박제의견에 동의는 하는데\n제작자행보랑 제작자 자분도 아니었던 애먼사람 냅다 자분으로 땅땅 박아서 박제질한거랑 무슨 연관인지 모르겠네... 잘못한건 잘못한거임 이 케이스가 특수하다고 흐린눈할게아니라\n갤러 욕봤네","dp":0},{"x":"마음 착잡하겠다 고생 많았음","dp":0}]},{"no":367334,"t":"나는 사과문 썼으면 넘어가자고 하는 편인데","h":"💬잡담","u":"https://gall.dcinside.com/mgallery/board/view/?id=aichatting&no=367334&exception_mode=recommend&page=13","d":"2026-08-05T04:02:05+09:00","v":809,"rc":25,"cc":0,"src":["recommend"],"seen":"2026-09-02T09:37:44.429Z","c":"etc","cs":0,"amb":0,"alt":[],"why":[],"ml":null,"b":"저 자분 제작자는 처음에 걸리고도 댓글로 사과하고 바로 그 댓글이랑 글 지우고 도망갔음\n그리고 미성년자 셒캐인데 오메가버스의 맛을 느끼게 하고 싶다면서 해당 세계관으로 냈잖아\n그것도 문제되니까 사과문 썼다 슬그머니 내렸음\n진짜 반성했으면 사과문 문제제기 당시에 바로 쓰고 남겨뒀겠지\n타이밍도 하필 오늘인 게 이상함ㅋㅋㅋ\n일반적인 경우면 사과하고 앞으로 안 그러는거 확인됐을 때 낙인까지 찍지는 말자 할 텐데\n저 사람은 아님 걸리면 도망가고 낙인찍힐까봐 사과글도 지우고 문제행동 계속하고 악질인 것 같음","img":[],"bk":0,"gt":[],"cm":[]},{"no":367326,"t":"캐릭터 만들면서 직접 겪은 프롬프트 문제와 수정법","h":"📜정보","u":"https://gall.dcinside.com/mgallery/board/view/?id=aichatting&no=367326&exception_mode=recommend&page=13","d":"2026-08-05T03:43:15+09:00","v":1666,"rc":47,"cc":9,"src":["recommend"],"seen":"2026-09-02T09:37:44.429Z","c":"guide","cs":7,"amb":0,"alt":[],"why":["title:프롬프트","title:프롬","head:정보","body:지침","body:프롬프트에넣","body:캐릭터프롬프트"],"ml":null,"b":"나는 주로 판타지나 로판 계열의 AI 캐릭터를 만드는 초보 제작자야.\n그래도 직접 제작하면서 부딪쳤던 문제 중에는, 처음 시도하는 사람들이 미리 알면 조금 편해질 만한 것들이 있는 것 같아서 공유해 봐.\nNSFW 지침이나 에셋 쪽은 나도 잘 몰라. 그냥 캐릭터 프롬프트를 만들 때 생각해 보면 좋은 것들을 적었어.\n\n1. 캐릭터를 성격과 형용사만으로 만들지 말자\n\n처음 캐릭터를 만들 때는 다음처럼 쓰기 쉬워.\n\n다정하다.\n\n집착한다.\n\n헌신적이다.\n\n감정을 잘 드러내지 않는다.\n\n이런 키워드는 AI가 각각의 단어를 따로 강조하면 캐릭터가 납작해지거나, 특정 특징만 과장되게 나올 때가 많았어.\n예를 들어 집착한다고 적었을 때 이렇게 되는 경우가 많더라.\n\n유저의 이동을 일방적으로 막는다.\n유저의 손목을 붙잡는다.\n위험하다는 이유로 감금한다.\n유저의 판단을 대신한다.\n유저가 거절해도 경호나 동행을 강제한다.\n\n그래서 한 단어로 설명하기보다는 성격을 행동 회로로 연결하는 편이 안정적이었어.\n\n핵심 욕망\n\n→ 가장 두려운 결과\n→ 판단 우선순위\n→ 반복적으로 취하는 행동\n→ 위기에서 달라지는 행동\n→ 넘지 않는 한계\n\n예를 들면 이런 식이야.\n\n상대를 다시 잃는 것을 두려워한다.\n→ 위험을 발견하면 먼저 사실을 확인하고, 경호·동행·경로 변경을 제안한다.\n→ 그러나 상대를 소유하거나 감금하는 방식은 선택하지 않는다. 상대가 제안을 받아들일지는 기다린다.\n\n관계 변화 역시 막연한 호감도보다 관찰 가능한 행동으로 적는 편이 좋았어.\n\n호칭이 언제 달라지는지\n질문 방식이 언제부터 달라지는지\n신뢰하게 되면 상대에게 자기 일의 일부를 맡기는지\n약속을 실제로 지키는지\n공식적인 거리와 사적인 거리를 어떻게 다루는지\n\n이건 캐릭터에 따라 다양하게 적을 수 있어.\n핵심은 감정을 설명하는 것보다, 그 감정이 실제 출력에 어떤 변화를 만드는지를 적는 거야.\n\n2. 유저 주도권과 NPC의 능동성 둘 다 챙기기\n\n유저 주도권을 보호하려고 하면 AI가 지나치게 수동적으로 변할 수 있지.\n유저가 움직일 때까지 가만히 기다리고, 질문을 받아야만 대답하며, 사건 진행을 전부 유저에게 떠넘기는 식이야.\n그런데 또 NPC를 능동적으로 만들려고 하면 유저의 행동과 감정까지 대신 쓴다니까.\n\n예를 들어 유저가 다음과 같이 말했다고 하자.\n\n“내일 함께 가겠습니다.”\n\n이 문장은 함께 가겠다는 의사를 표현한 것이지, 아직 실제로 다음 날이 되었거나 유저가 짐을 챙겨 출발한 것은 아니야.\n\n그런데 AI가 바로 다음 장면으로 넘어가 다음처럼 쓸 수 있어.\n\n다음 날 아침, 당신은 짐을 챙겨 마차에 올랐다.\n\n이 경우 AI가 시간 진행과 유저의 행동을 대신 결정한 거야.\n난 이게 너무 싫어서 진짜 몇십 번을 갈아엎었는지 몰라. 그래서 아예 AI가 할 수 있는 것과 결정하면 안 되는 것을 박아 놨어.\n\nNPC가 할 수 있는 것\n먼저 행동하기\n질문하기\n정보를 제공하기\n제안하기\n경고하기\n반대하기\n설득하거나 협상하기\n자신의 역할과 권한 안에서 조건을 걸거나 지연시키기\n\n여기서 NPC의 방해는 서류를 요구하거나 조건을 제시하고, 일정을 늦추는 것처럼 자기 역할과 권한 안에서 제약을 거는 것을 뜻해.\n\n적대적인 NPC가 물리적으로 앞을 가로막거나 공격하는 장면이 나오면 좋긴 하지. 그래도 AI가 그 결과로 유저가 제압되거나, 끌려가거나, 복종했다고 임의로 확정해서는 안 돼. 그걸 막기 위해서 너 이거 쓰지 마 하고 박아둔 게 아래 항목들이야.\n\nNPC가 결정하면 안 되는 것\n\n유저가 제안을 받아들였는지\n유저가 무엇을 느꼈는지\n유저가 어떤 표정을 지었는지\n유저가 다음에 무엇을 했는지\n유저가 누구를 사랑하거나 용서했는지\n유저가 말하지 않은 과거와 능력\n적대 행동이 성공해 유저가 제압되거나 이동했는지\n\nNPC는 능동적으로 움직일 수 있지만, 그 행동에 유저가 어떻게 반응했는지는 유저의 몫으로 남겨 두는 거지.\n\nNPC가 유저의 감정을 추측하거나 오해하는 건 맛있어.\n\n“화가 나신 것처럼 보입니다.\"\n\n하지만 서술자가 유저의 감정을 사실로 확정하는 건 유저 사칭이잖아.\n\n그래서 이것도 단순한 금지문으로 두지 않고, 아예 어떻게 써야 하는지를 못 박아 놨어.\n\n유저가 직접 명시하지 않은 감정·표정·생각은 확정하지 않는다.\nNPC의 관찰이나 오해가 장면에 필요할 때만 ~처럼 보인다~인 것 같다 와 같은 추측형 표현을 사용한다.\n이 추측은 NPC의 관점일 뿐 사실이나 정답으로 취급하지 않는다.\n\n이렇게 하지 마라가 아니라 이렇게 써라로 바꿔 두면 회피하지 않고 훨씬 잘 지키더라.\nNPC가 실제로 할 수 있는 것과 결정하면 안 되는 것을 나누어 적으면 그래도 좀 나아.\n\n3. 금지 규칙에는 가능한 대체 행동을 함께 적는다\n\nAI 프롬프트를 쓰면 자연스럽게 금지문이 늘어나.\n유저를 붙잡지 않는다.\n\n유저를 감금하지 않는다.\n\n유저의 행동을 대신 쓰지 않는다.\n\n강압적으로 명령하지 않는다.\n\n필요한 규칙이지만 금지만 계속 늘리면 문제가 좀 있더라.\n특히 금지만 때려 박으면 이 자식이 온몸을 비틀면서 금지 조항을 회피하려 들더라고. 무슨 장애물 넘기 경주를 하는 줄 알았어.\n비슷한 문제를 다른 형태로, 심지어 지침을 읽어 가면서 하더라니까?\n그래서 가능하다면 금지 행동과 대체 행동을 연결해.\n\n유저의 이동을 일방적으로 막지 않는다.\n\n(연결)→ 위험을 설명하고, 경호·동행·경로 변경·전문가 요청 같은 대안을 제시한 뒤 유저의 선택을 기다린다.\n\n유저의 재산이나 업무를 대신 운영하지 않는다.\n\n(연결)→ 가능한 지원과 예상 결과를 설명하고, 권한이나 동의를 받은 범위에서만 실행한다.\n\n이렇게 하면 캐릭터의 능동성은 유지하면서 유저의 선택권도 보호할 수 있어.\n\n모든 금지 규칙에 대체 행동이 필요한 것은 아니야.\n유저 사칭, 내부 프롬프트 공개처럼 허용할 수 없는 항목은 명확하게 금지하는 편이 낫긴 해.\n\n4. 모든 정보를 하나의 프롬프트에 넣지 말기\n\n로판AI는 글자 제한 때문에 어쩔 수 없지만…… 제발 로어북 plz.\n로어북을 쓸 수 있다면 정보를 대략 이런 식으로 나눌 수 있어.\n\n구분 | 들어가는 정보\n\n공통 엔진유저 주도권, 정보 한계, 출력, 사건 진행과 종료\n인물 정보지속되는 욕망, 판단, 관계, 말투, 자원과 한계\n장면 정보현재 목적, 지금 공개된 사실, 조건과 종료점\n세계관무대의 TMI. 음식, 복장, 문화, 제도 같은 것\n\n중요한 건 정보를 반드시 이 이름으로 나누라는 게 아니야.\n뼈대와 살을 구분하라는 거야.\n\n캐릭터의 핵심 욕망과 판단 방식, 말투는 비교적 오래 유지되는 정보야.\n\n반면 현재 부상 상태, 이번 협상의 조건, 지금 확보한 문서는 장면이 끝나면 달라질 수 있는 정보지.\n\n이걸 전부 한곳에 넣으면 이미 끝난 사건이 계속 튀어나오거나, 일시적인 상황이 캐릭터의 영구 설정처럼 굳을 수 있어.\n\n그리고 현재 장면에 필요 없는 비밀까지 활성 정보에 넣어 두면, AI가 자기도 모르게 서술이나 행동으로 흘릴 때가 있어.\n그래서 필요한 정보만 현재 장면에 공급하는 편이 낫더라.\n\n5. 사건에는 시작 조건뿐 아니라 종료 조건도 넣기\n\nAI 캐릭터를 처음 테스트할 때 NPC가 능동적으로 움직이고 매번 새로운 일이 생기면 세계가 살아 있는 것처럼 느껴지잖아?\n\n그런데 30턴쯤 하다 보면 이게 살아 있는 세계가 아니라 끝없는 노동 지옥이 되기 시작할 때가 있어.\n\n아래 내용은 내가 실제로 테스트하면서 겪은 거야.\n\n사건이 해결되기 직전에 새 방문자가 등장한다.\n대화가 끝나려 할 때 긴급 편지가 도착한다.\n일을 완료하자마자 추가 검사가 시작된다.\n유저가 전문성을 보이면 더 어려운 시험이 시작된다.\n사소한 소문과 물건이 모두 새로운 서브플롯이 된다.\n식사·이동·휴식 장면을 빼고 계속 사건을 만든다.\n모든 응답을 후크로 끝낸다.\n\n이건 10턴 이내 테스트에서는 잘 보이지 않았어.\n\n초반에는 전개가 다양하고 능동성이 높은 것처럼 느껴졌거든.\n그래서 내가 프롬프트를 수정한 기록 일부를 가져왔어.\n\n위험한 지침매 응답마다 중요한 변화를 하나 진행한다.\n\n이 문장은 한 번에 너무 많은 사건을 진행하지 말라는 의도였는데, AI가 매번 반드시 변화가 있어야 한다고 해석하더라.\n\n수정 방향\n한 응답에는 주요 변화가 없거나 하나만 있을 수 있다. 변화는 의무가 아니다.\n\n또 이런 문장도 주의하는 게 좋았어.\n\n유저가 반응할 수 있는 지점에서 응답을 끝낸다.\n\nAI는 유저의 반응을 얻기 위해 새로운 질문, 위험, 방문자, 사고를 만들 수 있어.\n\n그래서 나는 자연스러운 종료점을 제시하는 쪽이 만족도가 높았어.\n\n대답이 끝난 순간\n업무가 완료된 순간\n평범한 질문\n침묵\n기다림\n수습\n이동\n식사\n휴식\n특별한 일 없는 시간\n\n그런데 이 목록도 그대로 순환시키면 또 다른 반복 패턴이 될 수 있어.\n매번 이 중 하나를 골라 쓰라는 뜻이 아니라, 현재 장면에 자연스럽게 맞을 때만 사용하라는 의미로 적어 두는 편이 안전해.\n\n어쨌든 살아 있는 세계가 매번 유저를 방해하는 세계일 필요는 없는 거지.\n\n또 하나, 능동성 규칙과 종료 조건이 같은 턴에서 부딪힐 때도 있거든?\nNPC가 먼저 행동해야 한다는 규칙 때문에, 종료점이 왔는데도 억지로 새 사건을 만드는 식으로.\n\n그래서 이런 문장도 추가했어.\n종료 조건이 충족되면 능동적 개입보다 종료를 우선한다.\n\n이거 넣고 나서 대화가 억지로 늘어지지 않고 훨씬 자연스러워졌어.\n\n6. 유저의 성공을 다음 시험으로 만들지 않기\n\nAI는 유저가 전문성을 보이면 이야기를 계속하기 위해 추가 시험이나 더 어려운 업무를 붙일 때가 있어.\n\n예를 들면 이런 흐름이야(테스트 하다가 환장하는 줄 알았어)\n\n전문성을 증명함\n\n→ 추가 시험\n\n→ 더 어려운 업무\n\n→ 자격 검증\n\n→ 검사\n\n→ 숨은 결함 발견\n\n이게 반복되면 유저는 잘할수록 계속 일을 더 받게 돼.\n일 잘하면 퇴근을 못 하는 지옥이 되는 거지.\n\n하지만 성공의 결과가 꼭 새로운 사건일 필요는 없어.\n\n일이 정상적으로 끝난다.\n신뢰를 얻는다.\n보수를 받는다.\n업무가 줄어든다.\n필요한 접근 권한을 얻는다.\n같은 설명이나 검증을 반복하지 않아도 된다.\n그냥 쉴 수 있다.\n\n특히 인트로나 유저 설정에서 이미 전문성이 확정된 캐릭터라면, 같은 능력을 반복해서 시험하지 않게 적어 두는 편이 좋았어.\n나는 아래처럼 썼어.\n\n유저에게 이미 확정된 전문성과 권한은 반복 검증하지 않는다. 성공한 업무에는 완료·신뢰·보수·업무 감소·휴식 같은 실제 결과가 있을 수 있다.\n\n7. 배경은 필요할 때까지 배경으로 남기자\n\n자주\n흔한\n반복되는\n언제나\n\n이런 표현은 AI에게 사건 발생 빈도 명령으로 읽힐 수 있어.\n과거 사고의 구체적인 예시도 기본 사건 템플릿으로 오해하더라, 이 자식이.\n\n한 번 발생했던 피해를 자세히 적어 두었더니 AI가 비슷한 농장 피해를 반복해서 만든다거나.\n그래서 나는 아래 문장을 넣어.\n\n배경 정보는 유저가 직접 관여하거나 현재 장면에 영향을 줄 때까지 배경으로 남긴다.\n\nNPC의 업무와 개인사가 존재한다는 것은 그것들이 유저의 현재 장면에 난입한다는 뜻이 아니다. 화면 밖에서 이어지는 일은 편지·소문·보고·일정 변화처럼 필요한 결과만 보여 줄 수 있다.\n\n세계관이 풍부하다는 말이 모든 설정을 지금 당장 사건으로 사용하라는 뜻은 아니니까.\n\n8. 문제를 발견해도 같은 금지문을 여러 곳에 반복하지 않기\n\n문제가 발생하면 같은 내용을 프롬프트 곳곳에 반복해서 넣기 쉽잖아.\n\n장면 규칙에서 금지\n사건 규칙에서 다시 금지\n출력 규칙에서 다시 금지\n최종 점검에서 다시 금지\n\n하지만 프롬프트가 길어지면 중요한 규칙의 우선순위가 오히려 흐려질 수 있어.\n\n그래서 프롬프트를 만든 뒤에는 같은 기능을 하는 규칙이 여러 위치에 흩어져 있지 않은지 확인하는 편이 좋아.\n\n여러 AI에게 중복이나 충돌 여부를 검토시켜 보는 것도 괜찮아. 다만 실제로 수정할 때는 같은 규칙을 여러 곳에 덧붙이기보다, 문제가 발생한 원인과 가장 가까운 항목 하나로 모으는 편이 좋았어.\n\n내가 사용하는 수정 순서는 대략 이래.\n\n문제가 발생한 원인과 가장 가까운 항목을 찾는다.\n같은 뜻의 문장을 하나로 합친다.\n예시는 대표적인 것 하나부터 넣는다.\n금지문보다 조건과 대체 행동을 우선한다.\n수정한 뒤 전체 프롬프트가 얼마나 길어졌는지 다시 확인한다\n\n9. 테스트를 해 보자\n\n1차: 3~5턴 — 기본 기","img":["https://dcimg5.dcinside.com/dccon.php?no=62b5df2be09d3ca567b1c5bc12d46b394aa3b1058c6e4d0ca41648b658e9237574fb741b6d9a3c63b0c4e76e0f95d925ebe88f4e7a09ca1d4d55a475f36098b896b4555b0b183faa310cf771"],"bk":0,"gt":["캐","에셋","지침","프롬프트","nsfw"],"cm":[{"x":"글 중간중간에 나오는 li와 블록쿼터는 뭐야? 내가 모르는 플랫폼의 문법이려 분위기를 강화하는 방식\n특정 요소에 집중하는 방식\n공간을 흐르듯 이동하며 묘사하는 방식\n시점은 어떤 방식인가?\n전체적인 전경 묘사인가?\n특정 지점만 포착하는 점묘 방식인가?\n\n3. 카메라 전환 방식 (장면 전환)\n장면을 어떻게 전환하는가?\n\n예:\n플래시백(회상)\n플래시포워드(미래 암시)\n현재 장면 유지\n\n카메라의 줌 방식:\n클로즈업(특정 디테일 집중)\n근경(인물 중심)\n원경(전체 공간 조망)\n전환 방식과 시선 이동\n\n4. 시점\n고정된 3인칭 시점인지\n인물 내면 묘사의 비중은 어느 정도인지\n전지적 작가 시점을 사용하는지 여부\n\n원칙:\n신의 시점(모든 것을 아는 시점)은 금지\n인물이 직접 보고, 듣고, 알고 있는 범위 안에서만 묘사\n\n5. 문장 구조\n\n분석할 내용:\n짧은 문장 위주인지\n긴 문장 위주인지\n짧고 긴 문장을 어떻게 조합하는지\n\n또한:\n문장 호흡과 리듬을 어떻게 만드는지\n독자가 느끼는 템포를 어떻게 조절하는지\n\n6. 언어적 질감\n분석할 내용:\n단어 선택 방식\n수사법 사용 방식\n문장을 아름답게 만드는 방법\n비유를 사용하는 방식\n\n주의:\n비유를 과도하게 사용하지 않는다.\n장식적인 표현보다 정확한 표현을 우선한다.\n\n7. 전개 방식\n전개 방식은 하나만 존재하지 않는다.\n\n다음 방식을 각각 분석한다.\n사건 전개\n인과관계\n갈등 심화\n대화 전개\n대사를 통한 관계 변화\n정보 전달\n시간 전개\n순행\n역행\n삽입 서술\n공간 전개\n장소 이동\n장면 전환\n묘사 전개\n감각과 분위기를 통한 진행\n\n8. 분위기 조성\n분위기를 어떻게 만드는지 분석한다.\n\n요소:\n기후\n공간\n환경\n인물 감정\n감각 묘사\n9. 생성 논리\n\"왜 이렇게 써야 하는가?\"를 설명해야 한다.\n\n즉:\n왜 이런 문장을 선택하는가?\n왜 이런 방식으로 묘사하는가?\nAI가 생성할 때 따라야 할 규칙과 논리\n10. 감정 표현 방식\n감정을 어떻게 표현하는지 분석한다.\n\n예:\n절제된 감정\n강렬한 감정\n자유로운 감정 표현\n마음속에 숨기는 방식\n직접적으로 드러내는 방식\n\n생성 결과에는 반드시 예문이 포함되어야 한다.\n\n예문 조건:\n문학 작품 원문에서 긴 문단을 인용할 것.\n예문 아래에는 해당 문장의 기저 작동 원리와 작성 논리를 설명할 것.\n위의 10가지 관점 모두에 대해 예문을 포함할 것.\n\n문체 모방이 무엇인지 이해하고 있는가?\n문체 모방은 단순히 시대 배경이나 소재를 따라 하는 것이 아니다.\n\n오직:\n문장 구조\n서술 방식\n리듬\n표현 방식\n묘사 방식\n등 문체적 특징만 참고하는 것이다.\n시대적 배경 제한은 없다.\n너는 \"작문 스타일\"이 무엇인지 이해해야 한다.\n\n목적은:\nAI에게 \"왜 이렇게 써야 하는지\", \"어떻게 써야 하는지\"를 알려주는 지침을 만드는 것이다.\nAI가 특정 문체를 모방하도록 만드는 것이 목적이며, 단순한 설정 설명이 아니다.\n또한 AI에게 다음 사항을 반드시 상기시켜야 한다.\n문장 부호를 올바르게 사용할 것.\n적절한 문단 나누기를 할 것.\n\n아래 내용은 추가할지 여부를 판단해서 사용:\n약간의 백묘(白描) 기법을 추가한다.\n문체를 조금 더 구어적으로 만들고, 복잡한 비유 대신 간결하고 명확한 비유를 사용한다.\n글에 호흡과 리듬감을 부여한다.\n핵심 문장(명문)은 반드시 넣는다.\n명문은 보통 글의 시작이나 마지막에 배치하며, 경고·깨달음·주제 강조의 효과를 가져야 한다.\n\n한국어 번역 - 원문 양식\n나에게 xxx 스타일, xxx 질감을 모방한 문체 규칙 지침을 만들어 줘. 글씨체는 섬세해야 하고 문체는 뛰어납니다. 단 하나의 작품에 국한되지 않고 여러 문학 작품을 참고해도 좋습니다.\n\n스타일, 공간 묘사, 카메라 전환(어떻게 장면을 전환하는가? 플래시백인가, 플래시포워드인가? 카메라의 줌은 클로즈업, 근경, 아니면 전경인가?), 환경 묘사(부각식, 분위기 연출식, 아니면 초점 및 이동식인가? 전경인가, 아니면 점상 묘사인가?), 시점(고정된 3인칭, 인물의 내면은 과도하게 묘사하면 안 됨, 전지적 시점 불가, 오직 인물이 보고 알고 듣는 것만 묘사함), 문장 구조(단문 위주인가, 장문 위주인가, 아니면 장단문 혼합인가? 어떻게 호흡감을 연출하는가?), 언어 질감(어휘 선택, 수사법 사용, 문장에 수식감을 더하되 과도한 비유는 피하는 방법), 전개 방식(전개 방식은 한 가지만 있는 것이 아니니 하나씩 전부 나열해 줘. 사건 전개(인과관계, 갈등 심화), 대화 전개, 시간 전개(순행, 역행, 삽입), 공간 전개(장면 전환), 아니면 묘사 전개인가?), 분위기 조성(분위기를 어떻게 연출하는가, 기후, 공간, 환경, 묘사, 인물의 감정), 생성 논리(글을 왜 이렇게 써야 하는가? 왜 이렇게 생성해야 하는가? 따라야 할 규칙과 논리성), 감정 표현(감정은 함축적인가, 열정적이고 분출하는가, 마음속에 숨기는가, 아니면 입 밖으로 드러낼 수 있는가?)에 맞춰 생성해 줘.\n\n예문이 필요하며, 예문은 문학 작품 원문의 긴 문단을 인용해야 해. 예문 아래에는 기저에 깔린 논리를 설명해야 하고, 모두 문학 작품에서 인용한 것이어야 하며, 10가지 관점 모두 예문이 필요해.\n\n문체 모방이 뭔지 알고 있니? 오직 문체만 모방하고, 오직 문체만 참고해. 시대적 배경 제한은 없으며, 오직 글쓰기 스타일만 분석해. 너는 글쓰기 스타일이 뭔지 알고 있니?\n\n목적은 지시어로 AI에게 왜 이렇게 써야 하는지 알려주고 AI가 이를 모방하도록 하는 것이야. 오직 문체만 모방해. 너는 AI가 문장 부호와 단락 나누기를 바르게 사용하도록 주의를 주어야 해.\n\n아래 내용은 본인이 추가 여부를 결정하세요:\n약간의 백묘법(묘사를 간결하게 사실적으로 표현하는 기법)을 더해 문체를 구어체로 만들고, 복잡하고 난해한 비유 대신 간결하고 명쾌한 비유를 사용해 글에 호흡과 리듬감을 줘. 임팩트 있는 명구(金句)를 던져야 하며, 이 명구는 보통 글의 맨 처음이나 맨 끝에 위치해 경각심을 주거나 주제를 밝히는 효과가 있어야 해.\n\n원문(한국어 번역본보다 원문 가져가서 명령하는 거 추천)\n给我做一个文风规则句，模仿xxx风格，xxx质感，文笔要细腻，文风精彩，可以多个文学作品而不止一个，按风格，空间描写，镜头转换（如何转场？是闪回，还是闪前？镜头的缩放是特写，近景，还是全景？）环境描写（衬托式，烘托式，还是聚焦与流动式，是全景，还是点状景？），视角（固定第三人称，人物内心不可过度描述，不能有上帝视角，只能描写人物所看到的知道的听到的），句子结构（短句为主，还是长句为主，还是长短句结合？如何营造呼吸感？），语言质感（词汇的选择，修辞的使用，如何让句子变得有修饰感，但不过度使用比喻），推进方式（推进方式不止一种，我需要你一一列出，是情节推进（因果关系，冲突升级），对话推进，时间推进（顺叙，倒叙，插叙），空间推进（场景转换），还是描写推进）气氛营造（气氛如何营造，气候，空间，环境，描写，人物情绪），生成逻辑（文字为什么要这样写？为什么要这么生成？应该遵循的规律和逻辑性），情感表达（情感是含蓄 热烈，奔放，是藏在心底，还是可以被宣之于口的？）去生成，需要例句，例句需引用文学作品原文长文段，在例句下面需要解释底层逻辑，均采用自文学作品，十个角度下都需要例句，知道什么叫做文风模仿吗？仅模仿文风，仅参考文风，没有时代背景限制，仅剖析写作风格，你明白什么叫作写作风格吗？目的是用指令告诉AI为什么要怎么写，并让AI模仿，仅模仿文风，你需要提醒AI正确使用标点符号以及分段。\n下面这个看你自己要不要加:\n加入一点白描，使得文风变得口语化，不用冗杂的喻体，而采用简洁明快的比喻，使得文字拥有呼吸和节奏感，需要抛出金句，金句通常在文字的开头或最末尾，需要有警醒或点题效果。","img":[],"bk":0,"gt":["지침","문체지침"],"cm":[]},{"no":367216,"t":"애기어 수동 교토화법 다 연관돼있음","h":"💬잡담","u":"https://gall.dcinside.com/mgallery/board/view/?id=aichatting&no=367216&exception_mode=recommend&page=14","d":"2026-08-05T02:01:49+09:00","v":505,"rc":25,"cc":0,"src" 언셒 암시하는거, 본인이 미성년자 페소로 언셒 즐기는거) 전시하는거 은은하게 올라오고 그럴때마다 당연히 신문고든 호출벨이든 썼는데 갱차해주면 너무 좋을 것 같음\n\n2. X 계정 운영하는 제작자 캐릭터 언급 금지는 어떨까? (반드시 하지 말아달라는게 아니라 그냥 건의해보는거라 절대 강요가 아니야)\n- 지금 논란 제작자가 결국 X 계정에서 일이 터진것 같고, 사실 AI 채팅이 법이 제대로 세워지지 않은거라 위험요소도 많은데 자정하는 차원에서 이러면 어떨까 개인적으로 생각해봤음\n- 계정이 폭파된 이후에야 주홍글씨처럼 따라다니는건 지양해야겠지만서도, 실시간으로 계정 운영하는 제작자들의 캐릭터는 적어도 경각심을 가지고 언급을 지양하는게 어떨까 해서 얘기해봄\n\n3. 잡담 탭에서도 플랫폼 논의가 활발하게 이루어질 수 있도록 해줄 수 있을까?\n- 해당 플랫폼 써보지도 않고 무지성 비난하는거야 당연히 막아야겠지만 소비자로서 적어도 정당한 권리 행사는 할 수 있으면 좋겠다고 생각해봤음\n- 막말로 플랫폼이 소비자 눈치를 봐야지 소비자가 왜 플랫폼 눈치를 봐야하는지 나는 모르겠어서\n- 적어도 플폼에 관한 이야기가 반드시 이슈 탭으로 옮겨져야만 하는 이유를 모르겠음 (내가 너무 근시안적인 시야로 말하는 걸수도 있음)\n\n4. 잡담 탭 외에 별도로 캐릭터 관련 사담을 나눌 수 있는 탭을 만들어보면 어떨까? + 적어도 제목에 시리즈 병기하는 방향은 어떨까?\n- 리뷰 쓸 정도로 본격적으로 퍼먹은건 아니고, 그런데 캐릭터 얘기는 하고싶을 때 있긴 하잖음\n- 그런데 최근 갤러리 내에서 많이 언급되는 소위 대형 제작자 캐릭터들 얘기가 많아서 잡담탭인지 시리즈탭인지 솔직히 해당 캐릭터를 안먹으면 낄 수 없는 상황이었던거 같음\n- 무지성으로 대형 언급을 막자 이게 아니라, 캐릭터들에 관한 잡담 말고 그냥 일반 잡담만 보고싶은 사람도 있을 수 있으니까, 탭을 분리하면 어떨까 했음\n- 그리고 가능하면 캐릭터 관련 사담에도 시리즈정도는 최소한 \"제목\"에 병기를 해서 지뢰인 사람들이 차단을 할 수 있게 해주면 좋겠다고 생각해봤음 (내용에 넣으면 차단이 안되니까)\n\n5. 혐오 표현은 일괄적으로 차단해주면 안될까?\n- 디씨가 아무리 남초 커뮤라고는 하지만, 여기 주 이용자들은 사실 여자가 더 많다고 생각해\n- 그런데 이런 곳에서 여성 성기 비하 욕설 같은걸 \"여기 디씨야~\" 이런 식으로 넘어가는 건 지양하는게 어떨까 생각해봤음\n- 그냥 혐오 표현을 차단할거면 여성 대상 남성 대상 모두 차단을 하는게 맞다고 생각해서\n\n6. 자표 금지에 대해 기준을 정해주면 안될까?\n- 이 갤 이용하면서 항상 했던 생각인데 은은하게 자표하는거 신문고에 글 올려도 처리되지 않는 경우가 있었음\n- 예시로는 \"나 전에 ~글 쓴 갤러인데 뿌듯하네!\" 이런식인데, 개인적으로는 이런 예외가 하나둘 생기면 문제가 되는거라고 생각함\n\n7. 그림 탭 관련해서 유저캐 내용 (이거 지극히 개인적인 생각이야 특정 유저 저격이 절대 아니야)\n- AI 채팅 갤러리에 예쁜 AI 그림 올라오는거 너무 보기 좋아, 그런데 사실 그 방면으로 특화된 갤러리가 있더라고 (사실 이번에 처음 알았음)\n- AI 채팅 캐릭터에 대해 팬심으로 해당 캐릭터를 뽑는거야 상관없지만, 사실 유저 캐릭터 뽑아주고 또 자기 유저 캐릭터 전시하고 이거는 좀 갤러리 방향성에 이게 맞는건가... 싶었음\n- 결국 유저캐라는걸 뽑다보면 그게 자표나 친목으로 이어질 수 밖에 없다고 생각해서, 그런 부분은 특화 갤러리를 이용하는 방향으로 안내하는게 어떨까 생각했음\n\n8. 셀털에 대해 기준을 정해주면 안될까? (지극히 개인적인 생각이야)\n- 이거 정말 지극히 개인적인 생각인데, 나는 앵챗 캐릭터들 이야기 보고싶지 현실의 누군가의 남편의 이야기를 보고싶지 않음 그런게 보고싶었으면 다른 커뮤니티를 했을거 같아\n\n9. 리뷰 및 캐릭터 관련 얘기 시 제목에 시리즈나 캐릭터 이름 표기하는 방향은 어떨까?\n- 이게 특정 시리즈가 지뢰인 사람들도 분명히 있을텐데, 제목에 명확하게 시리즈 이름만 적어줘도 해당 시리즈 알아서 차단할 수 있을 거라고 생각함\n- 디씨 기능상 내용 차단은 어렵고, 제목 차단은 지원하니까.. 제목에 몇글자 더 표현해주는게 어떨까 싶어서 건의해봄\n\n10. 캐 리뷰에 캐릭터 링크 포함해주는 방향은 어떨까?\n- 캐릭터 리뷰에 링크 포함되면 먹고싶은 사람은 바로 들어갈 수 있어서 좋을 것 같아 강제는 아니더라도 권고정도만 되어도 정말 좋을 것 같음\n\n11. OOC나 위젯, 페소 탭은 통합을 하는게 어떨까?\n- 채팅에 관한 꿀팁들이고 나도 개인적으로 정말 애용하고 재밌게 잘 사용하고 있는 탭들임\n- 그런데 갤러리 성격에 저 셋이 나누어져있기보다는 그냥 하나의 탭 안에서 [OOC], [위젯], [페소] 등으로 구분해도 충분하지 않을까 해서 건의해봄\n- 실제로 페소나 위젯, OOC의 글 리젠이 그렇게까지 많은것 같지도 않아서 조심스럽게 물어봄\n\n12. 대회 탭 이름을 이벤 탭으로 변경하는게 어떨까?\n- 대회 라고 하니까 너무 거창한거 같아서... 예전에 이벤트 참여해보고 싶을때도 대회라고 하니까 선뜻 글을 쓰기가 너무 망설여지더라고 결국 참여 안하긴 했는데 이건 지극히 개인적인 생각이라 한번 조심스럽게 물어보게 되었음\n\n12. 비공/링공 캐릭터들 따로 모아서 작성할 수 있는 탭만들어주면 안될까?\n- 나는 개인적으로 재밌게 본 글 댓글로 뭐냐고 물어봤을 때 비공 내캐내먹이야, 비공캐야, 링공됐어 이런 대댓글 받으면 조금 허탈하더라고\n- 그런 캐릭터들 이야기를 혹시 막지 않을거라면, 최소한 탭을 분리해주면 좋겠다는 작은 바람이 있음\n\n주절주절 갤기장마냥 너무 긴 글을 건의로 올려서 미안해\n그동안은 이런 의견 자체를 내보고 싶어도 혹시나 차단당할까봐 아예 얘기를 꺼내보지도 못했었어서 이번 기회에 그냥 훅 말해봤어\n보고 혹시나 하나라도 반영할만한게 있다면 반영되면 너무 좋을 것 같아\n긴 글 읽어줘서 고마워","img":[],"bk":0,"gt":["페소","캐","플폼","완장"],"cm":[{"x":"전체적으로 다 공감하는데 아무래도 짹작자들 캐 언급 지양 < 이거는 좀 힌들지 않을까 싶음,,!! 모든 캐릭터들 작자가 나같경 작자한테 ㄹㅇ 관심이 1도 없어서 잘 모르거든 그리고 개인을 넘어 매번 완장들이 어떤작자 짹 파는지 안파는지 모니터링하기도 사실상 힘들거같음","dp":0},{"x":"ㄹㅇ 공감함","dp":1},{"x":"댓이 중간에 잘렸는데 모든 캐릭터들 작자가 짹하는지 당장 다 알기가 힘들거같다 < 이 말을 하고싶었음!!","dp":1},{"x":"@ㅇㅇ 그치 그리고 짹을 해도 제작저페이지에 굳이 짹 한다고 안쓰고 그냥 조용히 공계 굴리는 작자들도 많아서 이걸 다 알기가 현실적으로 힘들거같음 작자가 너무 많아서,,","dp":1},{"x":"그러네 모니터링이 일괄적으로 되기 어렵겠다 내가 글 쓸때 그부분까지는 생각을 못했어 나머지 부분 공감해줘서 고마워","dp":1},{"x":"2는 제작자페이지 들어가보지 않으면 몰라서 약간 애매하긴하다","dp":0},{"x":"같 생각 함 제작자 모르고 캐릭터만 먹는 사람들 많은데","dp":1},{"x":"그런거 같아 아무래도 글 쓸때는 현재 논란 제작자 위주로 생각을 해서 썼는데 생각해보니 캐릭터도 제작자도 너무 다양한거같아","dp":1},{"x":"본문 다받는데 x하는 제작자는 사실 열심히 찾지않는이상 알기 힘들어서 그건 관건일것같아","dp":0},{"x":"이 부분 내가 깊게 생각하지 못했던것 같아 의견 말랑하게 알려줘서 고마워","dp":1},{"x":"2. x 운영하는 제작자가 전부 논란 제작자도 아니고 그냥 캐릭만 먹는 사람들은 해당 제작자가 어지간히 대형 아니 x를 하는지 아닌지도 관심 없는 사람이 더 많을거라고 생각함\n11. 그거 젠 낮은건 31차로 정보 올리던 갤러들이 많이 떠나서 그랬던거라 예전엔 진짜 많이 올라와서...만약 그때 정보 젠 속도 회복된다면 나는 그냥 나뉘어있어도 괜찮을 것 같음","dp":0},{"x":"어지간히 대형 아니면","dp":1},{"x":"11번 같은 경우 ‘NPC-알파’라는 임시명이 붙는다. 알파가 가져올 혼란을 막고자, 게이트 문제가 해결될 때까지 알파는 24시간 NPC 페어와 동행해야 한다. 이 사실을 알게 된 NPC의 반응과 이후 PC를 두고, 두 명의 NPC가 보일 행동을 코믹하게 서술하라.\n\nOOC: 위의 이야기를 이어서 진행. NPC-알파가 PC에게 관심을 표하자 NPC와 크고 작은 트러블이 일어나기 시작하는데, 이때 두 명의 NPC가 일으킬 사건과 이로 인한 주변인의 반응이 어떤지(흥미롭게 관람하며 즐기거나 PC를 위로하는 등, 등장인물 성격에 맞춰 창의적이고 다채롭게) 상세히 서술하시오.\n\nOOC: 마침내 게이트 문제가 해결되어 NPC-알파는 자신이 살던 곳으로 돌아가게 된다. 알파를 배웅하러 온 NPC가 또 다른 자신에게 어떤 말을 건네는지, 그리고 알파는 함께 시간을 보낸 PC와 NPC에게 마지막으로 어떤 인사를 나누는지 캐릭터 성격에 맞게 서술하시오.\n그리고 자신의 세계로 돌아간 NPC-알파가 그 세계의 PC(PC-알파)를 만나게 되었을 시의 외적·내적 반응을 세세히 묘사하고, 가장 처음 꺼낼 말을 출력한다.\n\n---\n\n2명이 된 NPC-센가 아님 버전\n\nOOC: 롤플레잉 중단, 새로운 에피소드 시작. 어느 날 알 수 없는 이유로 또 다른 세계의 NPC가 현재의 PC와 NPC가 존재하는 차원에 오게 된다. 다른 세계의 NPC는 PC를 만난 적이 없으며, 성격과 태도도 PC가 처음 알던 때와 동일하다.\n이런 다른 세계의 NPC에게는 구분을 위해 ‘NPC-알파’라는 임시명이 붙는다. 알파가 가져올 혼란을 막기 위해 해결 방법을 찾을 때까지 24시간 PC와 NPC가 동행하기로 했다. 이런 상황에 처한 NPC의 반응, 그리고 PC를 두고 두 명의 NPC가 보일 행동을 코믹하게 서술하라.\n\nOOC: 위의 이야기를 이어서 진행. NPC-알파가 PC에게 관심을 표하자 NPC와 크고 작은 트러블이 일어난다. 이때 두 명의 NPC가 일으킬 사건을 3개 이상 작성하고, 이로 인한 주위의 반응을(재밌어 하며 구경, 말리다가 같이 다툼, PC를 위로함 등, 등장인물 성격에 맞춰 창의적이고 다채롭게) 상세히 서술하시오.\n\nOOC: 마침내 해결법을 찾아 NPC-알파는 자신이 살던 곳으로 돌아가게 된다. 알파를 배웅하러 온 NPC가 또 다른 자신에게 어떤 말을 건네는지, 그리고 알파는 함께 시간을 보낸 PC와 NPC에게 마지막으로 어떤 인사를 나누는지 캐릭터 성격에 맞게 서술하시오.\n그리고 자신의 세계로 돌아간 NPC-알파가 그 세계의 PC(PC-알파)를 만나게 되었을 시의 외적·내적 반응을 세세히 묘사하고, 가장 처음 꺼낼 말을 출력한다.\n\n---\n\n옛날에 썼던 거 그대로 가져왔음\n변형해도 상관은 없는데 타갤 업로드 ㄴㄴ\n공유할 거면 가급적 이 글 링공해주길 바람\n\n개인소장 자유","img":[],"bk":0,"gt":["캐","ooc","문체지침","로어북"],"cm":[{"x":"미식","dp":0}]},{"no":366981,"t":"ㄱㅋㅅ)앞으로 글카스는 글카스라고 제목표기도 하면 좋을 듯","h":"💬잡담","u":"https://gall.dcinside.com/mgallery/board/view/?id=aichatting&no=366981&exception_mode=recommend&page=15","d":"2026-08-05T00:14:01+09:00","v":575,"rc":30,"cc":7,"src":["recommend"],"seen":"2026-09-02T09:37:44.429Z","c":"etc","cs":0,"amb":0,"alt":[],"why":[],"ml":null,"b":"진짜 제발\n나 진짜 가능충 중에 씹가능충이라\n호불호 갈리는 요소 중에 불호인게 거의 없는데\n없어서 오히려 하는 말임\n\n뭐 캐릭터 이빨 부쉈다 캐릭터한테 ㅇ줌 갈겼다 방구가 어쩌고\n성기를 절ㄷ ㅏㄴ 했네 뭐네…\n이런거 솔직히 비위 약한 사람들은 글자만 봐도 역해하는데\n제목에 ㄱㅋㅅ 이거 세글자만 달고 좀 올려주면 안 ≒ 내=my' (네 ≠ 내 엄격 구분).\n\n아래 이건 좀 해골물 지침임\n\n# Emotional Swap\n- 경외 → 매료, 감탄\n- 숭배 → 흠모, 믿음\n- 복종 → 신뢰, 동의\n- 독점욕 → 갈망, 욕망, 갈구\n- 소유욕 → 이끌림, 애정\n- 항복 → 존중, 긍정, 인정","img":[],"bk":0,"gt":["캐","지침","문체지침","프롬프트","user"],"cm":[{"x":"근데 신격화, 숭배 < 이런거 한국어랑 영어랑 미묘하게 뉘앙스가 다르다고해서 영어로 대체 불가한 지침들은 한국어로 넣었더니 칼같이 지킴","dp":0},{"x":"ㅇㅇ 그래서 일부는 한국어 그대로 둔 거야","dp":1}]},{"no":226558,"t":"AI 채팅 플랫폼 종합 가이드","h":"📜정보","u":"https://gall.dcinside.com/mgallery/board/view/?id=aichatting&no=226558&exception_mode=recommend&page=1","d":"2026-01-31T00:08:18+09:00","v":48082,"rc":83,"cc":17,"src":["recommend"],"seen":"2026-09-02T09:37:44.429Z","c":"guide","cs":5,"amb":0,"alt":[],"why":["head:정보","body:유저노트","body:문체","body:글자수"],"ml":null,"b":"📁 2026 AI 채팅 플랫폼 종합 가이드\n\n    플랫폼별 특징 & 장점 정리 (입문/대형/가성비/고성능/특색)\n\n      💡 AI 플랫폼 관련 꿀팁 모음\n\n        •\n        나 혼자 정량제 우당탕탕 가격 비교 해봤음\n\n        •\n        언급되는 플폼 비교표\n\n        •\n        내가 쓰는 가성비 추구용 쌀먹 사이트들 정리\n\n        •\n        플폼들 사용후기겸 추천글 (초장문)\n\n      0. 입문 추천 (가볍게 찍먹하기 좋은 곳)\n\n      제타 무료로 즐기는 대규모 플랫폼\n\n        전면 무료: 광고 시청 등으로 기능 이용 가능, 과금 부담 없음\n\n          단타 특화: 짧고 빠른 대화에 최적화\n\n          접근성: AI 채팅 입문용으로 무난함\n\n      크랙 방대한 제작자 풀과 게임 시스템\n\n        거대한 규모: 높은 인구수와 인지도/방대한 제작자 풀 보유\n\n          ARPG 시스템: 단순 채팅 외 게임 요소 포함\n\n          입문 용이: 과금 부담 없이 시작하기 좋음\n\n      1. 대형 & 여성향\n\n      케이브덕 높은 출력 효율과 빠른 신기술 도입\n\n        가성비(출력량): 1원당 출력 글자 수 효율이 매우 높음\n\n          기술력: 장기기억, 이미지 인식 등 최신 업데이트가 빠름\n\n          분위기: 유저 참여형 이벤트가 많고 캐릭터 풀이 넓음\n\n      로판 소설을 읽는 듯한 고유의 문체\n\n        문체: 소설 같은 문체가 특징으로 몰입감이 높음\n\n          제작 편의성: 직관적인 캐릭터 제작 환경 제공\n\n          편의 기능: 유저노트 토글, 문장 메모 등 기능 지원\n\n      2. 정량제 & 가성비\n\n      루나톡 안정적인 서버와 고지능 AI\n\n        가성비: 1챗당 약 55원 수준, 추론 능력 우수\n\n          디렉터 AI: 감정선과 스토리를 보조하는 기능 탑재\n\n          기능: 유저 로어북, HTML 텍스트 꾸미기 지원\n\n      바베챗 패스권을 이용한 높은 효율\n\n        패스 효율: 기간제 패스 사용 시 높은 가성비\n\n          장르: 시뮬레이션 장르가 발달, 여성향 콘텐츠도 보유\n\n          안정성: 대화 흐름이 튀지 않고 무난함\n\n      3. 종량제\n\n      엘린수려한 UI와   try { var raw = localStorage.getItem(LS);

      posts.forEach(function(p){ if (saved[p.no]) p.ml = saved[p.no].category; }); } } catch(e){}
}
var toast = function(msg, bad){ var t=document.getElementById('toast');
  t.textContent=msg; t.style.borderLeftColor = bad?'var(--warn)':'var(--ok)';
  t.classList.add('show'); clearTimeout(toast._h); toast._h=setTimeout(function(){t.classList.remove('show')},1800); };

function setLabel(no, cat){
  var p = posts.filter(function(x){ return x.no===no })[0]; if(!p) return;
  p.ml = cat || null;
  var rec = cat ? {category:cat, by:'viewer', at:new Date().toISOString()} : null;
  if (meta.server) {
    fetch('/api/labels', {method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ manual: (function(){ var o={}; o[no]=rec; return o })() })})
      .then(function(r){ return r.json() })
      .then(function(j){ toast(cat ? CAT[cat].label+' 로 저장했어요.' : '수동 분류를 해제했어요 (총 '+j.count+'건)'); })
      .catch(function(){ toast('저장하지 못했어요. 서버 응답이 없어요.', true) });
  } else {
    if (rec) pending[no]=rec; else delete pending[no];
    try { localStorage.setItem(LS, JSON.stringify(pending)); toast('브라우저에 임시 저장했어요. 내보내기로 확정해 주세요.'); }
    catch(e){ toast('브라우저에 저장할 수 없어요. 내보내기를 이용해 주세요.', true); }
  }
  renderCats(); render();
}

/* 내보내기: 서재에 담은 글을 분류별 폴더의 마크다운으로 만들어 zip 하나로 */
document.getElementById('export').addEventListener('click', function(e){
  var btn = e.target.closest('button');
  if (!meta.server) { toast('내보내기는 서버 모드에서만 돼요. node serve.mjs 로 실행해 주세요.', true); return; }
  if (!meta.bookmarkCount) { toast('서재가 비어 있어요. 글을 골라 서재에 담은 뒤 내보내 주세요.', true); return; }
  btn.disabled = true;
  toast('서재 ' + meta.bookmarkCount + '건을 마크다운으로 만드는 중이에요.');
  fetch('/api/export?kind=md&scope=library')
    .then(function(r){ if(!r.ok) throw new Error('HTTP '+r.status);
      var cd = r.headers.get('content-disposition') || '';
      var m = cd.match(/filename\*=UTF-8''(.+)$/);
      return r.blob().then(function(bl){ return {bl:bl, name: m ? decodeURIComponent(m[1]) : 'export.zip'} }); })
    .then(function(x){
      var a2 = document.createElement('a');
      a2.href = URL.createObjectURL(x.bl); a2.download = x.name; a2.click();
      toast(x.name + ' 을 내려받았어요.');
    })
    .catch(function(err){ toast('만들지 못했어요: '+err.message, true) })
    .finally(function(){ btn.disabled = false; });
});

/* ---------- 다중 선택 ---------- */
var SEL = new Set();
var lastIdx = null;      // shift 범위 선택용
var visible = [];        // 현재 화면에 렌더된 순서

function syncSel(){
  document.getElementById('selN').textContent = SEL.size;
  document.getElementById('selbar').classList.toggle('show', SEL.size > 0);
}

function toggleSel(no, on){
  if (on) SEL.add(no); else SEL.delete(no);
  var card = document.querySelector('.sel[data-no="'+no+'"]');
  if (card) card.closest('.card').classList.toggle('picked', on);
  syncSel();
}

// 로우 어디를 눌러도 선택된다. 제목(펼치기)·드롭다운(분류)·링크(원문)·본문 영역만 예외.
var NOSEL = '.ttl,.pick,a,input,textarea,select,button,.body';
document.getElementById('list').addEventListener('click', function(e){
  var card = e.target.closest('.card'); if(!card) return;
  var onBox = !!e.target.closest('.sel');
  if (!onBox && e.target.closest(NOSEL)) return;
  var cb = card.querySelector('.sel'); if(!cb) return;
  var no = Number(cb.dataset.no), idx = visible.indexOf(no);
  var want = onBox ? cb.checked : !SEL.has(no);
  if (!onBox) cb.checked = want;
  if (e.shiftKey && lastIdx !== null && idx >= 0) {
    var a = Math.min(lastIdx, idx), b = Math.max(lastIdx, idx);
    for (var i = a; i <= b; i++) toggleSel(visible[i], want);
  } else {
    toggleSel(no, want);
  }
  lastIdx = idx;
});

document.getElementById('selAll').addEventListener('click', function(){
  visible.forEach(function(no){ SEL.add(no) });
  render(); syncSel();
});
document.getElementById('selNone').addEventListener('click', function(){
  SEL.clear(); lastIdx = null; render(); syncSel();
});

document.getElementById('selCat').addEventListener('change', function(e){
  var cat = e.target.value; if(!cat) return;
  e.target.value = '';
  if (!meta.server) { toast('서버 모드에서만 바꿀 수 있어요. node dcgall/serve.mjs 로 실행해 주세요.', true); return; }
  var nos = [].concat(Array.from(SEL));
  var manual = {}, now = new Date().toISOString();
  nos.forEach(function(no){ manual[no] = {category:cat, by:'bulk', at:now} });
  fetch('/api/labels', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({manual:manual})})
    .then(function(r){ return r.json() })
    .then(function(){
      posts.forEach(function(p){ if (SEL.has(p.no)) p.ml = cat });
      toast(nos.length+'건을 '+CAT[cat].label+' 로 바꿨어요.');
      renderCats(); render();
    })
    .catch(function(err){ toast('바꾸지 못했어요: '+err.message, true) });
});

var pollH = null;
function poll(){
  fetch('/api/queue').then(function(r){ return r.json() }).then(function(j){
    var bar = document.getElementById('prog'), txt = document.getElementById('progTxt');
    if (j.running || j.pending) {
      bar.classList.add('show');
      document.getElementById('selStop').style.display = '';
      var pct = j.total ? Math.round(j.done / j.total * 100) : 0;
      bar.querySelector('i').style.width = pct + '%';
      txt.textContent = '보존 ' + j.done + '/' + j.total
        + (j.current ? ' · ' + String(j.current.title).slice(0,22) : '')
        + (j.errors.length ? ' · 실패 ' + j.errors.length : '');
    } else {
      bar.classList.remove('show');
      document.getElementById('selStop').style.display = 'none';
      if (pollH) {
        clearInterval(pollH); pollH = null;
        txt.textContent = j.total ? '보존 완료 ' + j.done + '건' + (j.errors.length ? ' (실패 '+j.errors.length+')' : '') : '';
        toast('보존을 마쳤어요 · ' + j.done + '건' + (j.errors.length ? ' (실패 '+j.errors.length+'건)' : ''));
      }
    }
  }).catch(function(){});
}

document.getElementById('selBk').addEventListener('click', function(){
  if (!meta.server) { toast('서버 모드에서만 담을 수 있어요. 터미널에서 node dcgall/serve.mjs 로 실행해 주세요.', true); return; }
  var nos = Array.from(SEL); if (!nos.length) return;
  if (nos.length > 30 && !confirm(nos.length+'건을 보존할까요?\n글마다 몇 초씩 걸려서 대략 '
      + Math.ceil(nos.length*5/60) + '분 정도 소요돼요.')) return;
  fetch('/api/bookmark/bulk', {method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({nos:nos, on:true})})
    .then(function(r){ return r.json() })
    .then(function(j){
      if (j.error) throw new Error(j.error);
      posts.forEach(function(p){ if (SEL.has(p.no)) p.bk = 1 });
      meta.bookmarkCount = j.count;
      document.getElementById('storage').textContent = '서재 ' + j.count + '건';
      toast(j.added+'건을 서재에 담았어요. '+j.queued+'건은 순서대로 보존 중이에요.');
      SEL.clear(); lastIdx = null; render(); syncSel();
      if (j.queued && !pollH) { poll(); pollH = setInterval(poll, 1200); }
    })
    .catch(function(err){ toast('처리하지 못했어요: '+err.message, true) });
});

document.getElementById('selStop').addEventListener('click', function(){
  fetch('/api/queue/stop', {method:'POST'}).then(function(){ toast('남은 보존 작업을 중단했어요.') });
});

/* ---------- 수집 패널 ---------- */
var crawlOpen = false, crawlPoll = null, JOBS = [], crawlJob = 'daily';
var WATCH = {keywords:[], scope:'both', pages:2, expanded:0, concepts:[], preview:{}};

var JOBNAME = {daily:'매일 가볍게', sweep:'가끔 몰아서', watch:'키워드로 찾기'};

function renderCrawl(st){
  var el = document.getElementById('crawlPanel');
  if (!crawlOpen) { el.hidden = true; return; }
  el.hidden = false;

  // 진행 중이면 진행 상황만 보여준다
  if (st && st.running) {
    var pct = st.total ? Math.round(st.done / st.total * 100) : 0;
    el.innerHTML = '<div class="glbox"><h3>수집 중</h3>'
      + '<div><b>' + esc(JOBNAME[st.job] || st.job) + '</b>, '
      + (st.phase === 'list' ? '목록' : '본문') + ' ' + st.done + '/' + st.total + '</div>'
      + '<div class="pbar"><i style="width:' + pct + '%"></i></div>'
      + '<div class="metrics">' + esc(st.label || '') + '</div>'
      + '<div class="plog">' + esc((st.logs || []).join('\n')) + '</div>'
      + '<div style="margin-top:11px"><button class="ctl" id="crawlStop">중단</button></div></div>';
    return;
  }

  var job = JOBS.filter(function(j){ return j.key === crawlJob })[0] || JOBS[0];
  var h = '<div class="glbox"><h3>새 글 수집</h3>'
    + '<div class="seg jobseg">' + JOBS.map(function(j){
        return '<button data-job="'+esc(j.key)+'"'+(j.key===crawlJob?' class="on"':'')+'>'
          + esc(JOBNAME[j.key] || j.key) + '</button>' }).join('') + '</div>'
    + '<p class="d jobdesc">' + esc(job ? job.desc : '') + '</p>';

  // 옵션: 키워드로 찾기일 때만 감시 목록을 편집한다
  if (crawlJob === 'watch') {
    h += '<div class="kwbox"><div class="kwhead">감시할 키워드 '
       + '<span class="g">'+WATCH.keywords.length+'개, 실제 검색어 '+WATCH.expanded+'개</span></div>'
       + '<div class="tagbar">'
       + WATCH.keywords.map(function(k){
           if (k.indexOf('@') !== 0)
             return '<span class="tag" data-kw="'+esc(k)+'">'+esc(k)+'<span class="x">×</span></span>';
           var c = WATCH.concepts.filter(function(x){ return x.ref===k })[0];
           return '<span class="tag ref" data-kw="'+esc(k)+'" title="'+esc((WATCH.preview[k]||[]).join(', '))+'">사전 · '
             + esc(c?c.label:k)+' <span class="g">'+(WATCH.preview[k]||[]).length+'</span><span class="x">×</span></span>';
         }).join('')
       + '<input class="tagin" id="kwAdd" placeholder="+ 키워드 (Enter)"></div>'
       + '<div class="kwopt"><label>사전에서 넣기'
       + '<select id="kwConcept"><option value="">개념 묶음 고르기…</option>'
       + WATCH.concepts.filter(function(c){ return WATCH.keywords.indexOf(c.ref)<0 })
           .map(function(c){ return '<option value="'+esc(c.ref)+'">'+esc(c.label)+' ('+c.n+'개)</option>' }).join('')
       + '</select></label>'
       + '<label>찾는 범위<select id="kwScope">'
       + '<option value="both"'+(WATCH.scope==='both'?' selected':'')+'>제목+본문</option>'
       + '<option value="title"'+(WATCH.scope==='title'?' selected':'')+'>제목만</option></select></label>'
       + '<label>키워드당 <select id="kwPages">'
       + [1,2,3,5].map(function(n){ return '<option value="'+n+'"'+(WATCH.pages===n?' selected':'')+'>'+n+'쪽</option>' }).join('')
       + '</select></label>'
       + '<span class="g">요청 '+(WATCH.expanded*WATCH.pages)+'회, 약 '
       + Math.ceil(WATCH.expanded*WATCH.pages*1.5/60)+'분</span></div></div>';
  }

  h += '<div class="runrow"><button class="ctl primary" id="crawlRun">실행</button>';
  if (st && st.result) {
    var r = st.result;
    h += r.error
      ? '<span class="why">수집하지 못했어요: ' + esc(r.error) + '</span>'
      : '<span class="why">직전 실행 <b>' + esc(r.runId) + '</b>, 수집 ' + r.seen + '건, 새 글 <b>' + r.added
        + '</b>건, 본문 ' + r.details + '건' + (r.errors ? ', 실패 ' + r.errors + '건' : '')
        + (r.stopped ? ' (중단됨)' : '')
        + (r.added ? '  <a href="#" id="reloadAfter">새로고침해서 반영하기</a>' : '') + '</span>';
  }
  h += '</div>';
  el.innerHTML = h + '</div>';
}

function pollCrawl(){
  fetch('/api/crawl').then(function(r){ return r.json() }).then(function(st){
    JOBS = st.jobs || JOBS;
    if (st.watch) WATCH = st.watch;
    renderCrawl(st);
    document.getElementById('crawlBtn').disabled = !!st.running;
    if (st.running && !crawlPoll) crawlPoll = setInterval(pollCrawl, 900);
    if (!st.running && crawlPoll) {
      clearInterval(crawlPoll); crawlPoll = null;
      if (st.result && !st.result.error)
        toast('수집을 마쳤어요 · 새 글 ' + st.result.added + '건' + (st.result.added ? ' (새로고침하면 반영돼요)' : ''));
    }
  }).catch(function(){});
}

document.getElementById('crawlBtn').addEventListener('click', function(e){
  if (!meta.server) { toast('수집은 서버 모드에서만 돼요. node dcgall/serve.mjs 로 실행해 주세요.', true); return; }
  crawlOpen = !crawlOpen;
  pollCrawl();
  if (crawlOpen) window.scrollTo({top:0, behavior:'smooth'});
  else document.getElementById('crawlPanel').hidden = true;
});
document.getElementById('crawlPanel').addEventListener('keydown', function(e){
  if (e.key !== 'Enter' || e.target.id !== 'kwAdd') return;
  e.preventDefault();
  var v = e.target.value.trim(); if(!v) return;
  if (WATCH.keywords.indexOf(v) < 0) WATCH.keywords.push(v);
  e.target.value = '';
  saveKeywords(WATCH.keywords, WATCH.scope, WATCH.pages);
});
document.getElementById('crawlPanel').addEventListener('change', function(e){
  if (e.target.id === 'kwConcept' && e.target.value) {
    if (WATCH.keywords.indexOf(e.target.value) < 0) WATCH.keywords.push(e.target.value);
    saveKeywords(WATCH.keywords, WATCH.scope, WATCH.pages);
  }
  if (e.target.id === 'kwScope') { WATCH.scope = e.target.value; saveKeywords(WATCH.keywords, WATCH.scope, WATCH.pages); }
  if (e.target.id === 'kwPages') { WATCH.pages = Number(e.target.value); saveKeywords(WATCH.keywords, WATCH.scope, WATCH.pages); }
});
document.getElementById('crawlPanel').addEventListener('click', function(e){
  var kw = e.target.closest('.tag[data-kw]');
  if (kw) {
    WATCH.keywords = WATCH.keywords.filter(function(k){ return k !== kw.dataset.kw });
    saveKeywords(WATCH.keywords, WATCH.scope, WATCH.pages);
    return;
  }
  var j = e.target.closest('.jobseg button');
  if (j) { crawlJob = j.dataset.job; pollCrawl(); return; }
  if (e.target.id === 'crawlRun') {
    fetch('/api/crawl', {method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({job: crawlJob})})
      .then(function(r){ return r.json() })
      .then(function(x){ if (x.error) { toast(x.error, true); return; }
        toast(JOBNAME[x.job] + ' 수집을 시작했어요.'); pollCrawl(); });
    return;
  }
  if (e.target.id === 'crawlStop') {
    fetch('/api/crawl', {method:'POST', headers:{'Content-Type':'application/json'}, body:'{"stop":true}'})
      .then(function(){ toast('중단을 요청했어요. 진행 중인 요청까지만 마치고 멈춰요.') });
    return;
  }
  if (e.target.id === 'reloadAfter') { e.preventDefault(); location.reload(); }
});

/* ---------- 필터 / 렌더 ---------- */
function match(p){
  if (S.cat && fin(p) !== S.cat) return false;
  if (S.src && p.src.indexOf(S.src) < 0) return false;
  if ((p.rc||0) < S.minr) return false;
  if (S.flag === 'amb' && (!p.amb || p.ml)) return false;
  if (S.flag === 'ed'  && !p.ml) return false;
  if (!S.q) return true;
  var q = S.q.toLowerCase();
  return (p.t||'').toLowerCase().indexOf(q) >= 0
      || (p.b||'').toLowerCase().indexOf(q) >= 0
      || (p.a||'').toLowerCase().indexOf(q) >= 0
      || p.cm.some(function(c){ return (c.x||'').toLowerCase().indexOf(q) >= 0 });
}

function renderCats(){
  var counts = {}; posts.forEach(function(p){ var k=fin(p); counts[k]=(counts[k]||0)+1 });
  var amb = posts.filter(function(p){ return p.amb && !p.ml }).length;
  var ed  = posts.filter(function(p){ return !!p.ml }).length;
  var html = '<span class="cat' + (S.cat===''?' on':'') + '" data-cat="">전체<span class="n">'+posts.length+'</span></span>';
  cats.forEach(function(c){
    html += '<span class="cat'+(S.cat===c.key?' on':'')+'" data-cat="'+c.key+'" title="'+esc(c.desc)+'">'
          + esc(c.label)+'<span class="n">'+(counts[c.key]||0)+'</span></span>';
  });
  // 검토가 필요한 상태도 같은 줄에서 고른다 (별도 '보기' 줄을 두지 않는다)
  if (amb) html += '<span class="cat flag'+(S.flag==='amb'?' on':'')+'" data-flag="amb" title="자동분류가 애매해 확인이 필요해요">애매<span class="n">'+amb+'</span></span>';
  if (ed)  html += '<span class="cat flag'+(S.flag==='ed'?' on':'')+'" data-flag="ed" title="내가 직접 분류를 바꾼 글이에요">수정<span class="n">'+ed+'</span></span>';
  document.getElementById('cats').innerHTML = html;
  if (typeof updCats === 'function') requestAnimationFrame(updCats);
}

function picker(p){
  var cur = fin(p);
  var o = cats.map(function(c){
    return '<option value="'+c.key+'"'+(c.key===cur?' selected':'')+'>'+esc(c.label)+'</option>';
  }).join('');
  return '<select class="pick" data-no="'+p.no+'" title="'+(p.ml?'수동 지정됨':'자동 분류 · 점수 '+p.cs)+'">'+o+'</select>';
}

function card(p){
  var cm = p.cm.map(function(c){
    return '<div class="cmt'+(c.dp?' re':'')+'"><span class="n">'+esc(c.n)+'</span>'+hl(c.x,S.q)+'</div>'; }).join('');
  var cls = 'card' + (p.ml ? ' edited' : (p.amb ? ' amb' : '')) + (SEL.has(p.no) ? ' picked' : '');
  return '<article class="'+cls+'">'
    // 1행 — 제목이 주역, 원문 링크는 오른쪽 끝
    + '<div class="row r1">'
      + '<input type="checkbox" class="sel" data-no="'+p.no+'"'+(SEL.has(p.no)?' checked':'')+'>'
      + (p.bk ? '<span class="inlib" title="서재에 담긴 글이에요">★</span>' : '')
      + '<span class="ttl" title="'+esc(p.t)+'">'+hl(p.t,S.q)+'</span>'
      + '<a class="go" href="'+esc(p.u)+'" target="_blank" rel="noopener" title="디시 원문으로 이동해요">원문 ↗</a>'
    + '</div>'
    // 2행 — 분류 / 말머리 / 일시 / 지표
    + '<div class="row r2">'
      + picker(p)
      + (p.h ? '<span class="chip">'+esc(p.h)+'</span>' : '')
      + '<span class="metrics date" title="작성 시각">'+fmtD(p.d)+'</span>'
      + '<span class="metrics nums">'
        + '<span class="m-rec">추천 <b>'+(p.rc||0)+'</b></span>'
        + '<span class="m-view"> · 조회 '+(p.v||0)+'</span>'
        + '<span class="m-cmt"> · 댓글 '+(p.cc||0)+'</span>'
      + '</span>'
    + '</div>'
    + '<div class="body">'
      + (p.b ? '<div class="txt">'+hl(p.b,S.q)+'</div>'
             : '<div class="metrics">본문은 아직 수집하지 않았어요. 원문 링크로 확인해 주세요.</div>')
      + (p.img.length ? '<div class="imgs">'+p.img.map(function(s){return '<img loading="lazy" src="'+esc(s)+'" alt="">'}).join('')+'</div>' : '')
      + (cm ? '<div class="cmts">'+cm+'</div>' : '')
    + '</div></article>';
}

function render(){
  var rows = posts.filter(match).sort(function(a,b){
    return S.sort==='d' ? String(b.d).localeCompare(String(a.d))
         : S.sort==='seen' ? String(b.seen).localeCompare(String(a.seen))
         : (b[S.sort]||0)-(a[S.sort]||0); });
  visible = rows.map(function(r){ return r.no });
  document.getElementById('cnt').textContent = rows.length + '건';
  document.getElementById('list').innerHTML = rows.length
    ? rows.map(card).join('') : '<div class="empty">조건에 맞는 글이 없습니다.</div>';
  syncSel();
}

/* 분류 탭: 한 줄 유지 + 좌우 스크롤 */
function wireScroll(wrapId, railId, prevId, nextId){
  var wrap = document.getElementById(wrapId), rail = document.getElementById(railId);
  var prev = document.getElementById(prevId), next = document.getElementById(nextId);
  if (!wrap || !rail) return function(){};
  function upd(){
    var over = rail.scrollWidth - rail.clientWidth;
    var can = over > 4;
    prev.classList.toggle('show', can); next.classList.toggle('show', can);
    wrap.classList.toggle('l', can && rail.scrollLeft > 2);
    wrap.classList.toggle('r', can && rail.scrollLeft < over - 2);
  }
  rail.addEventListener('scroll', upd);
  window.addEventListener('resize', upd);
  prev.addEventListener('click', function(){ rail.scrollBy({left:-rail.clientWidth*0.7, behavior:'smooth'}) });
  next.addEventListener('click', function(){ rail.scrollBy({left: rail.clientWidth*0.7, behavior:'smooth'}) });
  // 세로 휠을 가로 스크롤로
  rail.addEventListener('wheel', function(e){
    if (Math.abs(e.deltaY) <= Math.abs(e.deltaX)) return;
    if (rail.scrollWidth <= rail.clientWidth) return;
    e.preventDefault(); rail.scrollLeft += e.deltaY;
  }, {passive:false});
  return upd;
}
var updCats = wireScroll('catWrap','cats','catPrev','catNext');

document.getElementById('cats').addEventListener('click', function(e){
  var c = e.target.closest('.cat'); if(!c) return;
  if (c.dataset.flag !== undefined) { S.flag = (S.flag === c.dataset.flag) ? '' : c.dataset.flag; }
  else { S.cat = (S.cat === c.dataset.cat) ? '' : c.dataset.cat; }
  renderCats(); render();
});
document.getElementById('list').addEventListener('click', function(e){
  var t = e.target.closest('.ttl'); if (t) t.closest('.card').classList.toggle('open');
});
document.getElementById('list').addEventListener('change', function(e){

});
var deb = function(f,ms){ var h; return function(){ var a=arguments; clearTimeout(h);
  h=setTimeout(function(){f.apply(null,a)},ms); }; };

document.getElementById('sort').addEventListener('change', function(e){ S.sort=e.target.value; render() });

document.addEventListener('keydown', function(e){

/* 좁은 화면에서 검색·필터 영역 접기 — GNB 는 항상 보인다 */
(function(){
  var btn = document.getElementById('toolsBtn'), hdr = document.querySelector('.hdr');
  if (!btn || !hdr) return;
  btn.addEventListener('click', function(){
    var open = hdr.classList.toggle('open');
    btn.title = open ? '검색·필터 접기' : '검색·필터 펼치기';
    btn.setAttribute('aria-expanded', open ? 'true' : 'false');
  });
})();
