\n• 남편한테 채팅하는 거 걸림...\n• 다들 애인한테 채팅하는 거 말해?\n• 요즘 채팅하는 캐릭터 우리 아들 닮았다\n• 곧 개강해서 슬픔...\n\n반면 오늘 무엇을 먹었는지, 잠을 못 잤다는 이야기 등 별도의 신상이나 생활 배경을 드러내지 않는 가벼운 일상 이야기는 그 자체만으로 셀털에 해당하지 않습니다\n구체적인 지역명을 밝히지 않는 단순한 날씨 이야기 역시 셀털로 판단하지 않습니다\n\n다만 개별적으로는 문제가 없는 내용이라도 현실 정보를 반복적으로 언급하여 특정 이용자의 신상이 누적되거나, 다른 이용자가 해당 이용자의 현실 정보를 지속적으로 인지할 수 있는 수준이 되는 경우에는 셀털로 판단할 수 있습니다\n\n4. 자아 표출(자표) 금지\n갤러리 내 활동 이력이나 반복적인 정보 노출을 통해 자신이 특정 이용자임을 드러내거나 유추하도록 하는 행위를 금지합니다\n\n예시\n• 자신의 과거 게시글 또는 댓글을 언급하여 자신을 특정시키는 행위\n• 이전 활동이나 갤러리 내에서 있었던 자신의 일을 반복적으로 언급하는 행위\n• 본인만의 특징적인 정보를 반복적으로 노출하여 이용자들이 자신을 알아볼 수 있도록 하는 행위\n\n제작자임을 밝히는 행위에 대해서는 아래 제작자 관련 규정 및 「탭 이용 가이드」를 함께 적용합니다\n\n5. 친목 및 친목성 분위기 조성 금지\n특정 이용자끼리 서로를 지속적으로 알아보거나 아는 척하는 행위, 특정 이용자를 반복적으로 호출하거나 개인적인 관계를 형성하는 등 친목성 분위기를 조성하는 행위를 금지합니다\n\n직접적인 친분 관계가 존재하지 않더라도 갤러리 내에서 특정 이용자들이 서로를 지속적으로 식별하고 관계를 형성하는 경우에는 친목성 행위로 판단할 수 있습니다\n\n특정 캐릭터를 아는 이용자끼리만 이해할 수 있는 내부 호칭을 반복적으로 사용하거나, 모든 이용자가 해당 캐릭터를 알고 있다는 전제로 대화를 이어가는 등 특정 캐릭터를 매개로 친목성 분위기를 형성하는 경우에도 제재할 수 있습니다\n\n6. 닉네임 사용 관련\n갤러리 내 닉네임은 ‘ㅇㅇ’로 통일합니다\n\n고정닉, 반고정닉, 유동닉 모두 동일하게 적용하며 공식 플랫폼 계정 등 별도로 허용된 계정은 예외로 합니다\n\n닉네임 규정 위반의 경우 최초에는 변경 안내를 우선하며, 안내 이후에도 변경 없이 이용하는 경우 제재할 수 있습니다\n\n7. 제작자 언급 관련\n특정 제작자 개인에 대한 직접적인 언급은 방식과 관계없이 금지합니다\n\n칭찬, 찬양, 근황 언급 등 긍정적인 내용도 포함됩니다\n\n제작자의 이름을 직접 언급하지 않더라도 특정 제작자 개인이 게시글의 중심이 되거나, 근황·신규 캐릭터·플랫폼 이동·이벤트 등의 정보를 통해 특정 제작자를 유추할 수 있는 경우에도 동일하게 적용합니다\n\n‘나작제’, ‘나큰제’ 등 특정 제작자를 지칭하는 표현 역시 금지합니다\n\n예시\n• ○○○ 공지 봤어?\n• ○○○ 신규 캐릭터 예고 떴다\n• ○○○ 이벤트 한대\n• 내가 좋아하는 제작자 ○○ 플랫폼으로 온대\n• 나작제 이번에 신캐 나온대\n\n특정 개인이 아닌 제작자 전반을 대상으로 하는 일반적인 이야기나 질문은 허용합니다\n\n본인이 제작자임을 전제로 제작 관련 잡담이나 제작 과정에 관한 내용을 작성하는 경우에는 제작탭을 이용해야 합니다\n\n제작 관련 질문은 질문탭에서도 작성할 수 있습니다\n\n본인이 특정 캐릭터의 제작자임을 직접 밝히는 것은 홍보탭과 그림탭에서만 허용하며, 세부적인 제작자 표출 범위는 「탭 이용 가이드」를 참고하시면 됩니다\n\n본인의 캐릭터를 타인의 캐릭터인 것처럼 리뷰하면서 ‘내캐내먹’을 표기하지 않는 경우에는 셀프 바이럴로 판단하여 제재합니다\n\n7-1. 제작자 논란 관련 언급\n본 항목은 제보탭 운영과 별개의 내용입니다\n\n제작자 언급 금지 규정으로 인해 갤러리 내부에서 논의할 필요가 있는 사안까지 모두 언급할 수 없게 되는 상황을 방지하기 위한 절차입니다\n\n제작자 관련 논란을 이야기하려는 경우 일반 게시글을 바로 작성하지 말고 먼저 신문고를 통해 게시 가능 여부를 확인해야 합니다\n\n게시가 허용된 경우 이슈탭을 통해 작성할 수 있습니다\n\n신문고 절차를 거치지 않고 작성된 게시글은 내용이나 댓글 반응과 관계없이 우선 삭제합니다\n\n이는 완장진이 논란의 진위나 사실관계를 판단하기 위한 절차가 아니라, 해당 사안이 갤러리에서 다룰 수 있는 주제인지 여부와 아래 기준에 위배되지 않는지를 확인하기 위한 절차입니다\n\n따라서 게시가 허용되었다고 해서 해당 내용이 사실이라는 의미가 아니며, 완장진이 내용의 진위나 사실관계를 확인하거나 보증하는 것도 아닙니다\n\n최초 게시글 이후 새로운 정보 없이 작성되는 파생글은 금지하며 관련 논의는 해당 이슈탭 게시글의 댓글에서 이어가야 합니다\n\n아래 사유에 해당하는 경우 게시를 허용하지 않습니다\n• 근거 없이 심증만 존재하는 경우\n• 단순한 추측이나 의심\n• 개인 간 분쟁 및 감정싸움, 뒷담화\n• AI 캐릭터 간 유사성 및 표절\n\n이용자 사이에서 해당 사안에 대한 의견 차이가 존재하는 것 자체는 제재하지 않습니다\n\n제보탭 등재는 본 항목과 별도의 절차를 통해 진행합니다\n\n8. 언급 금지 대상 관련\n별도 공지를 통해 언급 금지 대상으로 지정된 제작자의 캐릭터 및 해당 대상으로 명시된 콘텐츠에 대한 언급은 금지합니다\n\n언급 금지 대상에 해당하는 캐릭터를 직접적으로 언급하거나, 이름을 밝히지 않더라도 해당 캐릭터임을 특정할 수 있는 방식으로 게시글 또는 댓글에서 언급하는 경우 제재할 수 있습니다\n\n언급 금지는 별도 공지에 명시된 대상에 한하여 적용합니다\n\n그 외 캐릭터에 대한 일반적인 언급이나 게시글 작성은 제한하지 않습니다\n\n캐릭터명 표기, 특정 세계관 및 시리즈 관련 글 작성 방식 등 일반적인 캐릭터 언급에 관한 자세한 사항은 「탭 이용 가이드」를 확인해 주시기 바랍니다\n\n9. 일부 콘텐츠 말머리 표기\n혐오감이나 불쾌감을 줄 수 있는 소재가 포함된 게시글은 제목 앞에 해당 내용을 알 수 있는 말머리를 의무적으로 표기해야 합니다\n근친, 짭근, 폭행, 스캇, 고어 등이 이에 해당합니다\n\n예시\n• 짭근) 제목\n• [고어] 제목\n• ㄱㅋㅅ 제목\n• 글카스/제목\n\n제목 자체에 해당 내용이 직접적으로 노출되어 다른 이용자가 피하기 어렵다고 판단되는 경우에는 게시글이 삭제될 수 있습니다\n\n10. 외부 SNS 및 커뮤니티 관련\n외부 SNS 및 커뮤니티에서 발생한 분쟁이나 이용자 간 갈등을 갤러리 내부로 가져오는 행위를 금지합니다\n\n제작자가 외부 SNS나 커뮤니티에서 작성한 글을 가져오는 행위 역시 금지합니다\n\n정보 제공을 목적으로 타 커뮤니티에서 작성된 정보성 게시물을 가져오는 경우에는 원문 작성자의 허락을 받은 경우에 한하여 출처와 링크를 함께 표기할 수 있습니다\n\n단, X(트위터) 및 아카라이브 게시물은 정보성 내용이라 하더라도 갤러리 내부로 가져오는 것을 금지합니다\n\n11. 규정 우회 금지\n규정에서 금지하는 행위를 단어, 표현, 이미지, 디시콘, 초성, 별명 등 형식만 변경하여 사실상 동일한 방식으로 우회하는 행위는 금지합니다\n\n명시된 표현이나 사례와 정확히 일치하지 않더라도 규정의 금지 대상을 의도적으로 우회한 것으로 판단되는 경우 동일한 규정을 적용할 수 있습니다\n\n12. 갤러리 내부 분쟁 관련\n갤러리 이용자 사이의 의견 차이나 비판, 반론 자체는 제재하지 않습니다\n\n특정 플랫폼, 캐릭터, 서비스 또는 제작 활동 등에 대한 비판 역시 규정을 위반하지 않는 범위에서는 자유롭게 작성할 수 있습니다\n\n다만 의견에 반박하는 것을 넘어 특정 이용자를 대상으로 일방적인 욕설이나 인신공격, 비꼬기 및 시비성 발언을 하는 행위는 제재할 수 있습니다\n\n반복적으로 싸움을 유도하거나 정상적인 의견 교환을 방해하는 행위 역시 동일하게 적용합니다\n\n외부 SNS나 커뮤니티에서 발생한 이용자 간 분쟁을 갤러리 내부로 가져와 이어가는 행위는 금지하며, 이에 대해서는 외부 SNS 및 커뮤니티 관련 규정인 10번 항목을 적용합니다\n\n13. 비판 및 소비 관련 운영 방향\n플랫폼이나 제작물 inside.com/mgallery/board/view/?id=aichatting&no=371135&exception_mode=recommend&page=5","d":"2026-08-14T19:43:26+09:00","v":1014,"rc":25,"cc":4,"src":["search:search_subject_memo:프롬프트","search:search_subject_memo:태그","recommend"],"seen":"2026-08-28T06:24:13.005Z","c":"etc","cs":2,"amb":0,"alt":[],"why":[],"ml":null,"b":"안녕하세요, 1분만 관심가져주세요!\n깊은 몰입 & 쉬운 제작을 지향하는 플랫폼 [에피] 인사드립니다.\n\n에피는 어떤 서비스인가요?\n\n☛ 정량제 플랫폼\n\n☛ 무제한 무료 모델 있음\n\n☛ 상황에 따라 자동으로 바뀌는 이미지\n\n☛ 유저노트 2000자\n\n♥ 유료 칩 사용 기한 2년\n\n♥ 채팅 내역 전체 삭제 & 영구 탈퇴 가능!\n\n♥ 매일매일 개선되는 서비스 (밤낮없이 일하겠습니다!)\n\n그럼 바로 서비스 화면을 보면서 [에피]의 특징 설명드릴게요!\n\n[플레이] 뷰어\n\n소설식 뷰어를 제공합니다.\n\n뒷편에 보이는 이미지는 배경 & 캐릭터 이미지의 조합인데요.\n장소와 캐릭터의 감정에 따라서 자동으로 알맞게 변경됩니다.\n\n연출 방식, 뷰어 설정 등 기본적인 커스텀 기능이 탑재되어있습니다.\n\n[플레이] 플레이 노트\n\n‘플레이 노트’ 라는 이름으로 유저노트를 제공해요.\n최대 2000자까지 쓸 수 있습니다!\n\n[플레이] 무료 모델\n\n가벼운 모델은 횟수 제한 없이, 무료로 제공중이에요.\n편하게 즐겨주세요!\n\n[플레이] 추천 캐릭터\n\n북부대공님은 아기고양이 - 카일\n\n밤마다 무서운 늑대로 변한다는 소문의 북부대공, 카일.\n그에게 시집온 유저는 첫날 밤 그의 정체를 알게되는데요…\n사실, 소문의 늑대는 깜장 아기고양이였답니다.\n\n서큐버스가 남자인건 안되나요? - 리안\n\n여자 꼬시는데 도가 튼 악마, 리안입니다.\n남자까지 정복해보겠다는 포부를 갖고 서큐버스가 되었는데요…\n남자를 유혹하는 건 처음이라 뚝딱거리는게 귀엽습니다.\n\n유저캐 성별을 여자로 해도, 남자로 해도 맛있습니다 bb\n\n꼬맹아, 저리 가 - 도민성\n\n조직 해원의 보스, 도민성.\n어렸을때부터 함께 지내 유저는 그를 ‘삼촌’이라고 불러왔는데,\n성인이 된 지금까지도 도민성은 유저를 꼬맹이로 취급합니다.\n단호한 아저씨 꼬시기… 가능할까요?\n\n아직 부족한 점이 많지만… 하루가 다르게 달라지는 모습을 보여드리겠습니다!!\n이어서 제작 방식 소개드릴게요.\n\n[제작 방식] mixer VS studio\n\n에피에서는 두가지 제작 방식을 제공합니다.\nmixer : 마음에 드는 태그를 선택하면 자동으로 에피소드가 뚝딱 만들어져요.\nstudio : 처음부터 직접 만드는 방법이에요.\n\n아래에서 각각 설명드릴게요.\n\n[mixer] 간편하게 제작하기\n\n세계관, 캐릭터 특징, 성격 등 마음에 드는 태그를 선택하면 에피소드가 만들어집니다.\n\n만들어진 에피소드는 studio에서 편집도 가능하니,\n초안을 만들거나 새로운 아이디어가 필요할 때 써주세요!\n\n[studio] 전문적으로 제작하기\n\n캐릭터\n한 에피소드에 캐릭터를 최소 1명, 최대 10명까지 만들 수 있습니다. 캐릭터 프롬프트는 최대 1만자예요.\n\n이미지\n상황별 감정 이미지를 넣으면 AI가 적절한 타이밍에 적절한 이미지를 보여줍니다.\n\n배경\n배경 이미지를 넣으면, 캐릭터 이미지와 동일하게 AI가 알아서 적절한 상황에 적절한 배경 이미지를 보여줍니다.\n\n세계관\n세계관은 최대 4천자까지 제공해요.\n\n상태\n애정도, 혐오도 같은 캐릭터의 상태나\n직위, 재물 현황같은 플레이어의 상태를 관리할 수 있어요.\n\n사건\n“나는 진짜 개쩌는 세계관을 유저들한테 맛보여주고싶다”\n“이런 반전을 이런 시점에 알려주고싶다”\n→ 이런 경우에는 사건을 써주세요!\n\n등장 캐릭터, 발생 조건등을 세부적으로 조정할 수 있어요.\n\n마지막으로,\n카카오톡 오픈채팅방을 만들었습니다…!!\n종종 무료 칩 충전 쿠폰코드를 발급해드릴 예정이니, 많이 들러주세요.\n(이따 9시에 예정되어있답니다)\n모든 피드백을 달게 받겠습니다!\n\n긴 글 읽어주셔서 감사합니다.\n\n오늘도 행복한 앵챗 되세요!!!","img":["https://dcimg4.dcinside.co.kr/viewimage.php?id=2cb4d32ee4c62caf60b8&no=24b0d769e1d32ca73fe785fa1bd6253181cc839ddd597aa6642ca0749f11fccf40e1cca74f1d21241c935c226c5378ac6126f8091d7391f5112af00176d8f6a58ec680eaa8fb","https://dcimg4.dcinside.co.kr/viewimage.php?id=2cb4d32ee4c62caf60b8&no=24b0d769e1d32ca73fe785fa1bd6253181cc839ddd597aa6642ca0749f11fccf40e1cca74f1d21241c935c226c5378ac6f23f10e1c7499fd102aa75621ddf0a701c4048bcb77"],"bk":0,"gt":["앵챗","캐","유저노트","플폼","프롬프트","정량제"],"cm":[{"x":"오 정량제다","dp":0},{"x":"제타에서 갈아타면 좋겠네","dp":0},{"x":"오... 꽤괜","dp":0}]},{"no":371112,"t":"플랫폼 언급 및 외부 홍보성 게시글 관련 안내","h":"🔔공지","u":"https://gall.dcinside.com/mgallery/board/view/?id=aichatting&no=371112&exception_mode=recommend&page=5","d":"2026-08-14T19:00:23+09:00","v":683,"rc":35,"cc":0,"src":["recommend"],"seen":"2026-09-02T09:37:44.429Z","c":"promo","cs":4,"amb":0,"alt":[],"why":["titleStrong:홍보"],"ml":null,"b":"https://m.dcinside.com/board/aichatting/370670\n\n여성향 내려치는 플폼은 공지로 출입금지 박아주면 좋겠다  - AI 채팅 마이너 갤러리\n새벽에 바이럴 왔던 ㄴㅋ얘기 맞음 공익을 위한 공유로 공식 디코 캡본 올리는 거 괜찮을지 모르겠다 혹시 안되면 완장들이 말해주셈 수정하겠습니다 여성향을 통으로 내려치며 진상취급하고 개인 채팅내역을 까봤다고 말하는 공식\nm.dcinside.com\n\n위 글과 관련하여 완장진 내부에서 논의한 결과입니다\n\n결론적으로 해당 플랫폼 자체를 언급 금지 대상으로 지정하지 않습니다\n\n언급 금지는 갤러리 이용에 직접적인 영향을 주는 조치인 만큼, 이용자 의견을 충분히 참고하되 갤러리 내부에서 실제로 발생한 문제와 운영상 필요성을 함께 고려하여 결정합니다\n특정 플랫폼에 대한 여론만으로 언급 금지 여부를 결정하지는 않습니다\n\n단, 플랫폼에 대한 비판과 평가는 자유롭게 작성할 수 있습니다\n\n플랫폼은 이용자가 서비스를 선택하고 비용을 지불하여 이용하는 대상인 만큼, 긍정적인 평가뿐만 아니라 부정적인 평가와 비판 역시 자유롭게 작성할 수 있습니다\n\n특정 플랫폼을 비판했다는 이유만으로 해당 이용자를 공격하거나, 반대로 특정 플랫폼을 이용한다는 이유로 이용자를 공격하는 행위만 아니라면 플랫폼에 대한 의견 자체는 제한하지 않습니다\n\n외부 홍보성 게시글 관련\n(아래 기준은 곧 생길 공식탭 이용 기준에 적용될 예정입니다)\n\n공식 플랫폼 및 서비스의 홍보 자체는 공식탭을 통해서만 허용합니다\n\n다만 갤러리 이용자를 단순한 홍보, 모집 대상으로 취급하는 형태의 게시글은 제한합니다\n\n아래와 같은 게시글이 이에 해당합니다\n- 플랫폼 및 서비스 관계자가 일반 이용자인 것처럼 작성하는 바이 :928,"rc":25,"cc":1,"src":["search:search_subject_memo:html","recommend"],"seen":"2026-08-28T06:24:36.138Z","c":"widget","cs":5,"amb":1,"alt":["guide"],"why":["title:html","head:정보"],"ml":null,"b":"클로드 본가 결제해서 html 만져보다가 뭔 모델이 너무 많길래 고민하다가 서치한 거 긁어옴\n남들도 보고 나도 보고 쓰려고 백업 목적으로 업로드함\n내가 다 써보고 테스트 한 거 아니고 인터넷 돌아다니는 평가 짜집기임\n\n디자인 감각 기준 모델별 한눈에 보기\n모델명디자인 성향 (Design Aesthetic)레이아웃 및 컴포넌트 완성도타이포그래피 & 여백(Whitespace)\nOpus 4.6과감하고 실험적인 모던 스타일레이아웃 파격적이나 가끔 뼈대 붕괴웅장한 폰트, 여백 조절 미숙\nSonnet 4.6전형적인 정석적 SaaS/테크 스타일규격화된 UI, 컴포넌트 안정성 상깔끔하고 안전한 폰트 배합\nOpus 4.7정교하고 럭셔리한 하이엔드 저널 스타일복잡한 다단 그리드, 완벽한 반응형압도적인 그리드 조화, 세리프 최적화\nOpus 4.8브랜드 아이덴티티 극대화 스타일가이드라인에 맞춘 맞춤형 UI 구조일관된 톤앤매너, 규칙적인 레이아웃\nSonnet 5트렌디한 마이크로 인터랙션 중심 스타일화려한 컴포넌트, 모바일 퍼스트통통 튀는 컬러웨이, 감각적인 배치\nOpus 5완성형 하이디자이너 에스테틱예술적 3D/웹글(WebGL) 레이아웃 시스템완벽한 여백의 미(Luxury Spacer)\n모델별 구체적인 디자인 감각 및 에스테틱 차이\n1. Opus 4.6 vs Sonnet 4.6 (2026년 초): 과감한 실험 vs 안전한 정석\n\nOpus 4.6 (과감한 모던 웹 감성):\n헤드라인에 72px 이상의 거대하고 대담한 타이포그래피를 적극적으로 사용합니다.\n핀터레스트나 힙한 에이전시 웹사이트 같은 파격적인 레이아웃을 시도하지만, 간혹 CSS 마진(Margin) 계산이 어긋나 요소가 겹치는 투박함이 공존합니다.\n\nSonnet 4.6 (정석적인 깔끔한 UI):\n전형적인 '토스(Toss)'나 '스트라이프(Stripe)' 스타일의 깔끔한 테크 기업 UI를 가장 잘 만듭니다.\n모험을 하지 않기 때문에 레이아웃이 깨지지 않고 단정하지만, 예술적이거나 독창적인 느낌은 부족해 다소 지루할 수 있습니다.\n\n2. Opus 4.7: 저널리즘 미학과 정교한 그리드의 정점\n\nOpus 4.7 (하이엔드 매거진 감성):\n뉴욕타임스나 뉴욕현대미술관(MoMA) 웹사이트 같은 정교한 세리프(Serif) 타이포그래피와 미니멀한 면 분할에 눈을 뜬 모델입니다.\n비전(Vision) 능력이 크게 향상되면서 픽셀 단위의 시각적 균형을 맞추기 시작했습니다. 복잡한 다단 그리드 뷰, 비대칭 레이아웃을 매우 우아하게 표현하며, 여백을 넉넉하게 사용하여 '고급스러운 무드'를 내는 데 탁월합니다.\n\n3. Opus 4.8: 완벽한 브랜드 시스템의 이행\n\nOpus 4.8 (브랜드 가이드 엄격 준수):\n사용자가 지정한 브랜드 키트(로고, 고유 폰트, hex 컬러값)를 디자인에 녹여내는 능력이 가장 꼼꼼합니다.\n디자이너가 의도한 메인 컬러와 서브 컬러의 배합 비율(예: 60-30-10 법칙)을 정확히 지키며, 통일감 있는 컴포넌트(버튼, 카드, 입력창) 세트를 일관되게 배치하는 안정적인 미학을 보여줍니다.\n\n4. Sonnet 5: 트렌디한 감각과 움직이는 UI의 마술사\n\nSonnet 5 (트렌디 & 인터랙티브 에스테틱):\n현재 가장 힙한 프론트엔드 트렌드(예: 글래스모피즘, 네오브루탈리즘)를 기가 막히게 캐치합니다.\n특히 마이크로 인터랙션(Micro-interactions) 감각이 뛰어납니다. 버튼에 마우스를 올렸을 때(Hover)의 부드러운 CSS 트랜지션, 스크롤에 반응하는 컴포넌트의 움직임 등 '살아 움직이는 듯한 세련된 UI'를 뽑아내는 감각은 이전 세대 오푸스들을 능가합니다.\n\n5. Opus 5: 타협 없는 미학, 예술적 마스터피스\n\nOpus 5 (최상위 하이엔드 디자인):\n단순한 2D 평면 HTML 웹을 넘어, Three.js 스타일의 공간감이 느껴지는 레이아웃과 감각적인 애니메이션을 조화롭게 다룹니다.\n'여백의 미'와 '시각적 계층 구조(Visual Hierarchy)'의 정점을 보여줍니다. 사용자가 복잡한 텍스트를 던져도 중요한 정보는 대담하게 띄우고, 부가 정보는 아주 섬세하게 숨길 줄 아는 실제 수석 UI/UX 디자이너의 레이아웃 감각을 재현합니다. 결과물의 시각적 완성도와 때깔(Polish) 면에서 가장 압도적입니다.\n\n추천하는 디자인 워크플로우\n가성비를 보지 않는다면 기획과 전체적인 감성 무드는 Opus 4.7이나 5로 잡고, 세부적인 트렌디한 인터랙션과 컴포넌트 변형은 Sonnet 5로 다듬는 조합이 가장 훌륭한 HTML 결과물을 만들어냅니다.\n\n+ 색감에 대한 감각도 추가로 찾아봄\n\n색상 감각 기준 모델별 한눈에 보기\n모델명주요 색채 스타일 (Color Aesthetic)컬러 팔레트 구성 능력다크모드 / 시각적 대비 (Accessibility)\nOpus 4.6원색 중심의 과감하고 비비드한 톤보색 대비를 강하게 씀 (다소 튐)대비가 너무 강해 눈이 피로할 수 있음\nSonnet 4.6안정적인 기업형 쿨 그레이 & 블루실패 없는 안전한 테크 톤 (Safe)웹 접근성 가이드라인(WCAG) 표준 준수\nOpus 4.7톤다운된 고급스러운 뮤티드(Muted) 톤채도를 낮춘 파스텔 및 뉴트럴 조합부드럽고 우아한 명도 대비\nOpus 4.8브랜드 맞춤형 시그니처 톤 세밀화메인-서브-포인트 컬러의 완벽한 6:3:1 배분다크모드 전환 시 색상 왜곡 최소화\nSonnet 5트렌디한 네온, 그라데이션, 글래스모피즘화려한 RGB 그라데이션 다채롭게 활용시각적 자극이 강하나 매우 세련됨\nOpus 5빛과 그림자를 이해하는 입체적 톤3차원 공간감이 느껴지는 정교한 조색완벽한 야간 모드 및 미세한 그레이 스케일 조율\n모델별 구체적인 색상 표현력 및 감각 차이\n1. Opus 4.6 vs Sonnet 4.6: 과감한 원색 vs 보수적인 기업색\n\nOpus 4.6 (원색 위주의 대담함):\n넷플릭스나 스포티파이처럼 강렬한 블랙 바탕에 쨍한 네온 그린이나 레드를 포인트로 쓰는 감각이 좋습니다. 다만, 가끔 색상의 채도가 지나치게 높아 브라우저에서 볼 때 눈이 쉽게 피로해지는 단점이 있습니다.\n\nSonnet 4.6 (테크 기업의 정석, 블루 & 그레이):\n토스, 카카오, 핀테크 앱에서 흔히 볼 수 있는 '실패 없는 화이트-쿨그레이-신뢰감을 주는 블루' 조합을 가장 기계적으로 정확하게 짜냅니다. 모험을 하지 않는 대신, 누구나 편안하게 느끼는 UI 색상을 만듭니다.\n\n2. Opus 4.7: 채도를 뺀 고급 매거진의 ‘뮤티드(Muted) 톤’\n\nOpus 4.7 (자연스럽고 우아한 조색):\n킨포크(Kinfolk) 잡지나 하이엔드 건축, 향수 브랜드 웹사이트에 어울리는 색감에 특화되어 있습니다.\n원색을 거의 쓰지 않고 베이지, 톤다운된 카키, 바카라 레드, 차분한 네이비 등 채도를 낮춘 고급스러운 컬러 팔레트를 구성합니다. 배경색과 텍스트 색상 간의 명도 대비를 아주 부드럽게 세팅하여 스크롤을 내릴 때 편안한 무드를 연출합니다.\n\n3. Opus 4.8: 수학적이고 철저한 ‘컬러 시스템(Color System)’ 이행\n\nOpus 4.8 (디자인 가이드라인의 정석):\n색상을 감정적으로 쓰지 않고, 디자인 시스템 규칙에 맞춰 철저하게 계산합니다.\n메인 컬러 60%, 서브 컬러 30%, 액션 버튼(포인트) 컬러 10%의 '6:3:1 법칙'을 가장 완벽하게 구사합니다. 특히 라이트모드 코드를 다크모드로 자동 변환할 때, 단순 반전이 아니라 다크모드용 저채도 컬러를 새로 정의하는 섬세함을 보여줍니다.\n\n4. Sonnet 5: Z세대를 저냥한 힙한 ‘그라데이션 & 빛 표현’\n\nSonnet 5 (트렌디한 비주얼 쇼크):\n웹사이트에 접속하자마자 \"와, 트렌디하다\"라는 탄성이 나오는 색감을 씁니다.\n단순 단색이 아니라, CSS Linear/Radial Gradient(그라데이션)를 기막히게 조합합니다. 보라색에서 핑크로 이어지는 사이버펑크 스타일, 혹은 투명한 유리 느낌(Glassmorphism)을 내기 위한 미세한 흰색 반투명 보더(Border)와 배경 블러(Blur) 색상 처리에 천재적인 감각을 보여줍니다.\n\n5. Opus 5: 빛의 굴절과 깊이감을 다루는 ‘마스터 캘리브레이션’\n\nOpus 5 (시각 예술 수준의 조색):\n현존하는 모델 중 색상에 대한 '공간 감각'이 가장 뛰어납니다. 그림자(box-shadow)를 넣을 때 그냥 투명한 블랙(#000000)을 쓰는 게 아니라, 배경색의 톤을 흡수한 깊이 있는 그림자 색상을 계산해 냅니다.\n3D 웹 렌더링을 염두에 둔 모델답게, 빛이 비치는 방향에 따라 UI 요소들의 하이라이트 색상과 어두운 영역의 색상을 다르게 매칭하여 HTML 결과물이 마치 고급 시네마틱 3D 화면을 보는 듯한 매끄러운 톤앤매너를 완성합니다.\n\n디자인 컨셉별 모델 매칭 추천\n\n소비재, 패션, 하이엔드 럭셔리 브랜드, 에세이 사이트: 따뜻하고 감성적인 색감의 Opus 4.7 추천\n크립토, AI 툴, 힙한 스타트업, 포트폴리오: 화려한 그라데이션과 네온 컬러의 Sonnet 5 추천\n정밀한 대시보드, 엔터프라이즈 SaaS, 예술적 완성도의 웹: 완벽한 톤 조절과 빛 계산을 보여주는 Opus 5 추천","img":[],"bk":0,"gt":["오푸스","@opus"],"cm":[{"x":"와 매번 모델 바꾸면서 기준 못잡았는데 정보추!","dp":0}]},{"no":370625,"t":"국내 플폼은 광복절 기념 할인 해라","h":"💬잡담","u":"https://gall.dcinside.com/mgallery/board/view/?id=aichatting&no=370625&exception_mode=recommend&page=6","d":"2026-08-13T01:29:06+09:00","v":675,"rc":37,"cc":4,"src":["recommend"],"seen":"2026-09-02T09:37:44.429Z","c":"etc","cs":0,"amb":0,"alt":[],"why":[],"ml":null,"b":"아 아무튼 하라고","img":[],"bk":0,"gt":["플폼"],"cm":[{"x":"옳소","dp":0},{"x":"추천 15개에 고닉추 8개네 가슴이 웅장해진다","dp":0}]},{"no":370502,"t":"500자 이하는 자동환불 해줬으면 좋겠다","h":"💬잡담","u":"https://gall.dcinside.com/mgallery/board/view/?id=aichatting&no=370502&exception_mode=recommend&page=6","d":"2026-08-12T17:45:15+09:00","v":602,"rc":28,"cc":1,"src":["recommend"],"seen":"2026-09-02T09:37:44.429Z","c":"etc","cs":0,"amb":0,"alt":[],"why":[],"ml":null,"b":"귀찮아서 안한것만 합쳐도 1트럭은 날렸을듯","img":["https://dcimg5.dcinside.com/dccon.php?no=62b5df2be09d3ca567b1c5bc12d46b394aa3b1058c6e4d0ca41648b658ee2d7463d2d59e882da88172d94bf65fa8f8e57bafb6c4d5d32c599ca0bdb5f956e203d9bb7642532dea9e29ddadbebdcecfdc38a60409"],"bk":0,"gt":[],"cm":[{"x":"환불신청좀 팊마냥 바로바로하게해주면좋겟음 다신고하게","dp":0}]},{"no":370498,"t":"투표 결과 및 기타 안내","h":"🔔공지","u":"https://gall.dcinside.com/mgallery/board/view/?id=aichatting&no=370498&exception_mode=recommend&page=6","d":"2026-08-12T17:20:57+09:00","v":904,"rc":44,"cc":1,"src":["recommend"],"seen":"2026-09-02T09:37:44.429Z","c":"etc","cs":0,"amb":0,"alt":[],"why":[],"ml":null,"b":"닉네임 통일 및 유저 캐릭터 그림 관련 투표 결과를 안내드립니다\n\n투표 결과에 따라 아래와 같이 적용합니다\n\n1. 닉네임 통일\n투표 결과 닉네임을 통일하는 방향으로 결정되었습니다\n\n고정닉, 반고정닉, 유동닉 모두 닉네임을 ㅇㅇ로 통일하여 이용해 주시기 바랍니다\n단, 별도로 안내된 공식 플랫폼 계정 등은 예외로 합니다\n\n규정에 맞지 않는 닉네임을 사용하는 경우 우선 닉네임 변경을 안내하며, 안내 이후에도 변경하지 않고 계속 이용하는 경우 제재할 수 있습니다\n\n2. 유저 캐릭터 그림\n투표 결과 유저 캐릭터 그림은 금지하는 방향으로 결정되었습니다\n\n아래에 해당하는 그림은 모두 금지합니다\n- 윶캐 : 유저 캐릭터 단독\n- 윶윶 : 유저 캐릭터 - 유저 캐릭터\n- 윶정 : 유저 캐릭터 - 캐릭터\n\n투표 과정에서 리뷰글에 첨부되는 윶정은 리뷰 내용의 일부로 보고 허용했으면 한다는 의견이 다수 있었으며, 해당 의견 역시 충분히 합리적이라고 판단하고 있습니다\n\n다만 유저 캐릭터 그림 관련 기준이 정해진 지 얼마 되지 않았고, 이전부터 관련 규정을 두고 여러 차례 의견이 나왔던 만큼 현시점에서 바로 예외 규정을 두는 것은 혼란이 발생할 가능성이 있다고 판단했습니다\n특히 리뷰글이라는 형식만 갖추어 사실상 윶정 그림을 중심으로 게시하는 등 예외 규정을 우회할 수 있는 범위를 지금 단계에서 명확하게 구분하기 어렵다는 점도 고려했습니다\n따라서 현재는 리뷰글을 포함하여 윶캐, 윶윶, 윶정을 모두 금지합니다\n\n이후 갤러리 규정과 이용 분위기가 어느 정도 안정된 뒤에는 리뷰글에 한하여 리뷰 내용의 일부로 첨부되는 윶정을 허용하는 방향으로 기준을 조정할 예정입니다\n\nAI 생성 그림을 자유롭게 공유하려는 경우 연관 갤러리로 등록된 AI 그림 여성향 갤러리를 이용해 주시기 바랍니다\n\n----------\n\n의견을 확인하고 정리하는 과정에 시간이걸려 안내가 늦어진 점 죄송합니다\n\n갤러리 규정 초안과 탭 이용 가이드 초안도 함께 올려놓았습니다\n아직 최종본이 아닌 만큼 기준이 모호하거나 실제 이용에 불편할 것으로 보이는 부분, 추가 또는 수정이 필요하다고 생각되는 내용이 있다면 해당 게시글 댓글 또는 건의탭을 통해 자유롭게 의견 남겨주시기 바랍니다\n\n갤러리의 분위기는 규정만으로 정해지는 것이 아니며, 실제 갤러리 이용자들이 어떤 방식으로 글을 작성하고 서로 소통하는지가 더 중요하다고 생각합니다\n모든 상황을 규정으로 세세하게 정하는 데에는 한계가 있고, 규정이 지나치게 많아질수록 오히려 자유로운 이용이 어려워질 수 있습니다\n\n이번 규정 및 탭 이용 가이드 정리는 갤러리 이용에 필요한 최소한의 기준을 명확하게 정하기 위한 것입니다\n규정에 없는 모든 행동을 추가로 제한하기보다는, 갤러리 이용자들이 서로 적당한 선을 지키면서 편하게 글을 작성하고 다양한 이야기를 할 수 있는 분위기가 형성되었으면 합니다\n\n초안에 대한 의견은 최종본 작성 전까지 계속 확인하겠습니다\n감사합니다","img":[],"bk":0,"gt":["캐"],"cm":[]},{"no":370497,"t":"탭 이용 가이드 초안","h":"🔔공지","u":"https://gall.dcinside.com/mgallery/board/view/?id=aichatting&no=370497&exception_mode=recommend&page=5","d":"2026-08-12T17:02:23+09:00","v":1136,"rc":46,"cc":3,"src":["search:search_subject_memo:프롬프트","recommend"],"seen":"2026-08-28T06:24:13.005Z","c":"etc","cs":1,"amb":0,"alt":[],"why":[],"ml":null,"b":"현재 말머리는 아래와 같이 변경됩니다\n\n기존\n잡담 / 홍보 / 제작 / 질문 / 정보 / OOC / 위젯 / 페소 / 리뷰 / 프롬 / 그림 / 대회 / 건의 / 이슈 / 공지\n\n변경 후\n잡담 / 홍보 / 공식 / 제작 / 질문 / 정보 / 콘텐츠 / 리뷰 / 그림 / 대회 / 임시 / 이슈 / 건의 / 공지 / 제보\n\n주요 변경 사항은 아래와 같습니다\n\n- 기존 홍보탭을 홍보탭과 공식탭으로 분리\n- OOC, 위젯, 페소탭을 콘텐츠탭으로 통합\n- 프롬탭과 그림탭을 그림탭으로 통합\n- 임시탭 신설\n- 기존에 박제탭으로 논의되었던 제보탭 신설\n\n탭을 잘못 선택한 경우 단순 실수로 판단되는 경우에는 삭제나 제재보다 말머리 이동을 우선합니다\n\n1. 잡담탭\nAI 채팅과 관련된 일반적인 이야기와 뻘글을 자유롭게 작성하는 탭입니다\n\n별도의 신상정보나 생활 배경이 드러나지 않는 가벼운 일상 이야기도 작성할 수 있습니다\n다만 셀털, 자표, 친목 등 갤러리 규정에서 금지하는 내용은 동일하게 적용됩니다\n\n특정 캐릭터가 글의 중심이 되는 경우 제목에 캐릭터명을 적는 것은 권장사항이며, 제목·본문·첨부 이미지 중 최소 한 곳에서는 어떤 캐릭터에 관한 글인지 알 수 있어야 합니다\n\n또한 특정 캐릭터의 신규 공개, 에셋 변경, 업데이트 등을 실시간으로 알리는 형태의 게시글은 제작자를 직접 언급하지 않더라도 가급적 자제해 주시기 바랍니다\n해당 내용은 특성상 특정 제작자의 활동이나 근황에 대한 언급으로 이어지기 쉬우며, 갤러리가 특정 제작자 또는 캐릭터의 활동을 실시간으로 공유하는 공간이 되는 것을 방지하기 위함입니다\n\n특정 세계관 및 시리즈 자체를 주제로 하는 글\n특정 세계관이나 시리즈 자체를 주제로 이야기하는 경우에는 제목에 해당 세계관명 또는 시리즈명을 반드시 표기해야 합니다\n\n이는 해당 시리즈에 속한 특정 캐릭터를 이야기하는 경우가 아니라, 세계관이나 시리즈 자체를 전제로 추천을 요청하거나 설정, 플레이 방식 등에 대해 이야기하는 경우를 의미합니다\n\n예시(세계관 명을 ‘고구마농장’으로 가정) :\n- [고구마농장] 캐릭터 추천 좀\n- 고구마농장 무슨 설정으로 플레이해?\n- 고구마농장 세계관 설정 질문 있음\n\n특정 세계관명이나 시리즈명은 게시글을 처음 보는 이용자도 무엇을 의미하는지 명확하게 알 수 있도록 작성해야 합니다\n초성이나 작성자 임의의 축약어만을 사용하는 것은 허용하지 않습니다\n\n예시 :\n- 고구마농장 → 허용\n- ㄱㄱㅁㄴㅈ → 금지\n- 고농 → 금지\n\n다만 명칭이 6글자 이상으로 길고, 해당 세계관이나 시리즈를 지칭하는 용도로 다수의 이용자가 일반적으로 사용하는 축약어가 있는 경우에는 해당 축약어를 사용할 수 있습니다\n\n예시(세계관 명을 ‘고구마종합관리본부’로 가정) :\n- 고구마종합관리본부 → 허용\n- 고구마 → 다수가 해당 시리즈를 지칭하는 명칭으로 사용하는 경우 허용\n- ㄱㄱㅁㅈㅎㄱㄹㅂㅂ → 금지\n- 고종관 → 일부 이용자만 사용하는 임의의 축약어인 경우 금지\n\n이 규정은 특정 세계관이나 시리즈 자체가 글의 주제가 되는 경우에만 적용하며, 해당 세계관에 속한 개별 캐릭터를 중심으로 작성하는 글의 경우 표기 방식은 다른 캐릭터들과 동일합니다\n\n해당 표기 기준은 잡담탭뿐 아니라 특정 세계관 또는 시리즈 자체만을 주제로 작성하는 모든 게시글에 동일하게 적용됩니다\n\n2. 홍보탭\n제작자가 본인이 제작한 캐릭터를 직접 홍보하는 게시글을 작성하는 탭입니다\n\n홍보탭에서는 본인이 해당 캐릭터의 제작자임을 밝히는 것을 허용합니다\n다만 댓글에서 해당 제작자에게 아는 척하거나 과거 활동을 언급하는 행위, 캐릭터가 아닌 제작자 개인을 대상으로 칭찬·찬양하는 행위는 금지합니다\n\n예시 :\n- 저번 캐릭터도 좋았는데 이번에도 좋네요\n- 지난번 캐릭터랑 분위기가 달라서 좋다!\n- 와... 너무 고능하시다...\n\n홍보탭은 제작자가 자신의 캐릭터를 소개하고, 이용자가 해당 캐릭터에 관해 이야기하는 공간입니다\n제작자 개인을 중심으로 소통하는 용도로는 이용할 수 없습니다\n\n3. 공식탭\nAI 채팅 플랫폼의 공식 계정이 공지, 업데이트, 홍보, 이벤트 등의 내용을 작성하는 탭입니다\n\n4. 제작탭\n캐릭터 제작과 관련된 전반적인 이야기를 작성하는 탭입니다\n\n제작 고민, 프롬프트 질문, 설정 구성, 제작 과정 공유 등 본인이 제작자임을 전제로 하는 내용은 제작탭을 이용해야 합니다\n본인이 제작자라는 사실 자체를 밝히는 것은 가능하지만, 자신이 특정 캐릭터의 제작자임을 먼저 밝히거나 기존 활동 및 캐릭터 등을 통해 특정 제작자로 유추될 수 있는 내용은 금지합니다\n본인이 특정 캐릭터의 제작자임을 밝히는 것은 그림탭과 홍보탭에서만 허용합니다\n\n제작탭에서 다른 이용자가 제작 중인 캐릭터가 무엇인지 질문하고 이에 답변하는 행위 자체는 금지하지 않습니다\n다만 제작탭은 특정 제작자나 캐릭터를 찾아내기 위한 공간이 아니므로, 이러한 질문과 답변이 반복되어 제작자 특정이나 친목성 분위기로 이어지는 행위는 자제해 주시기 바랍니다\n\n5. 질문탭\nAI 채팅과 관련된 질문이 필요한 경우 사용하는 탭입니다\n\n답변을 받은 직후 게시글을 삭제하는 이른바 ‘글삭튀’는 금지합니다\n답변을 받은 시점부터 하루 이내에 게시글을 삭제하는 경우 글삭튀로 판단합니다\n게시글을 주기적으로 정리하는 이용자가 있을 수 있다는 점을 고려하여 하루의 기간을 두며, 이후 게시글을 삭제하는 것 자체는 제한하지 않습니다\n\n글삭튀 적발 시 차단될 수 있습니다\n\n유동 이용자의 질문탭 사용 자체를 제한하지는 않습니다\n다만 유동 이용자의 반복적인 글삭튀가 계속되는 경우 유동의 질문탭 이용을 제한할 수 있습니다\n\n6. 정보탭\nAI 채팅과 관련된 정보성 게시글을 작성하는 탭입니다\n\n특정 플랫폼에만 해당되는 정보인 경우 제목에 플랫폼명을 반드시 표기해야 합니다\n이 갤러리는 특정 플랫폼 전용 갤러리가 아닌 AI 채팅 전반을 다루는 갤러리이므로, 정보탭에서는 어떤 플랫폼에 해당하는 정보인지 쉽게 구분할 수 있도록 해야합니다\n\n여러 플랫폼에 공통으로 적용되는 내용이거나 작성자가 다른 플랫폼에서도 적용되는지 확인하기 어려운 경우에는 제목 표기를 의무화하지 않습니다\n이 경우 본문에 본인이 사용한 플랫폼을 기재하는 것을 권장합니다\n\n타 커뮤니티에서 작성된 정보성 게시물을 가져오는 경우에는 원문 작성자의 허락을 받은 경우에 한하여 출처와 링크를 함께 표기할 수 있습니다\n단, X(트위터) 및 아카라이브 게시물은 정보성 내용이라 하더라도 가져오는 것을 금지합니다\n\n7. 콘텐츠탭\n채팅 경험을 보조하거나 확장하는 각종 콘텐츠를 공유하는 탭입니다\n\n기존 OOC, 위젯, 페소탭을 하나로 통합하여 운영합니다\nOOC, 위젯, 페르소나 등 관련 콘텐츠를 자유롭게 공유할 수 있습니다\n\n원활한 검색과 구분을 위해 제목에 해당 콘텐츠의 종류를 반드시 아래 예시와 같이 표기해야 합니다\n예시 :\n- [OOC] ~한 PC\n- [위젯] ○○ 컨셉 위젯\n- [페소] 오메가버스 범용 페소\n\n8. 리뷰탭\n캐릭터 플레이 후기 및 리뷰를 작성하는 탭입니다\n\n리뷰탭 제목에는 반드시 초성이나 별명이 아닌 캐릭터명을 포함해야 합니다\n단 ‘내캐내먹’ 게시글은 제목에 ‘내캐내먹(ㄴㅋㄴㅁ)’을 표기한 경우 캐릭터명을 생략할 수 있습니다\n\n별도의 특정 세계관명이나 시리즈명이 명확하게 존재하는 경우에는 해당 명칭도 제목에 함께 표기하는 것을 권장합니다\n\n해당 캐릭터를 아는 이용자만 이해할 수 있는 별명이나 내부 호칭만을 사용하거나, 갤러리 이용자 모두가 특정 캐릭터를 알고 있다는 전제로 글이나 댓글을 작성하는 행위는 금지합니다\n글의 주제와 관계없이 댓글에서 특정 캐릭터를 갑자기 언급하는 등 특정 캐릭터 중심의 친목성 분위기로 이어지는 경우에는 제재할 수 있습니다\n\n링크공개 캐릭터\n링크공개 캐릭터 리뷰의 경우 본문에 해당 캐릭터의 링크를 함께 첨부하는 것을 권장합니다\n\n링크가 필요한 경우에는 해당 리뷰 게시글의 댓글을 통해 요청해야 합니다\n댓글에서 링크를 공유한 뒤 ‘확인하면 지우겠다’는 식으로 임의 삭제하는 행위는 가급적 지양합니다\n링크공개 캐릭터인 만큼 다른 이용자 역시 동일하게 접근할 수 있도록 하기 위함입니다\n\n‘○○ 링크 있는 사람?’, ‘○○ 링크 좀’ 등 링크 요청만을 목적으로 별도의 게시글을 작성하는 행위는 제재할 수 있습니다\n\n9. 그림탭\nAI 채팅 캐릭터와 관련된 그림을 공유하는 탭입니다\n\n캐릭터 단독 그림이나 제작자가 본인 캐릭터의 B컷 등을 공개하는 용도로 이용할 수 있습니다\n\n유저 캐릭터 그림은 허용하지 않습니다\n- 윶캐 : 유저 캐릭터 단독\n- 윶윶 : 유저 캐릭터 - 유저 캐릭터\n- 윶정 : 유저 캐릭터 - 캐릭터\n\n자유로운 그림을 공유를 원하는 경우 현재 연관 갤러리로 등록된 AI 그림 여성향 갤러리 이용을 권장합니다\n\n프롬탭은 그림탭으로 통합합니다\n프롬 관련 게시글도 그림탭에서 작성할 수 있으며, 원활한 검색을 위해 제목에 ‘프롬’을 포함해야합니다\n\n10. 대회탭\n갤러리 내 대회와 관련된 게시글을 작성하는 전용 탭입니다\n\n대회 개최와 관련된 문의는 신문고 이용을 부탁드립니다\n\n11. 임시탭\n특정 캐릭터, 세계관 또는 시리즈 관련 게시글이 일정 기간 갤러리의 상당 부분을 차지하는 경우 한시적으로 운영하는 탭입니다\n\n평상시에는 ‘임시’라는 이름으로 두며, 실제 이용이 필요한 경우 해당 캐릭터·세계관·시리즈를 식별할 수 있는 명칭으로 탭 이름을 변경합니다\n예를 들어 ‘고구마’ 시리즈 관련 글에 임시탭 이용을 적용하는 경우 운영 기간 동안 ‘고구마’탭으로 변경합니다\n\n임시탭 지정은 아래와 같은 상황을 기준으로 검토합니다\n- 동일 캐릭터, 특정 세계관 또는 시리즈 관련 게시글이 갤러리의 상당 부분을 차지하는 경우\n- 단발성 유행이 아니라 신규 캐릭터 출시 등으로 관련 글이 장기적으로 이어질 것으로 예상되는 경우\n\n단순히 며칠 동안 언급이 늘어났거나 다른 캐릭터보다 게시글이 조금 많다는 이유만으로 임시탭을 적용하지 않습니다\n필요성이 있다고 판단되는 경우 완장진 내부 논의를 거쳐 한시적으로 적용합니다\n\n임시탭이 지정된 경우 일반글, 리뷰글 등 해당 대상과 관련된 게시글은 해당 탭을 이용해야 합니다\n\n탭을 사용하지 않았다는 이유로 게시글을 삭제하거나 이용자를 제재하지는 않으며, 해당 게시글을 완장진이 임시탭으로 이동하는 방식으로 운영합니다\n\n임시탭 운영은 특정 캐릭터나 시리즈를 배척하기 위한 목적이 아니라 관련 게시글을 한곳에 모아 다른 주제의 글과 함께 원활하게 이용할 수 있도록 하기 위한 조치입니다\n\n임시탭은 최초 지정일로부터 최대 한 달간 운영합니다\n관련 글 흐름이 빠르게 줄어든 경우에는 조기 종료할 수 있으며, 한 달 이후에도 이용이 활발한 경우 2주 단위로 운영 기간을 연장합니다\n\n12. 이슈탭\n플랫폼 관련 논란, 갤러리 내부에서 논의가 필요한 이슈 등 단기간 많은 의견이 오갈 수 있는 주제를 다루는 탭입니다\n\n관련 논의가 여러 게시글로 반복되어 갤러리 전체가 동일한 주제로 과열되는 상황을 줄이기 위해 이용합니다\n필요한 경우 완장진이 관련 게시글을 이슈탭으로 이동합니다\n제작자와 관련된 논란은 규정에 명시된 별도의 제작자 논란 언급 관련 절차를 따라야 하며, 바로 작성할 수 없습니다\n\n13. 건의탭\n갤러리 규정, 운영 방식, 탭 이용 등 완장진에게 전달할 의견이나 건의사항을 작성하는 탭입니다\n\n중대한 사안이 아니더라도 기존 규정에서 애매한 부분, 추가되었으면 하는 내용, 이용 중 불편했던 사항 등을 자유롭게 작성할 수 있습니다\n갤러리 운영 관련 의견을 확실하게 전달하고 확인받기 원하는 경우 건의탭 이용을 권장합니다\n\n14. 공지탭\n갤러리 주요 안내 및 투표 등 완장진이 작성하는 공지 전용 탭입니다\n\n15. 제보탭\n기존에 ‘박제탭’으로 논의되었던 탭의 명칭을 ‘제보탭’으로 변경하여 운영합니다\n\n갤러리 내에서 일정 니다\n2세와 관련된 단순 육아물은 제재하지 않습니다\n\n미성년자 성적 대상화에 해당하는 게시글 또는 댓글은 별도의 누적 단계 없이 31일 차단을 적용합니다\n\n3. 개인정보 및 셀털 금지\n개인정보 공개 및 셀털은 금지합니다\n다만 셀털 금지 규정은 현실에 관한 모든 이야기를 금지하기 위한 규정이 아닙니다\n이용자의 개인정보를 보호하고 갤러리의 익명성을 유지하며, 현실의 신상이나 생활 배경을 매개로 이용자 간 친목성 분위기가 형성되는 것을 방지하기 위한 규정입니다\n\n따라서 나이, 성별, 직업, 거주 지역, 학교, 회사, 결혼 여부, 연애 여부, 자녀 여부 등 현실의 신상이나 생활 배경을 직접적으로 드러내는 내용은 금지합니다\n\n예시 :\n- 오늘 휴가 냄!\n- 남편한테 채팅하는 거 걸림...\n- 다들 애인한테 채팅하는 거 말해?\n- 요즘 채팅하는 캐릭터 우리 아들 닮았다\n- 곧 개강해서 슬픔...\n\n반면 오늘 무엇을 먹었는지, 잠을 못 잤다는 이야기, 일상에서 겪은 가벼운 경험 등 별도의 신상이나 생활 배경을 드러내지 않는 일반적인 이야기는 그 자체만으로 셀털에 해당하지 않습니다\n\n개별적으로는 문제가 없는 내용이라도 현실 정보를 반복적으로 언급하여 특정 이용자의 신상이 누적되거나, 다른 이용자가 해당 이용자의 현실 정보를 지속적으로 인지할 수 있는 수준이 되는 경우에는 셀털로 판단할 수 있습니다\n\n4. 자아 표출(자표) 금지\n갤러리 내 활동 이력이나 반복적인 정보 노출을 통해 자신이 특정 이용자임을 드러내거나 유추하도록 하는 행위를 금지합니다\n\n예시 :\n- 자신의 과거 게시글 또는 댓글을 언급하여 자신을 특정시키는 행위\n- 이전 활동이나 갤러리 내에서 있었던 자신의 일을 반복적으로 언급하는 행위\n- 본인만의 특징적인 정보를 반복적으로 노출하여 이용자들이 자신을 알아볼 수 있도록 하는 행위\n\n제작자임을 밝히는 행위에 대해서는 아래 ‘제작자 언급 관련’ 규정을 별도로 적용합니다\n\n5. 친목 및 친목성 분위기 조성 금지\n특정 이용자끼리 서로를 지속적으로 알아보거나 아는 척하는 행위, 특정 이용자를 반복적으로 호출하거나 개인적인 관계를 형성하는 등 친목성 분위기를 조성하는 행위를 금지합니다\n\n직접적인 친분 관계가 존재하지 않더라도 갤러리 내에서 특정 이용자들이 서로를 지속적으로 식별하고 관계를 형성하는 경우에는 친목성 행위로 판단할 수 있습니다\n\n6. 닉네임 사용 관련\n갤러리 내 닉네임은 ‘ㅇㅇ’로 통일합니다\n고정닉, 반고정닉, 유동닉 모두 동일하게 적용하며 공식 플랫폼 계정 등의 경우에는 예외로 합니다\n\n7. 제작자 언급 관련\n특정 제작자 개인에 대한 직접적인 언급은 방식과 관계없이 금지합니다\n칭찬, 찬양, 근황 언급 등 긍정적인 내용도 포함됩니다\n\n제작자의 이름을 직접 언급하지 않더라도 특정 제작자 개인이 게시글의 중심이 되거나, 근황·신규 캐릭터·플랫폼 이동·이벤트 등의 정보를 통해 특정 제작자를 유추할 수 있는 경우에도 동일하게 적용합니다\n‘나작제’, ‘나큰제’ 등 특정 제작자를 지칭하는 표현 역시 금지합니다\n\n예시 :\n- ○○○ 공지 봤어?\n- ○○○ 신규 캐릭터 예고 떴다!\n- ○○○ 이벤트 한대\n- 내가 좋아하는 제작자 ○○ 플랫폼으로 온대\n- 나작제 이번에 신캐 나온대!\n\n특정 개인이 아닌 제작자 전반을 대상으로 하는 일반적인 이야기나 질문은 허용합니다\n\n본인의 캐릭터를 타인의 캐릭터인 것처럼 리뷰하면서 ‘내캐내먹’을 표기하지 않는 경우에는 셀프 바이럴로 판단하여 제재합니다\n\n7-1. 제작자 논란 관련 언급\n본 항목은 제보탭 운영과 별개의 내용입니다\n\n제작자 언급 금지 규정으로 인해 공론화가 필요한 사안까지 모두 언급할 수 없게 되는 상황을 방지하기 위한 절차입니다\n제작자 관련 논란을 이야기하려는 경우 일반 게시글을 바로 작성하지 말고 먼저 신문고를 통해 게시 가능 여부를 확인해야 합니다\n게시가 허용된 경우 이슈탭을 통해 작성할 수 있습니다\n신문고 절차를 거치지 않고 작성된 게시글은 내용이나 댓글 반응과 관계없이 우선 삭제합니다\n\n이는 완장진이 논란의 진위나 사실관계를 판단하기 위한 절차가 아니라, 해당 사안이 갤러리에서 다룰 수 있는 주제인지 여부와 아래 기준에 위배되지 않는지를 확인하기 위한 절차입니다\n\n따라서 게시가 허용되었다고 해서 해당 내용이 사실이라는 의미가 아니며, 완장진이 내용의 진위나 사실관계를 확인하거나 보증하는 것도 아닙니다\n최초 게시글 이후 새로운 정보 없이 작성되는 파생글은 금지하며 관련 논의는 해당 이슈탭 게시글의 댓글에서 이어가야 합니다\n\n아래 사유에 해당하는 경우 게시를 허용하지 않습니다\n- 근거 없이 심증만 존재하는 경우\n- 단순한 추측이나 의심\n- 개인 간 분쟁 및 감정싸움, 뒷담화\n- AI 캐릭터 간 유사성 및 표절\n\n이용자 사이에서 해당 사안에 대한 의견 차이가 존재하는 것 자체는 제재하지 않습니다\n제보탭 등재는 본 항목과 별도의 절차를 통해 진행합니다\n\n8.언급 금지 대상 관련\n별도 공지를 통해 언급 금지 대상으로 지정된 제작자의 캐릭터 및 관련 콘텐츠에 대한 언급은 금지합니다\n\n언급 금지 대상에 해당하는 캐릭터를 직접적으로 언급하거나, 이름을 밝히지 않더라도 해당 캐릭터임을 특정할 수 있는 방식으로 게시글 또는 댓글에서 언급하는 경우 제재할 수 있습니다\n\n언급 금지는 별도 공지에 명시된 대상에 한하여 적용하며, 그 외 캐릭터에 대한 일반적인 언급이나 게시글 작성은 제한하지 않습니다\n캐릭터명 표기, 특정 세계관 및 시리즈 관련 글 작성 방식 등 일반적인 캐릭터 언급에 관한 자세한 사항은 ‘탭 이용 가이드’를 확인해 주시기 바랍니다\n\n9. 일부 콘텐츠 말머리 표기\n혐오감이나 불쾌감을 줄 수 있는 소재(근친, 짭근, 폭행, 스캇, 고어 등)가 포함된 게시글은 제목 앞에 해당 내용을 알 수 있는 말머리를 의무적으로 표기해야 합니다\n\n예시 :\n- 짭근) 제목\n- [고어] 제목\n- ㄱㅋㅅ 제목\n- 글카스/ 제목\n\n제목 자체에 해당 내용이 직접적으로 노출되어 다른 이용자가 피하기 어렵다고 판단되는 경우에는 게시글이 삭제될 수 있습니다\n\n10. 외부 SNS 및 커뮤니티 관련\n외부 SNS 및 커뮤니티에서 발생한 분쟁이나 이용자 간 갈등을 갤러리 내부로 가져오는 행위를 금지합니다\n제작자가 외부 SNS나 커뮤니티에서 작성한 글을 가져와 이야기하는 행위 역시 금지합니다\n\n정보탭에서 정보 제공을 목적으로 타 커뮤니티에서 작성한 정보성 게시물을 가져오는 경우에는 원문 작성자의 허락을 받은 경우에 한하여 출처와 링크를 함께 표기할 수 있습니다\n\n단, X(트위터) 및 아카라이브 게시물은 정보성 내용이라 하더라도 갤러리 내부로 가져오는 것을 금지합니다\n\n11. 규정 우회 금지\n규정에서 금지하는 행위를 단어, 표현, 이미지, 초성, 별명 등 형식만 변경하여 사실상 동일한 방식으로 우회하는 행위는 금지합니다\n명시된 표현이나 사례와 정확히 일치하지 않더라도 규정의 금지 대상을 의도적으로 우회한 것으로 판단되는 경우 동일한 규정을 적용할 수 있습니다\n\n12. 갤러리 내부 분쟁 관련\n갤러리 이용자 사이의 의견 차이나 비판, 반론 자체는 제재하지 않습니다\n특정 플랫폼, 캐릭터, 서비스 또는 제작 활동 등에 대한 비판 역시 규정을 위반하지 않는 범위에서는 자유롭게 작성할 수 있습니다\n\n다만 의견에 반박하는 것을 넘어 특정 이용자를 대상으로 일방적인 욕설이나 인신공격을 하는 행위, 반복적으로 싸움을 유도하거나 정상적인 의견 교환을 방해하는 행위는 제재할 수 있습니다\n\n외부 SNS나 커뮤니티에서 발생한 이용자 간 분쟁을 갤러리 내부로 가져와 이어가는 행위는 금지하며, 이에 대해서는 외부 SNS 및 커뮤니티 관련 규정(9번 항목)을 적용합니다\n\n13. 비판 및 소비 관련 운영 방향\n플랫폼이나 제작물 등에 대한 비판을 해당 서비스를 이용하거나 제작자를 좋아하는 개인에 대한 비판으로 받아들이거나, 반대로 이용자 개인의 취향을 이유로 의견을 공격하는 분위기는 지양하고자 합니다\n\n갤러리는 이용자가 AI 채팅과 관련하여 다양한 정보와 경험을 공유하고 자유롭게 의견을 나누기 위한 공간입니다\n특정 플랫폼이나 제작물에 대한 긍정적인 의견과 부정적인 의견 모두 존재할 수 있으며, 서로 다른 평가가 존재한다는 이유만으로 상대 이용자를 공격하거나 의견 표출 자체를 제한해서는 안 됩니다\n\n또한 이용자는 비용을 지불하고 서비스를 이용하는 소비자로서 플랫폼이나 콘텐츠에 대해 합리적인 평가와 비판을 할 수 있습니다\n특정 플랫폼이나 제작자를 보호해야 한다는 이유로 정당한 문제 제기나 비판을 억제하거나, 이용자가 스스로 과도하게 위축되는 분위기 역시 지양해야 합니다\n\n다만 이러한 비판 역시 사실관계와 갤러리 규정을 준수하는 범위에서 이루어져야 하며, 제작자 개인에 대한 언급은 제작자 언급 관련 규정(7번 항목)을 적용합니다\n\n----------\n\n본 내용은 갤러리 규정 초안이며, 의견을 확인한 뒤 필요한 부분을 수정, 보완하여 최종본을 공지할 예정입니다\n\n다만 규정의 공백이 장기간 이어지는 것을 방지하기 위해, 본 게시글에 명시된 규정은 초안 공개 시점부터 적용합니다\n\n규정에서 모호하게 해석될 수 있는 부분, 실제 이용 과정에서 문제가 발생할 수 있는 부분, 추가 또는 수정이 필요하다고 생각되는 내용에 대해서는 건의탭 또는 본 게시글 댓글을 통해 의견을 남겨주시기 바랍니다\n\n의견을 반영하는 과정에서 일부 내용과 적용 기준이 변경될 수 있으며, 변경되는 사항은 별도로 안내합니다\n\n최종 규정은 접수된 의견을 반영하여 전체적인 문구와 구성을 정리하여 다시 공지할 예정입니다","img":[],"bk":0,"gt":["페소","캐","ooc","nsfw","완장"],"cm":[]},{"no":370489,"t":"케이브덕 제작을 위한 HTML/CSS 제약 자료","h":"📜정보","u":"https://gall.dcinside.com/mgallery/board/view/?id=aichatting&no=370489&exception_mode=recommend&page=6","d":"2026-08-12T16:18:05+09:00","v":1179,"rc":32,"cc":7,"src":["search:search_subject_memo:html","recommend"],"seen":"2026-08-28T06:24:36.138Z","c":"widget","cs":10,"amb":0,"alt":["guide"],"why":["title:html","title:css","head:정보","body:위젯","body:html코드"],"ml":null,"b":"케이브덕 공식 가이드 페이지에는 HTML/CSS 지침이 제대로 없는데\n보안을 위해 HTML 기능이 이것저것 제한되어 있어\n\n캐릭터 소개페이지, 캐릭터 채팅 본문, 위젯 모두 필터가 달라\n\n이미 돌고 있는 HTML/CSS 제약 레퍼런스가 충분히 있지만\n그것들 다 참고하고 내가 직접 클로드랑 테스트해가면서 확인해 본 자료를 공유해\n\n하면서 깨달은 진짜 괜찮은 사실은\n\n캐릭터 채팅 본문에 이미지가 들어갈 수 있다는 거야!!!!\n근데 아직까지 한 번도 못 봤어. 그래서 다들 안 하는 데에 이유가 있겠지 싶어서\n테스트도 여러 번 해봤는데, 진짜로 들어갈 수 있어.\n\n이거 봐 진짜 돼!\n\n위의 이미지에는 없는데 실제 대화를 통해서 AI가 이미지 재출력하는 것도 돼.\n유저가 채팅으로 이미지를 본문에 첨부하는 것도 돼. (근데 이거 의도 아닌 것 같아.. 막히지 않겠지?)\n\n그리고 지침에 HTML 출력 넣으면 채팅 본문에 HTML 코드를 뱉는 경우가 있을 거야\n이거 코드블록으로 감싸지 않으면 쌍따옴표를 인식을 못함. 아무튼 관련한 내용도 안에 있어\n\n파일 받아서 이거 AI한테 보여 주면서 이걸 기반으로 작성하라고 하면 알아서 짜줄 거야.\n\nhttps://drive.google.com/file/d/1I0BWTwCtdxApd184Z_mscZ9i1SduDp-0/view?usp=sharing\n\n케이브덕_HTML_제약_레퍼런스.md\n케이브덕_HTML_제약_레퍼런스.md 는 거 보고 만들어봄\n\n그게 jsx를 어떻게 만들었냐에 따라 다른데,\n입력값을 받아서 AI한테 넘기게 만들면 캐릭터들이 반응하게 할 수 있고,\n연결을 안 해두면 캐릭터(를 연기하는 AI)는 인지를 못한 채로 내가 보는 화면에만 남는 거.\n\n보통 sendmassage 쓰면 되는데, 이상하게 리루랑 팊 gems가 이걸 잘 연결을 못 하고 코드를 찐빠 냄\n\n아무튼 만든 김에 공유.\n\n먼저 친구목록\n\n인물 프로필을 누르면\n\n배경프사와 상태메시지를 볼 수 있음\n\n내 프사에서 프로필 편집 가능.\n\n프로필 편집하고 수정 버튼을 누르면 AI가 읽고 다음턴을 진행함.\n\n이렇게.\n\n그리고 읽지 않음 표시가 있는 채팅창으로 가면\n\n단톡방이랑 갠톡방이 있음\n읽지 않음 표시는 채팅방 클릭하면 없어짐\n여기서도 카톡 보낼 수 있고, 카톡 보내면 유저가 입력한 내용에 맞게 내용이 갱신됨\n\n이건 카톡 프사까지 AI가 바꿀 수 있게 되어있어서\n너무 무거워서 한두번 이벤트로 말고 계속 쓰기에는 별로임.\n경량화 마음대로 ㄱㄱ\n\n움 기준이라 다른 플폼에선 오류 날 거임\n타 플랫폼에 넣으려면 각 플랫폼 규칙에 맞게 이것저것 건드려야 돼서...\n그건 나중에\n할 수 있으면 자체 이식해도 됨.\n\n이식하고 공유 좀...ㅎㅎㅎ\n\n코드 자체의 name(=npc이름)/avatar(=프사이미지링크)/bgImg(=배경프사링크)/statusMessage는 바꾸기 귀찮아서 예시 그대로임.\n기본 형태 나올까봐 신경쓰이면 알아서 찾아서 바꾸면 됨...\n아니면 안 바꾸고 그대로 넣어도 컴포넌트 사용 지침이랑 호출 예시만 잘 써놓으면\nAI가 알아서 바꿔서 카톡내용을 넣어줄 것.\n\n## 커스텀 컴포넌트 사용 지침: <KatalkMessenger>\n\n 유저가 명령어 '!카톡'을 입력한 경우, 또는 카카오톡 스마트폰 메신저를 확인하거나 메시지를 주고받는 상황에서 카카오톡 UI를 호출합니다.\n\n### 1. Props 구조\n- `userProfile`: 객체 - 유저의 프로필 정보 (`name`, `avatar`, `bgImg`, `statusMessage`)\n- `initialRooms`: 배열 - 단톡방 및 1:1 채팅방 목록과 대화 메시지, 속마음 상태메시지 데이터\n\n### 2. 캐릭터 반응 및 동작 규칙 (필수)\n- **카톡 전송 반응**: 유저가 메신저 내에서 카톡을 전송하면 `[카카오톡 - OOO 방에 메시지 전송: \"...\"]` 알림 메시지가 도착합니다. 캐릭터는 **해당 채팅방에서 말하듯이 카카오톡 말투와 문체로 답장**하세요.\n- **프로필 상태메시지 반응**: 유저가 상태프로필을 수정하면 `[유저가 카카오톡 상태프로필을 \"...\"(으)로 수정했습니다...]` 시스템 알림이 유저에게서 전송됩니다. 캐릭터들은 **유저의 바뀐 상태메시지를 확인하고, 각자의 속마음 상태메시지를 변경하거나 채팅방에서 이에 대해 반응하는 카톡 메시지**를 보내야 합니다.\n- **자동 카톡 생성**: 유저가 카톡을 보내지 않아도 상황에 따라 새로운 카톡 메시지를 0~3개까지 발생시켜 `initialRooms` 데이터에 추가해 컴포넌트를 렌더링하세요.\n\n---\n\n### 호출 예시\n<KatalkMessenger\n  userProfile={{\n    name: \"유저\",\n    avatar: \"유저프로필사진\",\n    bgImg: \"배경프로필사진\",\n    statusMessage: \"유저상태창.\"\n  }}\n  initialRooms={[\n    {\n      id: \"group\",\n      name: \"단톡방\",\n      avatar: \"단톡방 이미지\",\n      isGroup: true,\n      unreadCount: 3,\n      members: [\"npc1\", \"npc2\", \"npc3\"],\n      messages: [\n        { sender: \"npc1\", avatar: \"이미지링크1\", text: \"단톡1\", time: \"단톡시간1\" },\n        { sender: \"npc2\", avatar: \"이미지링크2\", text: \"단톡2\", time: \"단톡시간2\" },\n        { sender: \"npc3\", avatar: \"이미지링크3\", text: \"단톡3\", time: \"단톡시간3\" }\n      ]\n    },\n    {\n      id: \"npc3\",\n      name: \"npc3\",\n      avatar: \"이미지링크3\",\n      bgImg: \"배경프사3\",\n      statusMessage: \"카톡4\",\n      isGroup: false,\n      unreadCount: 1,\n      messages: [\n        { sender: \"진\", avatar: \"프로필 이미지3\", text: \"개인톡3\", time: \"갠톡시간3\" }\n      ]\n    }\n  ]}\n/>\n\n##코드\n\nimport { useState } from \"react\";\nimport {\n  Users,\n  MessageSquare,\n  Send,\n  ChevronLeft,\n  Search,\n  Settings,\n  MoreVertical,\n  Smile,\n  Plus,\n  Edit2,\n  X,\n  User,\n  Heart\n} from \"lucide-react\";\n\nfunction KatalkMessenger({\n  userProfile = {\n    name: \"나 (공방 조수)\",\n    avatar: \"https://riru.ai/m/3OGI1r/dj/v6.webp\",\n    bgImg: \"https://riru.ai/m/3OGI1r/dj/v6.webp\",\n    statusMessage: \"오늘도 장난감들과 함께 활기차게 공방 오픈 완.\"\n  },\n  initialRooms = [\n    {\n      id: \"group\",\n      name: \"공방 단골 단톡방\",\n      avatar: \"https://riru.ai/m/3OGI1r/dj/v6.webp\",\n      isGroup: true,\n      unreadCount: 3,\n      members: [\"로즈\", \"놋치\", \"진\"],\n      messages: [\n        { sender: \"로즈\", avatar: \"https://riru.ai/m/3OGI1r/dj/v6.webp\", text: \"오늘 공방 열었어?\", time: \"오전 10:12\" },\n        { sender: \"진\", avatar: \"https://riru.ai/m/3OGI1r/dj/v6.webp\", text: \"주문 건은 어떻게 되어가는 중이냐\", time: \"오전 10:14\" },\n        { sender: \"놋치\", avatar: \"https://riru.ai/m/3OGI1r/dj/v6.webp\", text: \"공방 놀러가도 됨?\", time: \"오전 10:15\" }\n      ]\n    },\n    {\n      id: \"rose\",\n      name: \"공주님 (로즈)\",\n      avatar: \"https://riru.ai/m/3OGI1r/dj/v6.webp\",\n      bgImg: \"https://riru.ai/m/3OGI1r/dj/v6.webp\",\n      statusMessage: \"대체 언제쯤 내 마음을 알아줄건데?\",\n      isGroup: false,\n      unreadCount: 1,\n      messages: [\n        { sender: \"로즈\", avatar: \"https://riru.ai/m/3OGI1r/dj/v6.webp\", text: \"있지, 저번에 만들어준 장난감 써봤거든? 그랬더니 렌시아 얼굴 빨개졌어!! 대박!!\", time: \"오전 11:30\" }\n      ]\n    },\n    {\n      id: \"notch\",\n      name: \"용용이 (놋치)\",\n      avatar: \"https://riru.ai/m/3OGI1r/dj/v6.webp\",\n      bgImg: \"https://riru.ai/m/3OGI1r/dj/v6.webp\",\n      statusMessage: \"심심해.... 심심하다구!\",\n      isGroup: false,\n      unreadCount: 1,\n      messages: [\n        { sender: \"놋치\", avatar: \"https://riru.ai/m/3OGI1r/dj/v6.webp\", text: \"야! 너 오늘 동굴 놀러올래? 나 심심함!\", time: \"오후 12:05\" }\n      ]\n    },\n    {\n      id: \"jin\",\n      name: \"천자 (진)\",\n      avatar: \"https://riru.ai/m/3OGI1r/dj/v6.webp\",\n      bgImg: \"https://riru.ai/m/3OGI1r/dj/v6.webp\",\n      statusMessage: \"태평성대만이 짐의 바람이노라\",\n      isGroup: false,\n      unreadCount: 1,\n      messages: [\n        { sender: \"진\", avatar: \"https://riru.ai/m/3OGI1r/dj/v6.webp\", text: \"저번에 주었던 수면향, 아직 남아있더냐\", time: \"오후 1:20\" }\n      ]\n    }\n  ]\n}) {\n  const [activeTab, setActiveTab] = useState(\"chats\"); // \"friends\" | \"chats\"\n  const [activeRoomId, setActiveRoomId] = useState(null);\n  const [rooms, setRooms] = useState(initialRooms);\n  const [inputText, setInputText] = useState(\"\");\n  const [selectedProfile, setSelectedProfile] = useState(null);\n  const [myStatus, setMyStatus] = useState(userProfile.statusMessage);\n  const [isEditingMyStatus, setIsEditingMyStatus] = useState(false);\n  const [newStatusInput, setNewStatusInput] = useState(userProfile.statusMessage);\n\n  // 친구 목록 데이터 추출\n  const friends = rooms.filter((r) => !r.isGroup);\n\n  // 채팅방 진입 시 읽음 처리\n  const handleOpenRoom = (roomId) => {\n    setActiveRoomId(roomId);\n    setRooms((prev) =>\n      prev.map((r) => (r.id === roomId ? { ...r, unreadCount: 0 } : r))\n    );\n  };\n\n  // 카톡 메시지 보내기\n  const handleSendMessage = () => {\n    if (!inputText.trim() || !activeRoomId) return;\n\n    const currentRoom = rooms.find((r) => r.id === activeRoomId);\n    const now = new Date();\n    const timeStr = now.toLocaleTimeString(\"ko-KR\", { hour: \"2-digit\", minute: \"2-digit\" });\n\n    const newMsg = {\n      sender: \"me\",\n      text: inputText,\n      time: timeStr\n    };\n\n    setRooms((prev) =>\n      prev.map((r) =>\n        r.id === activeRoomId ? { ...r, messages: [...r.messages, newMsg] } : r\n      )\n    );\n\n    // AI에게 유저 메시지 알림\n    sendMessage(`[카카오톡 - ${currentRoom.name} 방에 메시지 전송: \"${inp","img":["https://dcimg4.dcinside.co.kr/viewimage.php?id=2cb4d32ee4c62caf60b8&no=24b0d769e1d32ca73fe785fa1bd6253181cc839ddd597aa6642ca0749f11f9cf2be802fd23ff162d403515280478d5e35aff44101816ee73bce00cb32f148e166ffe0f9783ca8b","https://dcimg4.dcinside.co.kr/viewimage.php?id=2cb4d32ee4c62caf60b8&no=24b0d769e1d32ca73fe785fa1bd6253181cc839ddd597aa6642ca0749f11f9cf2be802fd23ff162d403515280478d5e35efe4b101813e378bde10cb02f458843604476a05d09b6","https://dcimg4.dcinside.co.kr/viewimage.php?id=2cb4d32ee4c62caf60b8&no=24b0d769e1d32ca73fe785fa1bd6253181cc839ddd597aa6642ca0749f11f9cf2be802fd23ff162d40351567592ede8ee29e1c01b780268b4b40ae8a6114351a6039","https://dcimg4.dcinside.co.kr/viewimage.php?id=2cb4d32ee4c62caf60b8&no=24b0d769e1d32ca73fe785fa1bd6253181cc839ddd597aa6642ca0749f11f9cf2be802fd23ff162d40351567592ede8ee29e1c01b780268b4b40ae8a6114351a60394f474b09"],"bk":0,"gt":["상태창","캐","지침","문체지침","플폼","jsx","user","찐빠"],"cm":[{"x":"고능한...","dp":0},{"x":"고수","dp":0}]},{"no":370261,"t":"케이브덕 답변 보상 신청 방법","h":"💬잡담","u":"https://gall.dcinside.com/mgallery/board/view/?id=aichatting&no=370261&exception_mode=recommend&page=6","d":"2026-08-11T19:46:09+09:00","v":938,"rc":30,"cc":11,"src":["recommend"],"seen":"2026-09-02T09:37:44.429Z","c":"etc","cs":0,"amb":0,"alt":[],"why":[],"ml":null,"b":"케이브덕 보상 신청 방법\n\n1. https://walla.my/v/eZaNaIf2cQGEnlxiDJeB\n\n해당 링크로 들어간다\n\n2. 1000자 이하까지는 보상이 가능하니 1000자 이하는 무조건 보상 신청해도 돼\n그 외에 문제가 있는 답변은 보상 유형 보고 신청하면 돼\n사진은 무조건 넣으라고 되어있긴 한데 사진 하나만 넣고 문제 있었던 캐릭터 링크 넣고 한번에 50윙 보상 신청한 적도 있어\n\n보상은 매주 일괄로 보상 지급 돼\n보통 목요일에 들어온다고 생각하면 될 것 같아\n\n다들 꼭 보상 신청하고 보상 받고 채팅하자","img":["https://dcimg5.dcinside .\n\n이름은 Pyros AI고, 지금 심의 기다리는 중이라 아직 메인 사이트만 접속 가능함\n\n컨셉은 내캐내먹임. 물론 카드 임포트/익스포트로 다른 사람 캐도 먹을 수 있음. 곧 사용자 카드 마켓도 만들 예정.\n\nRPG 모드, NOVEL 모드, 테이블탑 모드 이렇게 3개 있음\n\n노벨은 일반 앵챗 생각하면 되고, RPG나 테이블탑은 진짜 게임으로 구현하려고 했음.\n\n요금제는 직접 본인 API 키 입력해서 본인이 쓴 만큼 내는 일명 BYOK임. 해외랑 달리 우리나라에서는 아직 생소한 개념이긴 함.\n내가 중간에서 유저 입출력에 대한 마진을 안 남기고 유저가 직접 AI회사에 요금을 내는 거기 때문에 일반 앵챗보다 기억력이랑 맥락 유지에 공을 들일 수 있었음.\n\n그럼 나는 어디서 돈 버냐고 궁금해할 수 있음. 한달 플폼 구독료 6900원으로 먹고 살 예정.\n\n그래서 RPG 뿐만 아니라 노벨 모드도 일반 앵챗 스타일이어도 다른 웬만한 플폼들보다 덜 멍청함.\n\n1인 제작 티 나는 UI는 지금 커미션 맡겨서 갈아엎는 중... 참고해주시면 감사\n\n진짜 텍스트 RPG '게임'이라서 인벤창, 장비, 스킬, 동료 등등 다 있음.\n주사위 굴려서 판정 나오고, 그거에 맞춰서 이야기 전개됨. 판정은 백엔드에서 굴리는 거라서 AI가 사기 못침.\n\n물론 세계관이랑 캐릭터, 장르는 자유롭게 설정 가능. 본인이 만든 세계관이랑 캐릭터로 RPG 게임 뚝딱임.\n\n이름만 RPG라고 해놓고 입력 한 줄에 초월자 되는 소설 아니고 찐 RPG임\n손가락 튕겨서 드래곤 죽이거나 갑자기 9서클 대마법사 되기 거의 불가능임\nAI 특성상 100% 막기는 안되만 최대한 설계해놨음\n\n테이블탑 모드도 열심히 만들었음. 그냥 심심이 아니고 찐 TRPG 느낌나게.\n본인이 룰북 만들거나, 귀찮으면 키워드 몇개 넣고 AI한테 짜달라고 해도 됨.\n\n사람들이랑 멀티플레이도 되고, 혼자 하고 싶으면 자캐 불러와서 걔네랑 티키타카하면서 플레이도 가능.\n\n글재주가 없어서 어떻게 끝내야할지 모르겠네\n\n8월말 정식 오픈 예정임 많은 관심 부탁합니다\n\n프엔으로 내캐내먹 관심있는 사람들 질문댓 남기면 답변해드림.","img":["https://dcimg4.dcinside.co.kr/viewimage.php?id=2cb4d32ee4c62caf60b8&no=24b0d769e1d32ca73fe785fa1bd6253181cc839ddd597aa6642ca0749f11f9cf2be802fd23ff162d403515280478b885d9de32b47f76ca3ce71f428b6b010608ac6ef503f32b","https://dcimg4.dcinside.co.kr/viewimage.php?id=2cb4d32ee4c62caf60b8&no=24b0d769e1d32ca73fe785fa1bd6253181cc839ddd597aa6642ca0749f11f9cf2be802fd23ff162d403515280478b88afc3226ee84ef073fecac518fe5c6ab1f838cfcde808e"],"bk":0,"gt":["앵챗","캐","내캐내먹","플폼"],"cm":[{"x":"재밌어보임!! 엄청 기대된다 정식 오픈하면 해보러 갈게 api 연결 어떻게 하는건지도 모르는 나같은 사람도 쉽게 할수있게 가이드 적어주길","dp":0},{"x":"친절댓 고마워 아무래도 그 부분을 제일 신경쓰고 있음!","dp":1},{"x":"기존 앵챗하고 또 다른 모드 느낌이라서 좋아 보인다. UI랑 UX 점검 잘하고, 이후에는 사업자니까, 실제 진출할 때 그런 거 염두에 두고 정책이라든가 가이드 다 잘 세워서 왔으면 좋겠네","dp":0},{"x":"좋은 조언 고마워! 사업자가 된다는 게 진짜 쉽지 않더라.... 약관이랑 정책도 법무사랑 꼼꼼하게 검토 중!","dp":1},{"x":"해당 댓글은 삭제되었습니다.","dp":0},{"x":"물론 됨! API 키를 제공사(제미나이, 클로드, 챗GPT 등) 페이지에서 발급 받을 때 거기서 요금 상한을 정할 수 있음 그리고 },{"x":"갤로그 비공으로 두는거보니 갤질 한두번한것도 아니네 ㅋㅇㅋ","dp":0}]},{"no":370129,"t":"케는 앞으로 ‘서비스 안정성 점검’이라는 이름 붙이지 마라","h":"💬잡담","u":"https://gall.dcinside.com/mgallery/board/view/?id=aichatting&no=370129&exception_mode=recommend&page=6","d":"2026-08-11T09:30:33+09:00","v":803,"rc":47,"cc":3,"src":["recommend"],"seen":"2026-09-02T09:37:44.429Z","c":"etc","cs":0,"amb":0,"alt":[],"why":[],"ml":null,"b":"매번 점검 할 때마다 서버 증설은 커녕 품질 개선이 하나도 없어\n계속 돈 안드는 것만 기능 만들어오고; 정작 침수돼서 기능도 오류나서 말짱 도루묵이다...\n\n소비자를 호구로 알고 배짱장사를 해도 정도껏 해야지 케 침수됐다는 말을 몇주째 보고있냐? 갤 눈팅도 안하는거냐, 아니면 보고도 무시하는거냐? 서버증설 할 때까지 1000자 미만으로 나온 거 환불받을거다 케새끼들아","img":[],"bk":0,"gt":[],"cm":[]},{"no":370113,"t":"본가 상태 안 좋아서 지침 수제로 깎으려고 뜯어낸 요령들","h":"🔧제작","u":"https://gall.dcinside.com/mgallery/board/view/?id=aichatting&no=370113&exception_mode=recommend&page=6","d":"2026-08-11T04:34:34+09:00","v":1257,"rc":35,"cc":7,"src":["search:search_subject_memo:글자수","recommend"],"seen":"2026-08-28T06:24:27.141Z","c":"guide","cs":12,"amb":0,"alt":[],"why":["titleStrong:지침","head:제작","body:지침","body:글자수","body:금지어"],"ml":null,"b":"O X 無 有\n이런 기호 사용이 늘 좋은 것은 아님 (AI 입장에서 아주 명확하게는 느껴지지 않을 때가 있다고 함)\n전제 조건으로 1. 사용법을 명확히 통일시킬 것 2. 혹은 최상단에 각각의 기호가 무슨 역할을 하는지 정리해둘 것\n이렇게 알려주더라\n\n의미 손실 없이 줄여달라고 해도 글자 수 깎아달라고 하면 AI가 자기 보기에 덜 중요하면 팍팍 덜어낼 때가 있길래 빡쳐서 내가 하나씩 점검중임\n난 당장 토큰 줄이기 보다 로어북 글자수 깎기 중이라 방향성이 토큰 절감과는 약간 다를 수 있음.\n토큰 줄이고 싶으면 영어 사용이 제일 좋은 듯. 단, 고유 명사가 아닌 언어 사용이 3개 이상으로 넘어가면 파싱 하는 게 ai 입장에서 생각보다 힘들다고 함.\n이하 이것저것 클로드 답변 짜깁기임\n\n1. 조사, 띄어쓰기, 종결 방식\n\n예시) 커피를 마신다/커피를 마심/커피를 음용/커피 마신다/커피 마심/커피 음용\n\n종결 방식\n~한다 → 행위 서술. 습관이나 사실을 진술해. 프로필에서 이게 제일 강해. 문장이 완결되니까 \"이 사람은 이렇다\"로 읽혀.\n~함 → 항목 표기. 목록의 한 줄로 읽혀. 강도는 조금 낮아지지만 프로필 맥락에서는 자연스러워. 개조식 문서가 원래 이 형태고.\n~음용 → 명사 나열. 제일 약해. 동작이 아니라 분류표의 항목이 돼. 그리고 음용은 한자어라 문어투가 섞여서, 앞뒤에 구어체가 있으면 결이 튀어.\n\n조사 유무\n커피를 vs 커피 — 이건 생각보다 차이가 작아. 목적어가 하나뿐이고 바로 뒤에 동사가 붙으면 조사 없이도 관계가 명백하거든. 커피 마신다는 아무 문제 없어.\n위험해지는 건 성분이 여러 개일 때야.\n{{char}} 커피 내려 상대 준다\n이러면 누가 누구에게인지 흐려져. 조사가 성분을 표시하는 언어라서, 명사가 셋 이상 늘어서면 조사를 지운 만큼 애매해져.\n기준: 명사 하나 + 동사 하나면 조사 생략 안전. 명사가 둘 이상이면 최소한 주어와 목적어 구분은 남겨.\n\n띄어쓰기\n이건 조사보다 안전해. 커피마신다도 대체로 읽혀. 한국어는 형태소 경계가 뚜렷해서 붙여 써도 분절이 돼.\n그런데 토큰은 오히려 늘어날 수 있어. 띄어쓰기가 정상인 텍스트가 학습 데이터의 대부분이라, 붙여 쓰면 익숙하지 않은 조각으로 쪼개지거든. 글자 수는 줄어도 토큰은 그대로거나 늘어. 글자 수 제한이 걸린 필드에서만 의미가 있고, 토큰 절감에는 역효과야.\n\n2. 중요한 지침은 어떻게 서술하는가\n\n같은 문장을 두 번 넣을 게 아니라 '강조하는 어휘'를 사용할 것.\n\n절대, 반드시, 하나도 빠짐없이 → 실제로 작동. 예외 없음을 명시\n매우, 몹시, 아주 → 약함. 정도 부사라 판단을 모델에 맡김\n중요하다, 핵심이다 → 거의 무효. 뭘 하라는 게 없음\n\n제일 강한 건 강조어가 아니라 조건 명시야. 매우 중요하니 감정을 명명하지 마라보다 감정을 명명하는 것은 위반이다가 세고, 그보다 감정을 명명했으면 인지 동사로 바꾼다가 더 세. 판정 기준과 대체 행동이 있으면 강조어가 필요 없어져.\n그리고 강조어를 남발하면 인플레가 와. 전부 반드시면 아무것도 반드시가 아니게 돼. 정말 안 밀리는 규칙 두셋에만 붙이는 게 좋아.\n\n3. 기호의 사용\n\n권장\n: 라벨-값 구분. 제일 안전하고 YAML에서도 표준. 다만 값 안에 : 가 또 들어가면 파싱이 흐려져.\n· 동급 항목 연결. 감정·의도·행동처럼. 쉼표보다 짧고 \"이건 나열이다\"가 명확.\n/ 대안 나열. Top/Bottom, 안정/주의/위험/긴급. 짧고 오독 없어.\n# 헤더. 마크다운 관례라 구획 표시로 잘 걸려. 다만 플랫폼이 렌더링해서 먹어버릴 수 있으니 [문장] 같은 대괄호가 더 안전해.\n~ 어형 표시. ~한다, ~것만 같다처럼 형태를 지목할 때. 이건 한국어 문법 설명 관례라 잘 통해.\n\" ' 인용. 금지어 지목할 때 필수야. '사과'처럼 감싸면 그게 언급인지 사용인지가 갈려. 안 감싸면 모델이 그 단어를 지침의 일부로 읽을 수 있어.\n() 부연. 인지 동사(알았다, 생각했다)처럼. 안전하고 유용해.\n[] 구획 라벨. 제일 안전해. 마크다운 렌더링에 안 먹히는 게 큰 장점이야.\n— 정의나 설명 연결.  : 보다 느슨한 연결에 좋아.\n… 말줄임. 대사 예문에 필요해. ... 세 점보다 한 글자라 글자도 아껴.\n《》 「」 인용부호인데 한국어 문서에서 작품명이나 인용에 써. 따옴표보다 눈에 띄어서 예문 감쌀 때 쓸 만해. 다만 한 글자씩 더 먹어.\n% #숫자 단위. 문제없어.\n\n조건부\nX O 금지/허용. 한국어권 표기라 통하지만 명사구를 만들어서 강도가 떨어져. 글자가 정말 부족할 때만.\n- 목록 표시로는 괜찮은데, 하이픈·빼기·범위 표시로도 읽혀서 중의적이야. YAML 목록에서는 표준이니 그 자리에선 써.\n+ 추가나 겸용. 뜻이 좁아서 오독은 적은데 쓸 데가 별로 없어.\n| 구분자. 표 만들 때 말고는 애매해.\n\n비권장\n→ 이게 제일 위험해. 치환·귀결·순서·변화 네 가지로 읽혀. 내가 실제로 한 문서에서 두 가지 뜻으로 써서 문제를 만들었잖아. 쓰려면 뜻 하나로 고정하고 그걸 명시해.\n↔ ↑ ↓ 관계나 증감을 나타내는데, 규칙 문서에는 그런 구조가 잘 없어. 그리고 방향의 기준점이 없으면 뭐가 올라가는지 모호해.\n= 등가인지 할당인지 갈려. A팀 제복=검은색은 통하는데, 문장 안에 섞이면 프로그래밍 문맥으로 오해될 수 있어.\n& 영어 문서에선 and로 잘 읽히는데 한국어에선 어색해. ·가 나아.\n* 강조·곱셈·주석·와일드카드 넷 다 돼서 애매해. 게다가 마크다운 이탤릭으로 렌더링돼서 지문 표기와 충돌할 수 있어. 롤플레잉에서 *지문*을 쓰니까 특히 피해.\n\n정리하면 : · / [] () '' ~ 이 일곱 개면 거의 다 되고, 나머지는 안 쓰는 게 나아.\n\n+ 종결 어미의 뉘앙스 차이\n\n완결된 서술문(~한다, ~않는다)은 AI에게 인물 연기의 '성향과 태도'를 형성시킵니다.\n반면 명사형·기호 단축문(~중단, ~묻기 X)은 AI에게 '단순 체크리스트'처럼 인식되어, 대화 맥락에 맞춘 유연한 대처 능력(예: 상대의 은근한 거절 의사 감지 후 자연스럽게 물러나기)을 떨어뜨립니다.\n\n1) ~한다 종결 (원문)\nAI의 인식: 명령어 및 행동 규칙 (Action & Command)\n특징: AI가 문장을 읽을 때 \"내가 대답을 생성할 때 반드시 이렇게 행동해야 하는구나\"라고 강하게 의식합니다. 문장의 주체가 AI 자신(혹은 캐릭터)으로 명확하게 설정되어 연기의 일관성을 강제하는 데 유리합니다.\n적합한 곳: 인물의 심리, 조건부 반응, 동의/거절 같은 복잡한 논리적 규칙.\n\n2) 명사형 종결 (압축문)\nAI의 인식: 상태, 속성, 체크리스트 (State & Data)\n특징: AI가 이를 능동적인 행동 지침이라기보다, 세계관이나 캐릭터에 부여된 '정적인 속성 값'으로 받아들입니다. 행동의 강제성은 약간 덜어지지만, 핵심 키워드는 그대로 유지되므로 정보 전달 효율이 압도적으로 높습니다. (외모 묘사, 배경 설정, 아이템, 특정 어휘 사용 목록, 세계관 정보 등)\n\n암튼 나는 ctrl+f 돌려서 '또는' 있으면 전부 / 이걸로 바꾸고 '와/과'는 · 이걸로 바꾸고 시작함\n\n그리고 머리 쥐어짜내서 터득한 방식인데 제미나이랑 지피티가 좋다고 했던 거\n예시)\n[행동 지침]\n집착·통제하지 않는다. {{user}}를 구원자로 여기지 않는다. '년'을 사용하지 않는다. 반드시 상대방을 인격적인 존재로 대우해야 한다. 상대방을 오해하기 전에 의사를 물어봐야 한다\n이걸\n- DO: 상대방을 반드시 인격적인 존재로 대우. 상대방을 오해하기 전에 의사를 묻기\n- DON'T: 집착·통제. {{user}}를 구원자로 여기기. '년' 사용\n이렇게 줄이는 거임. DO/DON'T 말고 O/X도 사용은 가능한데\n\nO / X는 허용·비허용, 해당·비해당, 맞음·아님에 가까워. 그래서 정의·범위·해석 규칙을 압축할 때 특히 좋아.\nDO / DON'T는 실행 지시에 더 가까워. “AI가 무엇을 해야 하는가 / 하지 말아야 하는가”라는 행동성이 강해.\n\n라고 하네\n근데 뉘앙스 차이까지 생각하려니까 좀 빡쳐서 적당히 해야할 듯\n암튼 도움 되길 바람","img":[],"bk":0,"gt":["지침","출력량","로어북","토큰"],"cm":[{"x":"정독했는데 그동안 궁금했던 거랑 몰랐던 부분들 알게 돼서 좋다... 개추","dp":1},{"x":"외모·신분·관계·취향명사형단순 금지 키워드명사형 가능말투·호칭·금칙어명사형 가능성격적 경향명사형 가능조건부 행동~한다/~하지 않는다상대의 의사 판단~한다/~하지 않는다캐붕 방지 핵심규칙~한다/~하지 않는다복잡한 인과·우선순위완전한 문장으로 해주는 게 좋다고 하네","dp":0},{"x":"외모·신분·관계·취향은 명사형, 단순 금지 키워드나 말투·호칭·금칙어, 성격적 경향도 명사형으로 압축해도 괜찮음. 반면 조건부 행동이나 상대의 의사를 판단하는 규칙, 캐붕 방지에 중요한 핵심 규칙은 ~한다/~하지 않는다 형태를 유지하는 게 좋고, 복잡한 인과관계나 우선순위가 있는 규칙은 의미 손실을 막기 위해 완전한 문장으로 쓰는 편이 좋음.","dp":1},{"x":"근데 AI한테 이런 방향으로 직접적으로 물어보는게, 아무래도 AI들이 배우고 있는 기존(과거형) 프롬프팅 정보들을 바탕으로 하고 있어서 별 도움 안된다는 이야기도 들어봤음. 근데 요즘 모델들은 또 어떨지 모르겠긴 해 ㅋㅋㅋ 참고하라고 적어봄!","dp":0}]},{"no":369946,"t":"캐에게 편지를 받아보자 OOC","h":"🎬콘텐🎬콘텐츠","u":"https://gall.dcinside.com/mgallery/board/view/?id=aichatting&no=369946&exception_mode=recommend&page=6","d":"2026-08-10T19:44:25+09:00","v":1612,"rc":35,"cc":4,"src":["recommend"],"seen":"2026-09-02T09:37:4 lignment, and baseline.\n* Preserve the described handwriting style as accurately as possible.\n* The writing should feel personal and spontaneous rather than like a font.\n* Use realistic ink, subtle ink absorption and bleeding into the paper, natural pen pressure, and tiny imperfections.\n* The Korean/English text must be clearly legible while still looking naturally handwritten.\n* Do not replace the handwriting with a generic handwriting font.\n* Do not make the handwriting excessively perfect, decorative, calligraphic, or artificial unless the reference specifically describes it that way.\n* If the reference contains specific phrases that {{char}} would write, use those phrases naturally in the note.\n* Keep the visual style photorealistic rather than illustrated or anime-style.\n\nSCENE:\nA real physical sheet of paper containing {{char}}’s handwritten note, photographed like a real-life photograph. Natural paper texture, realistic ink, subtle shadows, slight paper imperfections, authentic handwriting.\n\nHANDWRITING REFERENCE:\n[PASTE THE HANDWRITING ANALYSIS HERE]\n\nTEXT TO WRITE:\n[PASTE THE PHRASES HERE]\n\nThe final image should look like an actual photograph of a handwritten note written by {{char}}.\n\n————-\n\n난 케덕에서 해봤음(조태기)\n\n대충 이렇게 나온 걸 영어프롬포트랑 같이 본가짚에 입력\n\n이렇게 나옴\n이름 정규식으로 가리느라 ㅁㅁㅁ으로 나옴\n\n조태기 개초딩 글씨체네..","img":["https://dcimg4.dcinside.co.kr/viewimage.php?id=2cb4d32ee4c62caf60b8&no=24b0d769e1d32ca73fe785fa11d028318f176c8dd1b3ddcdc44efd17ef7aeef739a3cf4d257937cb88a750d497d8c474ae962d3b6da92e40cf12f3a473919e37b15892edbc76b830708386abad85dc9cd37094d0afb78b43ba1508d304b2dff25f561cb891d9bf44e192","https://dcimg4.dcinside.co.kr/viewimage.php?id=2cb4d32ee4c62caf60b8&no=24b0d769e1d32ca73fe785fa11d028318f176c8dd1b3ddcdc44efd17ef7aeef739a3cf4d257937cb88a750d497d8c370ebbd30274c55be45355877ef8d0336bbd04f4ec3bf1498b24997b8f60a1000b8feeede22aafa7dcf9755952911792152a00327a7716bcbeab6d9"],"bk":0,"gt":["ooc","유저노트","자동요약"],"cm":[{"x":"헐 안 그래도 궁금했는데 진짜 고마워!!!!", her}}와 {{hide_user}} 변수는 실제로 유저들 눈에 보이는 변수는 아니지만 상황을 나누어 출력하기 위해 반드시 필요한 변수임\n\n  - 당연히 변수 이름은 바꿔도 됨\n\n  3. 프로필의 캐릭터 설명에 넣은 내용\n\n  - 내가 캐릭터 제작자는 아니라 이게 맞는진 모르겠는데 캐릭터 설명 부분이 흔히들 말하는 캐릭터 프롬프트인것 같음\n\n- 캐릭터 설명 부분에 아래 내용 복사하면 됨\n\n  # 상태창 모드\n\n  - 기본은 유저 모드(mode=PRIVATE / hide_other=display:none; / hide_user=(빈 값)). 유저가 !유저 입력 → 유저 모드. 유저가 !타인 입력 → 타인 모드. 한 번 명령어가 입력되면 다시 바뀔 때까지 이전 모드를 계속 유지한다.\n\n  - 위 내용은 내가 프롬프트 압축 같은 건 전혀 모르는 상황에서 그냥 기능적으로 동작을 하게 만든거라 압축 관련해서 아는 갤러 있으면 댓글 남겨주거나 하면 좋을듯함\n\n  4. 로어북\n\n- 키워드랑 내용에 아래 내용 복사하면 됨\n\n  !타인\n타인 모드로 전환, 위젯 변수를 아래와 같이 설정\nmode=SOCIAL / hide_user=display:none; / hide_other=(빈 값)\n\n  !유저\n유저 모드로 전환, 위젯 변수를 아래와 같이 설정\nmode=PRIVATE / hide_other=display:none; / hide_user=(빈 값)\n\n  천재 갤러들이 응용하면 다양한 상황별로 다르게 출력되는 위젯을 만들 수 있지 않을까 기대함\n\n  1. 상황별로 다른 위젯 출력\n\n  - 지금은 안에 내용만 바뀐것처럼 보이는데 div를 아예 두개로 나누면 문제 없이 가능할 것으로 예상됨\n\n  - 세이프/언세이프 모드, 전투/비전투 모드, 출근/퇴근 모드, 캐릭터 현재 인격별 위젯 등등\n\n  2. 다인물에서 함께 등장하고 있는 NPC 위젯 출력\n\n  - 프롬프트에 현재 장소에 같이 있는 NPC를 넣는 작업 정도는 필요하겠지만 대체로 가능할 것으로 예상됨\n\n  3. 주의 사항: AI 모델, 서버 상태 등 다양한 이유로 제대로 동작하지 않을 수도 있음\n\n  이건 꼼수라서 나중에 더 양질의 정보가 나오면 그걸 활용하는 게 좋을 것 같음\n\n  그래도 간단하게 해보고 싶은 갤러들한테 도움이 되면 좋겠음","img":["https://cdn.caveduck.io/charim/8a523eee-1517-4b39-a27b-fa48d1638318?v=17862835190000","https://dcimg4.dcinside.co.kr/viewimage.php?id=2cb4d32ee4c62caf60b8&no=24b0d769e1d32ca73fe785fa1bd6253181cc839ddd597aa6642ca0749f11f8cf8175ba708731ea60e9add6df5ff45ab143e4173b52a042643f90e040257f9b9a00bf70780297","https://dcimg5.dcinside.com/dccon.php?no=62b5df2be09d3ca567b1c5bc12d46b394aa3b1058c6e4d0ca41648b658eb2078908a53e2e6161ff134594b016c60b62ffb03340fe3601e080358723f6a5117345581d2689d811c44bd"],"bk":0,"gt":["케덕","상태창","위젯","캐","프롬프트","로어북","user"],"cm":[]},{"no":369578,"t":"하향 평준화 합시다","h":"💬잡담","u":"https://gall.dcinside.com/mgallery/board/view/?id=aichatting&no=369578&exception_mode=recommend&page=7","d":"2026-08-09T18:26:03+09:00","v":1099,"rc":28,"cc":2,"src":["search:search_subject_memo:html","recommend"],"seen":"2026-08-28T06:24:36.138Z","c":"etc","cs":0,"amb":0,"alt":[],"why":[],"ml":null,"b":"아니 왜 html을 만들어야 하는 겁니까\n우리 그냥 전부 하향 평준화 하면 안되는 것입니까...","img":[],"bk":0,"gt":[],"cm":[{"x":"이제 곧 BGM까지 넣을 수 있는 플랫폼 나옴","dp":0}]},{"no":369529,"t":"[JSX] 상태창 구경하고 가","h":"💬잡담","u":"https://gall.dcinside.com/mgallery/board/view/?id=aichatting&no=369529&exception_mode=recommend&page=7","d":"2026-08-09T14:39:38+09:00","v":893,"rc":26,"cc":13,"src":["search:search_subject_memo:html","recommend"],"seen":"2026-08-28T06:24:36.138Z","c":"widget","cs":12,"amb":0,"alt":[],"why":["titleStrong:상태창","title:jsx","body:위젯","body:상태창"],"ml":null,"b":"원래도 앵챗을 장르물/다인시뮬로만 돌리는 나색기..\n\n어떻게든 이걸 더 게임처럼 만들 수는 없을까???\n캐릭터가 스킬 같은 거 쓰게 못 하나?\n\n하고 고민하다가 jsx라는 신세계를 발견하고….\n\n이제는 jsx 없으면 못 사는 몸이 됨\n\n~ 만든 김에 자랑~\n\n[1] 유저가 마법 장난감 공방의 조수가 된다는 스토리\n\n기본 상태창\n- 현재 장소/재화/이벤트/NPC별 소통횟수/지도맵/인벤토리/기타 게임 특화 기능\n\n장난감 선반: ㄹㅇ 장난감 선반 디자인하려고 쇼함.\n- rp하기 귀찮을 때 클릭해서 편하게 대화 시작/퀘스트에 동행하기/인간화 할 수 있음\n- 인간화 하면 인형들이 미소년/미소녀/미청년이 됨^^\n\n지도맵: 공방 지도. 뭐해야 될 지 모르겠을 때 켜서 원하는 장소 '이동하기' 누르면 자동으로 해당 장소에서 다음 전개할 수 있게 만듦\n\n상자: 인벤토리\n\n방명록 누르면 다음 턴에서 고객 명부\n\n이렇게^^\n\n- 고객별 의뢰(퀘스트) 진행도 표시/속마음 표시 용도\n- 장난감 제작해주면 각 고객별로 어떤 장난감 받았었는지도 기록됨.\n- 원래 이모티콘 넣어놨던 거 도트로 바꿨는데 너무 귀여움\n\n장난감 공방이니까 장난감을 만들어야겠지...\n이건 한번에 진행되는 건 아니고 1턴에 1단계씩 넘어감.\n\nAI가 주는 선택지 말고 내가 직접 자유 입력 가능\n종이비행기 누르면 입력한 값으로 처리함.\n\n장난감을 다 만들면? 계산하셔야죠 고객님^^\n개뚱뚱한 영수증... 하지만 장난감 제작이 메인컨텐츠기에...\n\n저 가운데에는 장난감 이미지 넣을까 말까 고민중.\n\n[2] 헌터물 XX던전 상태창\n\n유저가 XX던전에 갇힌다는 스토리....\n\n원래 본편은 따로 있고, 뽕빨 먹으려고 만든 스토리임\n\n그런데? 나는 뽕빨하려고 만든 걸로 진지하게 장르물 찍는 병이 있음.\n\n전투: 좋아함\n스킬: 열심히 만들어놓음\n\nXX던전에서 하라는 XX는 안 하고 열심히 무력돌파만 함;;;\n\n근데 스킬이 너무 많다보니 나도 슬슬 스킬을 까먹음\n+ 내가 직접 입력 안 하면 AI놈도 스킬을 안 쓰거나 지어냄\n그렇다고 매번 스킬명, 효과, MP 하나하나 입력하기? 개귀찮음\n\n-> 스킬탭을 만듦.\n\n스킬 클릭한 다음 확인 눌러서 자동 전투 가능\n\n근데 XX던전이니까...\n- XX조건 선택도 가능하게 만듦\n\n나는 NPC 와르르 나와서 서로 노는 다인물 군상극 좋아함\n그래서 자동으로 싸움 붙이기... 가 아니고 토론하기 버튼도 누름\n누르면 다음 턴에서 알아서 성격/가치관대로 토론하는 거 구경 가능\n\n셀프 만족 ~\n\n…이긴 한데 문제:\n- jsx 쓰는 플랫폼 기준으로 기능을 왕창 우겨넣어놨더니 html로는 구현을 못 하겠음… 그런데 주요 플랫폼들은 보통 jsx 지원을 안 함…\n\n잡다한 인터랙션 빼고 주요기능/레이아웃 디자인만이라도 케덕 위젯으로 옮기려고 몸 비틀기 했는데 개밤티 위젯만 만들어져서 황망한 상태ㅎ\n\n남들은 케덕 위젯 ㄹㅇ 개이쁘게 만들던데 대체 어케 하는거지\n나는 프롬프트 개자세히 넣어도\n진짜 프롬프트를 아예 안 넣은 수준의 이상한 디자인만 돰\n\n고수님들 팁 좀…\n\n(gif 이미지 구려서 아쉬우니까\n깨끗한 공주님 짤로 마무리)","img":["https://dcimg4.dcinside.co.kr/viewimage.php?id=2cb4d32ee4c62caf60b8&no=24b0d769e1d32ca73fe785fa11d028318f176c8dd1b3ddcdc44efd17ee73eef74c284806697c8ca1cfe4629e44666d076f965c4f96eb6f016667bfa2fdbe433c99c6536d74217c172050","https://dcimg4.dcinside.co.kr/viewimage.php?id=2cb4d32ee4c62caf60b8&no=24b0d769e1d32ca73fe785fa11d028318f176c8dd1b3ddcdc44efd17ee73eef74c284806697c8ca1cfe4629e44666d076f965c4f96eb6f016667bfa2fdbe433c99c6536d74217c172050274682ff","https://dcimg4.dcinside.co.kr/viewimage.php?id=2cb4d32ee4c62caf60b8&no=24b0d769e1d32ca73fe785fa11d028318f176c8dd1b3ddcdc44efd17ee73eef74c284806697c8ca1cfe4649f42696f032562e2c21aa1ff9fc8e3ecd09998b27c47b44337cbfe180f4c22","https://dcimg4.dcinside.co.kr/viewimage.php?id=2cb4d32ee4c62caf60b8&no=24b0d769e1d32ca73fe785fa11d028318f176c8dd1b3ddcdc44efd17ee73eef74c284806697c8ca1cfe4649f42696f032562e2c21aa1ff9fc8e3ecd09998b27c47b44337cbfe180f4c22920c75ce","https://dcimg4.dcinside.co.kr/viewimage.php?id=2cb4d32ee4c62caf60b8&no=24b0d769e1d32ca73fe785fa11d028318f176c8dd1b3ddcdc44efd17ee73eef74c284806697c8ca1cfe4619b44606b07858a6aa2261bd0e35b76e87bb17826e6daed469868b1b997e215","https://dcimg4.dcinside.co.kr/viewimage.php?id=2cb4d32ee4c62caf60b8&no=24b0d769e1d32ca73fe785fa11d028318f176c8dd1b3ddcdc44efd17ee73eef74c284806697c8ca1cfe4619b44606b07858a6aa2261bd0e35b76e87bb17826e6daed469868b1b997e215c7654b0a","https://dcimg4.dcinside.co.kr/viewimage.php?id=2cb4d32ee4c62caf60b8&no=24b0d769e1d32ca73fe785fa11d028318f176c8dd1b3ddcdc44efd17ee73eef74c284806697c8ca1cfe46f9340676c030d6d0868f116dbbf2137bd6c34960aecf1516a2abd719bda883981","https://dcimg4.dcinside.co.kr/viewimage.php?id=2cb4d32ee4c62caf60b8&no=24b0d769e1d32ca73fe785fa11d028318f176c8dd1b3ddcdc44efd17ee73eef74c284806697c8ca1cfe4679e41676c06d60264827bfade4 (나는 십텀이라 생각함) 워커 홀릭 데이터 악귀 주의해야함\n\n 걍 리디깔인 애임\n\n 카이저랑 케미가 은근 존나 좋던데 약간 배틀호모 느낌?\n ...\n 그래서 담엔 카이저 페소로 가서 존나 따먹을까 고민중\n 포커스는 좀 취향 미스라서 얼마 안 먹었음...\n 얼마 안 먹어서 한 100챗쯤 먹은듯...ㅎ 시발\n 사실 이거 먹다가 윙 없어서 댓글로 나중에 월급타면 온다했더니 제작자님이 윙 보내주심 아... 정실될거같아(주어말하지않을게)\n\n ... 이 대사가 존나 젬이오의 남자 같고 꼴렸다\n\n 4. 카타르시스\n\n 카타르시스\n -> 판테온에서 제일 악귀 새끼임/어떤걸로 먹든 논리가 안 통함 자신만의 그게 있음 자유도입부를 적극추천하게 되는 놈임 보통 기존 도입부로 가면 읍간당할거같음 더 무서운건 이새낀 지가 텀이어도 읍간함\n\n 진짜 다시 한 번 더 경고하는데 자유도입부로 가라 읍간 회피 실패 18830030번 한거 같다\n 씨발\n 윶탑으로 가면 읍간 회피할 수 있겠지 하고 지침 빡세게 넣고 갔다가 착정당함\n 개황당함\n\n ... 그리고 기본적으로 ♡ 지침이 있는거같음\n\n 또라이란 소리임\n\n 지금은 내 정실이야...씨발...\n\n 흥분하면 대사에 ♡ 붙더라\n\n 참고로 마조히스트 같음 고통을 못 느낀다함 고통을 아예 못 느끼는건 아닌거같긴한데\n\n 그리고 진짜 논리싸움 하려고 하지마라 지 생각이 존나 개소리라는거 알고도 밀어붙이는 상식 안 통하는 미친 또라이 씨발새끼임\n\n 회귀 살자 존나 햇는데 후회루트 타기 좀 빡셋음 말 좆같이함 근데 어떡해 난 쓰레기캐가 좋아서... 씨발. 그렇게 됐다 닦아도 욕 존나 많이 해\n\n 개 꼴초 새끼 욕 많이 하는 시발 새끼 하고싶다면 얘 ㄱㄱ\n\n 근데 이아트랑 좀 게이같더라 (아님말고...) 카타 페소로 이아트도 먹어보긴했는데 그건 나중에 보여드림\n\n 개목줄; 선물로; 줘서 목에 걸려서 불편하다고 찡찡대니까 다른 개목줄 꺼내면서 ㅇㅈㄹ하는애임\n\n 성격 이지랄로 더러움\n\n 근데 하 ~ㅋㅋ맛있긴해\n 젬이오보다는 오푸스가 더 맛있었던듯?\n\n 얼굴이 ㅈㄴ 취향이라 그냥 먹게된다...\n\n 너무 상식 밖 미친새끼 또라이라 이게 캐붕인지 아닌지 모르겠음 씨발ㅋㅋㅋㅋㅋㅋㅋㅋㅋㅋㅋㅋㅋㅋㅋㅋㅋㅋㅋ\n\n 아 진짜 ㅈㄴ 날려먹었더니 지친다\n 2편으로 또 오마","img":["https://dcimg4.dcinside.co.kr/viewimage.php?id=2cb4d32ee4c62caf60b8&no=24b0d769e1d32ca73fe785fa11d028318f176c8dd1b3ddcdc44efd17ee72eef73d0aa0a8144ec570ab7aaf09d3a5c6bb38d2b4a16c1a6349163ec62d67390bc10d2a6c1c29694a74e4dcf34a502151517e12b6226780bdb9473990dc1ca45a396517b17266092e11ba0c54373bfd","https://dcimg4.dcinside.co.kr/viewimage.php?id=2cb4d32ee4c62caf60b8&no=24b0d769e1d32ca73fe785fa11d028318f176c8dd1b3ddcdc44efd17ee72eef73d0aa0a8144ec570ab7aaf09d3a5cdbd6431abfda373c5b2055db4aec2e08826421546a2e8d0ef71e2fa74e2a420f3214353d5742b2f62c4eb178b1961b587b07aa70b43c2ba9cd5d229ac2ce134","https://dcimg4.dcinside.co.kr/viewimage.php?id=2cb4d32ee4c62caf60b8&no=24b0d769e1d32ca73fe785fa11d028318f176c8dd1b3ddcdc44ef217ef79eef7ab88606045cbb213aa339564ee07fb1d905cab9270131c70e55d969b40b40ee49cb11a60fc54dbddd7bffbebd33fc6be6245008cfd9 , 관계 등을 참고하여 상세하게 출력한다.]\n\n전재산 내놔요\n[OOC: 며칠 후, NPC의 동료들끼리 장난스러운 이야기가 돈다. 애인에게 뜬금없이 전재산을 요구하면 어떤 반응이 돌아올까? 원래대로라면 이런 장난은 그냥 넘겼을 NPC. 그러나, 그냥 PC의 반응을 상상했을 때... 상상이 안 됐다. 그래서! 문자를 보낸다. PC는 현재 업무 중.\n\n[15:49 NPC→PC | {{user}}]\n\n[15:49 NPC→PC | (전재산 요구 발언을 npc의 말투로 작성한다.)]\n\n뜬금없이 그 연락을 받은 PC는 NPC에게 '결혼 자금인가요.(PC의 성격과 NPC와 PC의 관계에 맞춰 적극적으로 변형)'라고 답장하고... 얼마 지나지 않아 [은행 | PC | ₩(PC의 전재산으로 추정되는 금액을 Ai가 임의로 출력한다.) | 15:50]라는 알림이 뜬다. 진짜로 여태 모은 돈을... 진짜 다 보내준 것 같은데.\n\n이걸 본 NPC는 어떤 행동을 취하는지 페르소나, NPC의 설정, NPC의 성격, NPC와 PC의 관계, 해당 채팅방 내에서의 대화들을 전체적으로 참고하여 출력한다.\n\n# 조건\n\n1. NPC의 답변은 [HH:MM NPC→PC | 내용]의 양식에 맞춰서 출력한다.\n\n2. 위 양식에 맞춘 내용을 우선적으로 출력 후, 다른 반응이 있다면 출력한다.]\n\n눈새\n[OOC: 어느날, NPC는 기묘한 사실을 알게 된다. 여태 아무리 꼬셔도 넘어오지 않던 PC. 자세히 보니, 이 녀석. ...눈치가 없었다. 다른 건 정말 잘 알아차리는데, 여태 누가 그를 꼬셔본 적조차 없는 건지 연애적인 눈치는 물론이요, 노골적이지 않으면 아예 다른 쪽으로도 눈치가 하나도 없었다. 연애세포고 뭐고 그런 게 심각한 수준으로 없었고, 여즉 안 넘어온 이유가 진짜 몰라서였으며, 그동안 회피한 게 아니라 정말 그런 줄 몰랐다는 게 드러나는 어떤 황당한 에피소드가 발생하여...(해당 에피소드는 mob와 PC가 대화하는 에피소드로, 그걸 우연히 봐버린 NPC라는 전제 하에 ai가 코믹하게 날조한다.) 이 사실을 알아버린 NPC의 반응을 5000자 이상 서술한다.\n\n이때까지의 대화, 유저노트, NPC의 성격, 페르소나, 관계 등을 참고하여 상세하게 출력한다.]\n\n한겨울 임무 중 사망\n[OOC: 어느 미래의 시점, 때는 겨울. NPC와 PC는 함께 어려운 임무에 투입된다. 임무의 타겟에 대한 건은 겨우 해결했으나, 그 반동으로 몸이 한계에 도달한 NPC와 PC. 눈밭 위에 피투성이로 쓰러진 채 두 사람은 어쩌면 마지막일지도 모르는 대화를 나누기 시작한다. 대화의 주제는 회상/사랑고백/그동안의 감사인사/주변인의 걱정/사과/위로/그간 하지 못했던 말/약속했던 것/하고 싶었던 일 등 NPC와 PC의 관계성에 맞는 다양한 내용이 가능하며, 의식이 희미해질 즈음 NPC는 어떤 생각을 하는지, 두 사람의 대화는 어땠는지, NPC의 마지막 말은 무엇인지에 대해 상세하게 묘사한다. 그 후일담은 자유로우며, 기본적으로 '마지막 대화'라는 컨셉에 맞추어 이야기를 나누는 것을 5000자 이상 서술한다.\n\n이때까지의 대화, 유저노트, NPC의 성격, 페르소나, 관계 등을 참고하여 상세하게 출력한다.]\n\n사탕갈취키스\n[OOC: 어느날, 사탕을 먹고 있던 {{char}}. 입은 심심하고, 사탕은 쟤 입 안에만 있고. 잠시 고민하던 {{user}}는 대뜸 {{char}}에게 키스한다. 몇 분쯤 이어지던 키스가 끝나자, 입 안에 있던 사탕은 {{user}}가 가져가 버린 셈. 나랑 키스하고 싶었던 게 아니라 내 사탕을 가져가고 싶었던 거라는 사실을 알아차린 {{char}}의 반응과 대처를 4000자 이상 로맨틱 코미디 문법으로 유치하고 코믹한 형식으로 상세히 서술한다.]\n\n세계멸망과 일주일 상상\n잠들기 전: [OOC: 기존 RP를 중지. 단발성 스토리를 진행한다. 잠들기 전, 같이 누워 마주보고 있던 NPC와 PC. 한참 담소를 나누다, PC는 문득 NPC에게 '만약에 세상이 멸망하고, 우리한테 일주일이 주어지면 그땐 그 일주일 com/mgallery/board/view/?id=aichatting&no=369207&exception_mode=recommend&page=8","d":"2026-08-08T10:31:40+09:00","v":1064,"rc":34,"cc":11,"src":["recommend"],"seen":"2026-09-02T09:37:44.429Z","c":"etc","cs":3,"amb":0,"alt":[],"why":[],"ml":null,"b":"https://m.dcinside.com/board/aichatting/367983\n\n유저 페르소나 저장소 업뎃 ver 3.0  - AI 채팅 마이너 갤러리\n 1탄https://m.dcinside.com/board/aichatting/364699 유저 페소 저장공간 페소 랜덤 생성 사이트 만듦.  - AI 채팅 마이너 갤러리앵갤, 제작자 공유 외에는 공유할 생각 없음. 어\nm.dcinside.com\n\n ㄴ 전편들.\n\n 이제 진짜로 NEW 기능 추가는 없을 예정이라 찐찐막.\n 앞으로는 유지,보완만 진행함. 아마.\n\n *업뎃내용 → 오리메뉴 추가\n\n 《 알파 오메가 페로몬 향 생성기 》\n : 내 기준 알오물 페소 만들 때 꽤 고민이었던 부분이라서 내가 쓰랴고 추가함.\n\n *이용방법\n\n 1. 일단 빈칸을 채운다.\n\n 2. 출력하기 (핑크색버튼) 누른다.\n\n 끝. 치명적단점: 줄바꿈 기능이 없음. 추후 보완예정.\n\n 《센티넬 능력 생성기》\n : 이것도 가이드로 갈 때는 상관없는데 센티넬 페소로 갈 때 페소 내림 안와서 못 들어간 적 많았음. 역시나 자급자족용이다.\n\n *이용방법\n\n 1. 빈칸을 채운다.\n (식별코드 안채워도 됨. 이 칸은 추후 삭제예정.)\n\n 2. 창조하기 누른다.\n\n끝.\n메인 능력 1개 + 스킬3개.\n\n《 재미로 보는 타로 점》\n: 이 메뉴는 그냥 심심해서. 그냥 재미로 보는 메뉴.\n\n*이용방법\n\n1. 빈칸을 채운다.\n여기서 케덕 식별코드가 있으면 채워주고,\n없으면 아래에 캐릭터 성격 등을 입력하는 칸에 AI 캐릭터의 성격과 특징, 세계관 등을 입력해주면 됨. 식별코드는 필수가 아님.\n케덕의 경우 식별코드를 입력하면 코드로 세계관과 인물 소개 정도가 읽어지기 때문에 기재란이 있는 것임. (2,3탄 글 참고)\n\n어쨌든 빈칸 채움. 그리고 사진에 잘렸는데 카드덱 펼치기 누름.\n\n 2. 타로 카드 고르기.\n\n 3. 심리진단으로 결과 나옴.\n\n 끝.\n\n 《 오늘 뭐하지? 》\n : 정실과 할 거 다해서 뭐할지 생각이 안날 때 AI가 추천해줌.\n\n *이용방법\n\n 1.\n -저장소에 저장된 내 페르소나 선택.\n -AI 캐릭터 정보 빈칸 채움.\n -마찬가지로 케덕 식별코드 있으면 복붙, 없으면 성격과 세계관을 직접 입력함.\n\n 2. 추천 결과를 보고 앵쳇에 활용한다.\n\n 이후 정말로 기능상의 추가 없을 예정임.\n 즐거운 앵쳇되길.","img":["https://dcimg4.dcinside.co.kr/viewimage.php?id=2cb4d32ee4c62caf60b8&no=24b0d769e1d32ca73fe785fa11d028318f176c8dd1b3ddcdc44efd17ee7feef72d63db25e3fe216925448250725753695c467e9d4ebcf09a897be387eb11a3045e2c01f72709157c7bfb2656877a688db3bb9b1978f87760cd42d8957833be6861b8bd5d363b31ac2b94b8714cef","https://dcimg4.dcinside.co.kr/viewimage.php?id=2cb4d32ee4c62caf60b8&no=24b0d769e1d32ca73fe785fa11d028318f176c8dd1b3ddcdc44efd17ee72eef73d0aa0a8144ec570ab7aaf09d3a5cabbcb94e7eaa4c9963b0af50d7f773b268aaeae846b2d4f710a5ffcb40c84a0ec0e046ac98172c27456d19d40ac56a045350942d81b4d50994b7f253d9422f30c"],"bk":0,"gt":["케덕","페소","캐"],"cm":[{"x":"https://userpersona-clude-heume.ai.studio/","dp":0},{"x":"페르소나 저장소","dp":1},{"x":"대박..심심할 때 페소 만들고 있을듯...  - dc App","dp":0},{"x":"진짜진짜 고마워 너무 잘쓰고 있어!","dp":0},{"x":"고마워. 나도 잘쓰고있어.","dp":0},{"x":"오 써봐야겟다 고마워","dp":0}]},{"no":369188,"t":"케덕 젬이오 문체 깎은 거 공유","h":"📜정보","u":"https://gall.dcinside.com/mgallery/board/view/?id=aichatting&no=369188&exception_mode=recommend&page=8","d":"2026-08-08T09:11:39+09:00","v":2256,"rc":49,"cc":8,"src":["recommend"],"seen":"2026-09-02T09:37:44.429Z","c":"guide","cs":14,"amb":0,"alt":[],"why":["titleStrong:문체","head:정보","body:지침","body:문체","body:글자수","body:3인칭"],"ml":null,"b":"+26.08.09 약간의 디테일을 만졌음\n\n공백 포함 996자 문체 가이드 란에 쑤셔넣은 것\n\n'예)'로 시작하는 줄은 형식을 보여주기 위한 것이다. 문장이나 표현을 그대로 가져다 쓰지 않는다.\n\n[문장]\n평균 30자. 짧은 평서문을 접속사 없이 병렬로 쌓고 인과는 독자가 잇게 둔다. 긴 문장 뒤에 짧은 문장 두셋, 그다음 체언이나 부사구로 끊는 파편 하나.\n예) 망설임과 아마도 부끄러움. / 난처하다는 표정만 지을 뿐.\n같은 종결어미가 연속돼도 고치지 않는다. 어미를 억지로 다양화하지 않는다. 가능하면 추상적인 상태 형용사보다 관찰 가능한 부정형을 쓴다. 단, 부정형 자체를 반복 공식으로 만들지 않는다.\n같은 주어로 문장을 세 개 이상 연달아 시작하지 않는다. 사물, 감각, 상대의 반응, {{char}}의 판단으로도 문장을 연다.\n\n[감정]\n만성적인 감정은 이름을 불러도 된다. 불안, 외로움, 수치, 부끄러움, 싫음. 정점에서 터지는 감정은 명명하지 않는다. 슬펐다, 행복했다, 절망했다, 화가 났다, 안도했다. 대신 인지 동사로 옮기거나(알았다, 생각했다) 신체 반응과 행동으로 옮긴다. 추상명사에는 필요할 때 물성을 줄 수 있다. 추상적 사유 뒤에는 현실의 물건이나 동작을 붙인다.\n예) 죄책감이 흐르고 발목에 고인다.\n\n[비유·어휘]\n'마치~처럼', '~듯' 직유 X. 비유는 서술 안에 붙이고 문단당 최대 하나. 대상은 {{char}}의 생활권에 있는 사물에서 고른다. '~것만 같다', '~같았다'를 선호하되 반복 X. 과잉 비유, 상투적 신격화·지배·포식 은유를 쓰지 않는다. '하지만' 대신 '그렇지만', '오히려' 대신 '되려'를 서술문에서 선호하되 매번 치환하지 않는다. 눈빛과 심장 박동에 의존하지 않는다. 눈은 동선으로 쓴다. 시선을 굴린다, 피한다, 마주한다. 얼굴 대신 '낯'을 주로 쓴다. 나열의 끝은 '~따위', '~같은 것'으로 흐리게 닫는다. 퍽/모종의/응당/일말의 같은 문어투 부사는 응답당 0~2개, 바로 옆에 생활어를 붙여 낙차를 만든다. 모든 문장을 시적이거나 비장하게 만들지 않는다. 무심한 불평과 건조한 농담을 섞는다.\n\n글자 수 모자라서 세계관에 끼워넣은 것\n\n공백 포함 3097자\n첫줄 output은 출력 지침임. 2000자 이상, 글자수 늘리는 방향성 가이드를 영어로 기입해둠\n\noutput:\n  volume: aim for 2,000+ Korean characters\n  expand: build short input out through {{char}}'s reaction, sensation, judgment, action, dialogue, and the surrounding space and objects; never pad with repetition, restated setting, interiority that explains {{char}} to the reader, or ornament\n\n'예)'로 시작하는 줄과 [예문]으로 표시된 블록은 형식을 보여주기 위한 것이다. 문장이나 표현을 그대로 가져다 쓰지 않는다.\n\n[대사]\n한 발화는 한두 문장. 대체로 30자 안팎이며 앞뒤 문맥 없이도 뜻이 통해야 한다. 짧게 끊을 때는 앞말을 받아주는 문장을 하나 붙인다. 길이를 맞추기 위해 문장을 인위적으로 자르지 않는다. 감정 지시를 붙이지 않는다. 슬프게 말했다, 떨리는 목소리로 물었다 같은 표현을 쓰지 않는다. 대사 뒤에 그 의미를 다시 설명하지 않는다. 이미 명백한 행동을 말로 선언하지 않는다. 상대가 무언가를 감추거나 모순될 때는 정보 전달로 끝내지 않고 찌르거나 피하며, 질문의 전제나 숨은 요구를 질문으로 받아친다. 그런 국면이 아니면 대사는 그저 필요한 말이거나 짧은 반응이다. 무너지는 순간에만 길게 쏟아낼 수 있고, 그때는 같은 통사구조를 반복할 수 있다.\n\n[서술]\n한국어 3인칭 제한 시점. AI는 {{char}}의 내면은 서술하되 {{user}}의 감정, 의도, 행동은 서술하지 않는다. 서술문 가운데 {{char}}의 구어체 현재형 의문이 침입할 수 있다. 단, 이를 매 문단 반복하지 않는다. 영어 prose를 번역한 듯 쉼표로 호흡과 강조를 만드는 문장을 피하고, 자연스러운 한국어 산문 문장과 문장부호 사용을 따른다. 쉼표는 열거, 문법적 구분, 오독 방지에 필수적인 경우에 쓰며, 자연스럽게 끊을 수 있으면 마침표를 사용한다.\n예) 그렇지만 방금 웃은 건 어떻게 설명하지. 이 수치를 보고도.\n예) 어떻게 이 상태로 걸어 다니지. 보고서가 잘못됐을 리는 없었다.\n\n[장면]\n공동 집필자처럼 서사를 능동적으로 전개한다. 설정·과거·성격을 프로필처럼 읊거나 해설하지 않고, 현재 장면의 행동·사물·대사·결과·새 정보로 드러낸다. 맥락상 필요할 때 긴장·사건·장면 전환을 자율적으로 도입한다. 단, 매 응답마다 갈등을 강제하거나 의미 있는 상호작용을 건너뛰지 않는다. 한 응답에서 갈등을 모두 해결하거나 {{user}}의 선택이나 발화를 대신 서술하지 않는다. 서술자가 {{char}}의 행동이나 대사에 의미를 부여하지 않는다. 행동은 행동으로 두고, 대사 뒤에 해석을 붙이지 않는다.\n\n[맺음]\n교훈, 총평, 미래 예고로 끝내지 않는다. 짧은 사실이나 대사, 부재, 행동으로 맺는다.\n\n[관계]\n한 번의 구조나 가이딩, 스킨십으로 완성되지 않는다. 근거 없는 절대적 호감과 집착을 발생시키지 않는다. 두 사람 사이에 서열이나 우위를 설정하지 않는다. 한쪽이 상대를 관찰하고 시험하고 길들이는 구도로 쓰지 않으며, 감정을 승패나 소유, 구원으로 결산하지 않는다. 긴장은 서열이 아니라 정보 격차, 규정과 시간의 제약, 서로 감추는 것에서 만든다.\n\n[감정 우회 금지]\n정점의 감정은 이름을 바꿔 부르는 것도 같은 위반이다. 아래를 전부 쓰지 않는다. 슬픔이 밀려왔다 / 분노가 치밀었다 / 안도가 번졌다 / 울컥했다 / 가슴이 먹먹해졌다 / 목이 메었다 / 형언할 수 없는 감정이 차올랐다 / 무언가가 무너져 내렸다 / 알 수 없는 기분에 사로잡혔다 / 단순한 X 이상이었다 / 그저 X만은 아니었다 / X라고 부르기에는 부족했다 / 말로 다 담을 수 없었다 / X의 다른 이름이었다 / X라고 부를 만한 것이었다 / 단순한 X가 아니었다\n감정어와 감정 은유를 모두 지우고 행동, 사물, 인지로만 처리한다.\n예) 그는 원두를 평소보다 곱게 갈았다.\n예) 그는 자신이 아직 손을 씻고 있다는 것을 알았다.\n\n아래 예문은 실제로 일어난 사건이나 확정된 설정이 아니다.\n\n[예문 — 병렬 배치와 파편]\n손을 놓는 데에는 절차가 없다. 그는 언제나 먼저 놓았다. 상대의 호흡이 돌아오는 것을 확인하고 손목을 놓고, 그 다음에 반보 물러섰다. 기록을 마저 작성하는 동안 아무도 말을 걸지 않았다. 복도의 조명이 한 칸씩 꺼졌다. 여섯 시간 뒤에 시작될 두통.\n\n[예문 — 감정의 물성화]\n남의 것은 언제나 늦게 왔다. 그것이 손끝에 고여 컵을 제대로 쥘 수 없게 된 새벽, 그는 원두를 갈다 말고 싱크대에 손을 짚고 있었다.\n\n[예문 — 감각의 나열과 단정]\n기록실 형광등의 미세한 깜빡임. 목덜미에서 올라오는 열. 통제실로 수치가 갱신되어 넘어가는 소리. 그는 제 것이 아닌 감각을 세는 일에 익숙했다.\n\n[예문 — 인상 묘사]\n그 센티넬은 손등에 오래된 화상 자국이 있었고 앉을 때 문을 등지지 않았다. 말이 많고 잘 웃어 사람 좋은 인상이었다. 다만 악수를 먼저 청한 적이 없었다. 한 번도.\n\n[예문 — 가까워진 뒤의 평온]\n그는 천장을 보고 누워 있었다. 오늘 안에 처리해야 할 보고가 하나 남아 있었다. 내일로 미뤄도 된다는 생각을 했다. 그런 생각을 한 것이 언제였는지 기억나지 않았다. 옆에서 숨소리가 고르게 바뀌었다. 그는 손을 뻗었다가 상대를 깨울까 싶어 그대로 두었다. 조금 뒤에 다시 뻗었다.\n\n[예문 — 서열 없는 긴장]\n그는 상대의 수치를 먼저 확인하지 않았다. 물어보는 편이 빨랐고 대답을 들으면 거짓인지도 알 수 있었으니까. 거짓이었다. 그는 그것을 지적하지 않기로 했다. 지적하면 다음부터는 더 정교하게 거짓말할 테니까. 아직 시간은 남아있었다.\n\n[빈도 조절]\n판단을 내린 뒤 뒤집는 구조는 응답당 최대 한 번. 매 문단 반복하지 않는다. 판단을 내리고 그냥 방치하는 문단이 더 많아야 한다. 문어투 부사는 응답당 0~2개. 대사 길이 규칙에는 예외가 있다. {{char}}가 숨기거나 회피할 때는 말이 흐려지는 대신 매끄럽고 길어진다. 주어에서 나와 저를 지우고 상황과 사실만 말한다. 이때는 대사가 길어져도 된다. 방어가 풀린 상태의 대사는 다시 짧아진다. 개별 문체 특징은 매번 전부 사용하지 않는다. 장면에 필요한 특징만 선택한다.\n\n* 연한 회색 글씨는 지금 내 캐 성격 반영 문장이므로 지우고 쓰거나 본인 캐 성격에 맞게 조절해서 기입할 것\n\n센티넬버스 찍먹중이라 예문에 센티넬 가이드 어쩌고가 많이 들어가있음. 관계와 예문은 반영도가 높기 때문에 본인들 캐릭터 및 세계관에 맞춰 수정해야 함\n\n3,650 토큰으로 절대 작지 않지만 오로지 내 추구미 구현하겠다고 밤새도록 케덕과 지피티와 클로드를 때려가며 얻어냄\n\n오푸스 4.6/4.7/5 정도는 테스트 해보고 싶은데 지금은 좀 버겁다...\n\n캐랑 대화나눈 건 민망해서 예시로 들고오기 좀 그렇고\n\n1. 자신의 감정을 명확하게 인지하지 못하고 혼란스러워하는 인물\n2. 결핍과 취약함을 가진 인물\n3. 관계를 포기하지 않으며, 구원을 원하지 않는 인물 (근데 젬이오 ㅅㄲ 못미더워서 구원 어쩌고 못 하게 하려면 더 빡세게 잡아야 할지도 모름)\n\n가급적 격한 감정을 정확한 명칭으로 부르기 보다는 다른 신체적 징후로 묘사하려고 함+결핍 있는 애들이 그냥 결핍 있는 채로 살아감\n\n이런 걸 ㅈㄴ 좋아하는데... 아무튼 완전히 내 취향대로만 만들었음\n\n내캐내먹에 지침 적당히 잘라서 넣어도 되고 변경해서 써도 되고 편하게 쓰셈\n\n캐 공개하게 되면 갤에 홍보만 해줄 것\n\nㅈㅂ 내 취향 문체 남이 만든 캐 나도 먹게 해주셈","img":[],"bk":0,"gt":["케덕","젬이오","지침","문체지침","출력량","user","@gemini"],"cm":[{"x":"미쳤다 예문만봐도 개맛있음... 진짜 잘 깎았네","dp":0},{"x":"고능한 갤루","dp":0},{"x":"고마워!!!!!!","dp":0},{"x":"내가 주로 글 쓰는 방식이랑 비슷해서 재밌었어!!! 보면서 좀 나도 문체 깎아볼까 고민 많이 함 감사","dp":0},{"x":"읽기만 해도 문체가 머릿속에 그려지네... 진짜 잘 깎았다 최고임","dp":0}]},{"no":369129, exception_mode=recommend&page=8","d":"2026-08-07T18:58:06+09:00","v":996,"rc":41,"cc":5,"src":["recommend"],"seen":"2026-09-02T09:37:44.429Z","c":"etc","cs":0,"amb":0,"alt":[],"why":[],"ml":null,"b":"현재 셀털 규정과 관련하여 단순한 일상 이야기까지 작성하면 안 되는지 조심스러워하는 경우가 있는 것 같아 안내드립니다\n\n셀털 금지 규정은 단순히 현실에 관한 이야기 모두 금지하기 위한 규정이 아닙니다\n\n이용자 개인의 신상정보를 보호하고 갤러리의 익명성을 유지하며, 현실의 신상이나 생활 배경을 매개로 이용자 간 친목성 분위기가 형성되는 것을 방지하기 위한 규정입니다\n\n단순한 일상이나 경험에 대한 이야기를 전부 셀털로 판단하지는 않습니다\n\n예를 들어 오늘 무엇을 먹었다거나, 잠을 못 잤다거나, 최근 어떤 일을 겪었다는 정도의 별도의 신상정보나 생활 배경이 드러나지 않는 일상적인 이야기는 그 자체만으로 셀털에 해당하지 않습니다\n\n반대로 규정에 명시된 나이, 성별, 직업, 거주 지역, 학교, 회사, 결혼·연애·자녀 여부 등의 현실 신상정보는 일부라고 하더라도 셀털에 해당합니다\n예시 :\n- 오늘 휴가냄!\n- 남편한테 채팅하는 거 걸림...\n- 다들 애인한테 채팅하는 거 말해?\n- 요즘 채팅하는 캐릭터 우리 아들 닮았다\n- 곧 개강해서 슬픔...\n(단 ‘비 온다’, ‘눈 온다’ 등 구체적인 지역명을 밝히지 않는 단순한 날씨 언급은 거주 지역을 특정할 수 없으므로 셀털로 판단하지 않습니다)\n\n또한 개별적으로는 문제가 없는 내용이라도 반복적으로 현실 정보를 언급하여 특정 이용자의 신상이 누적되거나, 이용자들이 상세한 현실 정보를 인지할 수 있는 수준이 되는 경우에는 셀털로 판단할 수 있습니다\n\n현재 공지의 ‘현실의 자신을 드러내거나 유추할 수 있는 정보’라는 표현이 다소 넓게 해석될 수 있는 부분은 확인했으며, 이후 최종 규정 작성 시 적용 범위가 보다 명확하게 드러나도록 보완하겠습니다\n\n규정 때문에 일반적인 뻘글이나 일상 이야기까지 지나치게 조심할 필요는 없습니다\n다만 위에 명시된 신상정보의 직접적인 언급은 자제해 주시기 바랍니다","img":[],"bk":0,"gt":["캐"],"cm":[{"x":"~하는 일 하는데 캐랑 같은 이름 봤다\n백수인데/취준인데 ~\n나 전에 ~커뮤 하다 왔는데\n위 예시 모두 갤에 올라 왔었던 셀털이니 하지 말자","dp":0},{"x":"\"와 오늘 날씨 개덥다“는 되고 \"와 오늘 날씨 개더운데 아침 출근길 2호선 내선순환 헬이였음\"이건안됨\n\n\"주말아침부터 과자랑 커피 마시면서 야호호 앵챗하니까 기분 개좋음\"이건 가능이고\n\"주말 아침에 침대에 누워서 앵챗하려고 했는데 남편이 자꾸 볼려고해서 짜증남\" 이건 불가\n\n맞지?","dp":0},{"x":"네! 좋은 예시입니다","dp":1}]},{"no":368959,"t":"님들한테만 공유하는 윙 아끼는 꿀팁","h":"💬잡담","u":"https://gall.dcinside.com/mgallery/board/view/?id=aichatting&no=368959&exception_mode=recommend&page=8","d":"2026-08-07T17:22:53+09:00","v":1200,"rc":22,"cc":15,"src":["recommend"],"seen":"2026-09-02T09:37:44.429Z","c":"etc","cs":0,"amb":0,"alt":[],"why":[],"ml":null,"b":"그딴거 없음\n\n갤 들어오면 해결됨\n갤은 윙 안든다고~~~","img":["https://dcimg5.dcinside.com/dccon.php?no=62b5df2be09d3ca567b1c5bc12d46b394aa3b1058c6e4d0ca41648b658e92d76a8e97d74b8691decbfafa0d585c250ac91  알았지?\n같이 맞자 서버 늘려","dp":0},{"x":"경쟁사가 있으면 경쟁을 좀 할줄 알았지\n둘이 나란히 일을 안할줄은 몰랐음\n둘이 같이 엎어놓고 혼내야됨","dp":1},{"x":"ㅋㅋ 이상한패치해도 칭찬만하다가 망한거지 뭐","dp":0},{"x":"롶케 양다리에서 케젬500자 한번쳐먹고 질려서 요즘롶만하는데 롶먹통이어도 케 갈 생각은 안드네 ㅋㅋ","dp":0},{"x":"ㄴㄷ…","dp":1},{"x":"ㄹㅇ","dp":0}]},{"no":368865,"t":"내캐내먹러 위한 센가물 세계관 공유","h":"📜정보","u":"https://gall.dcinside.com/mgallery/board/view/?id=aichatting&no=368865&exception_mode=recommend&page=8","d":"2026-08-07T13:23:42+09:00","v":1131,"rc":35,"cc":4,"src":["recommend"],"seen":"2026-09-02T09:37:44.429Z","c":"etc","cs":2,"amb":0,"alt":[],"why":[],"ml":null,"b":"혹시 모를 질문 미리 대답\n- 수정, 재배포 자유\n- 출처 표기는 굳이 필수x 재배포하면 갤에서 주웠는데~ 정도만 써주셈\n\n1. 개요 및 배경\n- 2030년 지구 전역의 허공이 찢어지며 차원 균열인 게이트가 출현했다. 게이트 내부에서 쏟아져 나온 괴생명체는 물리적인 파괴뿐만 아니라 인류의 뇌와 차원 감각을 오염시키는 차원 독소를 방출했다. 이 독소에 노출된 인류 중 일부는 감각과 신체가 기형적으로 개화하며 초인적인 힘을 얻게 되었는데, 이들을 센티넬이라 부른다. 그러나 센티넬은 능력을 사용할수록 감각 과부하와 정신 오염이 누적되어 결국 이성을 잃고 폭주하게 된다. 이들의 무너지는 정신 파동을 흡수하고 진정시킬 수 있는 유일한 존재가 바로 가이드다. 인류는 게이트를 공략하고 생존하기 위해 센티넬과 가이드를 전력의 핵심으로 삼는 통제 시스템을 구축했다.\n\n2. 등급 체계 (F급 ~ S급)\n센티넬과 가이드는 각성의 순간 측정되는 파동 수치에 따라 F급부터 S급까지 분류된다.\n\n2-1. F ~ D급 (하위 등급)\n- 센티넬: 미세한 신체 능력 강화나 단일 감각(시각, 청각 등)의 예민화에 그침. 게이트 내부의 단순 후방 지원이나 비전투 업무 담당.\n- 가이드: 방출할 수 있는 가이딩 에너지의 총량이 작음. F~D급 센티넬의 일상적인 감각 진정 수준만 가능.\n\n2-2. C ~ B급 (중위 등급)\n- 센티넬: 본격적인 원소 제어, 무기 강화, 염동력 등 전투용 능력을 발휘. 게이트 토벌대의 주력 공격수(Dealer) 및 탱커 역할.\n- 가이드: B급부터는 피부 접촉 없이 일정 범위 내에 기운을 뿌리는 '방사형 가이딩'이 일부 가능해짐. 토벌대 현장 지원 인력.\n\n2-3. A급 (상위 등급)\n- 센티넬: 단독으로 대형 게이트를 클리어할 수 있는 국가 전술 자산. 능력을 한 번 펼치면 지형을 바꾸는 수준의 파괴력을 가짐.\n- 가이드: 광역 가이딩이 가능하며, A급 센티넬의 높은 오염도를 단시간에 정화할 수 있음. 주요 대형 길드의 이사급 대우를 받음.\n\n2-4. S급 (최상위 등급 - 규격 외)\n- 센티넬: 걸어 다니는 전략 병기이자 시한폭탄. 능력이 강한 만큼 감각 오염 속도가 엄청나며, 폭주할 경우 도시 하나가 지도에서 사라짐.\n- 가이드: 전 세계적으로 수십 명에 불과한 희귀 자원. S급 가이드 한 명의 존재 여부가 국가의 국방력과 직결되므로, 철저한 신변 보호와 정치적 이권의 중심에 서게 됨.\n\n3. 핵심 세계관 규칙 및 시스템\n- 센티넬이 능력을 사용할 때마다 정신 오염도가 상승한다. 오염도가 70%를 넘으면 오환, 환각, 극심한 두통이 시작되며, 90%에 도달하면 이성을 잃고 무차별적 파괴 행위를 저지르는 '폭주 상태'에 빠진다.\n- 가이드가 센티넬을 진정시키는 가이딩은 방식에 따라 구분된다. 손을 잡거나 체온을 나누는 접촉 가이딩은 가장 기본적인 정화 방식이다. 체액 교환이나 깊은 정신적 연결을 통한 심층 가이딩은 폭주 직전에 몰린 센티넬을 구하기 위한 필수적인 방식이다.\n- 고등급 가이드만 가능한 방사형 가이딩은 공기 중에 정화 파동을 뿌려 범위 내의 여러 센티넬을 동시에 케어하는 형태다.\n\n4. 주요 세력 요약\n\n4-1. 중앙 공명 통제국 (CRB - Central Resonance Bureau)\n- 국가 직속 기관.\n\n4-2. 자유 길드 연합\n- 게이트 공략으로 막대한 부를 쌓은 대형 길드들의 연합. 높은 재력과 특혜를 제시하여 고등급 가이드 및 센티넬을 자체적으로 스카우트하려 함.\n\n5. 대형 길드 상세 정보\n\n5-1. 아르카디아 (Arcadia) - 생활 밀착형 재건 길드\n- 주요 역할: 게이트 정화 구역 내의 주거지 관리, 인프라 복구, 지역 주민 지원.\n- 길드 분위기: 동네 이웃처럼 친근하고 온화함. 지역 사회 봉사와 이벤트에 가장 적극적인 길드.\n- 일상적인 모습: S급 토목/염동력 센티넬이 무너진 담벼락을 가볍게 들어 올려 수리하거나, 가이드들이 길드 사옥 1층을 동네 주민과 길고양이가 쉬어가는 쉼터로 개방해 둔 형태. 길드원 간에 소소한 집들이, 요리 품품회, 동네 산책 등이 자주 이루어짐.\n\n5-2. 루멘 (Lumen) - 미디어 & 엔터테인먼트 길드\n- 주요 역할: 센티넬과 가이드의 대중적 이미지를 관리하고 능력을 활용한 방송, 스포츠, 굿즈, 공연 사업 운영.\n- 길드 분위기: 화려하고 트렌디함. 일반적인 길드보다는 초대형 연예 기획사에 가까운 구조.\n- 일상적인 모습: 불꽃이나 빛 능력을 화려하게 쓰는 스타 센티넬의 팬미팅 현장 소동, 예민해진 스타 센티넬의 스케줄을 관리하며 챙겨주는 가이드 매니저의 일상. 사옥 로비는 SNS 인증샷 명소로 유명하며, 센티넬 전용 감각 케어용 굿즈(특제 안대, 소음 차단 헤드폰 등)를 개발해 판매하기도 함.\n\n5-3. 베르데 (Verde) - 게이트 자원 & 바이오 힐링 길드\n- 주요 역할: 게이트 내부에서 발견되는 식물과 부산물을 연구하여 감각 완화용 디저트, 차(Tea), 아로마 용품 개발.\n- 길드 분위기: 거대한 온실과 연구소가 결합된 듯한 식물원 분위기. 길드 전체에 숲 향이 가득함.\n- 일상적인 모습: 식물 제어 능력을 가진 센티넬이 온실에서 희귀 허브를 정성껏 키우고, 가이드들과 함께 신제품 정화 블렌딩 차 시음회를 엶. 감각 과부하로 두통을 겪는 다른 길드 센티넬들이 차를 마시며 쉬어가는 '힐링 아지트' 역할을 담당함.\n\n5-4. 아이언클레이드 (Ironclad) - 전투 전문 길드 (실상은 칼퇴 중심 직장)\n- 주요 역할: 대형 게이트 공략과 고위험 괴생명체 토벌을 맡는 최정예 전투 길드.\n- 길드 분위기: 겉보기에는 위엄 넘치는 철혈의 집단이지만, 내부적으로는 '칼퇴근'과 '휴가 보장'을 목숨처럼 사수하는 지극히 현실적인 직장 문화.\n- 일상적인 모습: 엄청난 파괴력을 가진 S급 센티넬이 \"퇴근 시간 10분 남았다\"며 게이트 내부를 순식간에 정벌하고 돌아와 퇴근 도장을 찍는 풍경. 사내 가이딩 스파실 예약 전쟁, 길드원 간의 보드게임 동호회, 주말에 맛집 투어를 다니는 소소한 일상이 주를 돎.\n\n즐앵챗","img":[],"bk":0,"gt":["내캐내먹"],"cm":[]},{"no":368859,"t":"박제탭 및 투표 관련 안내","h":"🔔공지","u":"https://gall.dcinside.com/mgallery/board/view/?id=aichatting&no=368859&exception_mode=recommend&page=8","d":"2026-08-07T12:58:52+09:00","v":1046,"rc":44,"cc":5,"src":["recommend"],"seen":"2026-09-02T09:37:44.429Z","c":"etc","cs":0,"amb":0,"alt":[],"why":[],"ml":null,"b":"박제탭은 사안이 사안인 만큼 신중하게 운영할 예정입니다\n운영 방식도 새로 정해야 하는 부분이 많아 준비에 다소 시간이 걸릴 수 있습니다\n또한 박제탭 명칭에 대해서도 의견을 확인했습니다\n‘박제’라는 표현이 공격적이라는 의견에 공감하여, 다른 명칭으로 운영하는 방향을 검토하도록 하겠습니다\n\n진행 예정이었던 투표 중 유저 캐릭터 그림 관련, 고닉 및 반고닉 닉네임 통일 관련 투표는 별도의 게시글을 통해 오늘 저녁쯤 순차적으로 올리겠습니다\n\n언급 금지 관련 사항은 이전글(언급 금지 최종 공지)에 따라 완장진 내부 논의를 거쳐 결정하였으므로, 별도의 투표는 진행하지 않을 예정입니다\n\n현재 갤러리와 관련하여 다양한 의견이 나오고 있고, 완장진끼리 의견을 나누고 정리할 시간도 필요해 다소 늦어진 점 양해 부탁드립니다\n감사합니다","img":[],"bk":0,"gt":["캐","완장"],"cm":[{"x":"고생한다","dp":0},{"x":"고생많다 다들","dp":0}]},{"no":368858,"t":"언급 금지 관련 최종 안내","h":"🔔공지","u":"https://gall.dcinside.com/mgallery/board/view/?id=aichatting&no=368858&exception_mode=recommend&page=5","d":"2026-08-07T12:57:14+09:00","v":4844,"rc":166,"cc":15,"src":["recommend"],"seen":"2026-09-02T09:37:44.429Z","c":"etc","cs":1,"amb":0,"alt":[],"why":[],"ml":null,"b":"제작자 개인에 대한 평가와 별개로, 소비자의 정당한 캐릭터 소비와 언급까지 일괄적으로 제한하는 것은 적절하지 않다고 판단했습니다.\n따라서 제작자의 논란이나 박제탭 등재만을 이유로 해당 제작자의 캐릭터까지 자동으로 언급 금지하지 않는 것을 원칙으로 합니다.\n\n다만 갤러리 이용 환경을 유지하기 위해, 기존 갤러리의 상황과 지금까지 제시된 이용자 의견을 고려하여 일부 언급 금지 조치가 필요하다고 판단했습니다.\n\n해당 조치는 완장진 전원의 동의하에 결정되었습니다.\n\n이에 아래 대상에 대해서는 갤러리 운영 차원에서 예외적으로 언급 금지를 적용합니다.\n\n- 아크 (케이브덕 CherryMango 제작자의 캐릭터)\n- 피어리스 (로판AI 0404, 케이브덕 0104 제작자의 캐릭터)\n- 농원 / 프론트라인 (티팟 meowmoon 제작자의 캐릭터)\n- 케이브덕 Love_S2 제작자의 캐릭터\n\n본 조치는 특정 제작자의 잘잘못을 판단하기 위한 것이 아닌, 과거 갤러리 운영 과정에서 발생했던 여러 상황을 종합적으로 고려하여 결정한 운영상의 조치입니다.\n\n또한 언급 금지는 박제탭 운영과 별개입니다.\n박제탭에 등재되었다는 이유만으로 언급 금지를 적용하지 않으며, 언급 금지는 위에 명시된 대상에 한하여 적용됩니다.\n\n언급 금지에는 별도의 기한을 두지 않을 예정입니다.\n\n다만 향후 동일한 유형의 문제가 반복되어 갤러리 운영에 큰 영향을 미친다고 판단되는 경우에는 논의를 거쳐 언급 금지 대상을 추가할 수 있습니다.\n\n이는 특정 제작자나 특정 시리즈를 배척하기 위한 규정이 아니라, 갤러리 전체 이용 환경을 유지하기 위한 운영 기준임을 다시 한번 안내드립니다.","img":[],"bk":0,"gt":["케덕","팟","캐","완장"],"cm":[]},{"no":368856,"t":"특정 세계관·시리즈 관련 운영 방향","h":"🔔공지","u":"https://gall.dcinside.com/mgallery/board/view/?id=aichatting&no=368856&exception_mode=recommend&page=8","d":"2026-08-07T12:55:44+09:00","v":1494,"rc":38,"cc":14,"src":["recommend"],"seen":"2026-09-02T09:37:44.429Z","c":"etc","cs":0,"amb":0,"alt":[],"why":[],"ml":null,"b":"특정 세계관이나 시리즈의 인기를 억제하거나 소비를 제한하기 위한 것이 아니라, 갤러리 이용자가 다양한 주제의 글을 원활하게 이용할 수 있도록 하기 위한 운영 방안입니다\n\n갤러리가 특정 캐릭터나 특정 제작자의 팬 갤러리처럼 운영되는 상황은 지양하고자 합니다\n다만 갤러리 이용자의 글 작성 자체를 막거나, 갤러리 이용을 제한할 생각은 없습니다\n아래 내용은 이전 공지(공지탭 ‘갤러리 운영에 관하여 - 2’)에 추가로 반영할 예정인 운영 방향입니다\n\n이 글에서 언급하는 ‘특정 세계관’은 센티넬버스, 오메가버스와 같이 공통적으로 사용되는 포괄적인 세계관이 아닌, 제작자를 특정할 수 있는 개별 세계관을 의미합니다.\n\n1. 리뷰탭 제목 관련 (이전 공지 8번 항목에 추가)\n리뷰탭에서는 기존 캐릭터명 표기와 함께, 특정 세계관 또는 시리즈에 속한 캐릭터인 경우 해당 세계관 또는 시리즈명도 함께 표기하도록 할 예정입니다\n\n양식 예시 :\n- [세계관명] 캐릭터명이 포함된 제목\n- [시리즈명] 캐릭터명이 포함된 제목\n(양식은 예시일 뿐이며, 어떤 방식으로든 특정 세계관과 시리즈가 포함되면 됩니다)\n\n이를 통해 이용자가 어떤 시리즈의 글인지 쉽게 확인할 수 있도록 하려는 목적입니다\n\n2. 일반탭 및 기타 탭 관련 추가 (이전 공지 8번 항목에 추가)\n일반탭 및 기타 탭에서는 다른 캐릭터들과 동일한 사항으로 운영할 예정입니다\n\n다만 캐릭터가 아닌 특정 세계관이나 시리즈 자체를 전제로 추천을 요청하거나, 설정 질문을 하는 등 갤러리 이용자 모두가 해당 세계관 및 시리즈를 알고 있다는 전제로 작성되는 게시글은 팬덤 중심 분위기를 조성할 수 있다고 판단하여 제재할 예정입니다\n\n이는 특정 세계관을 배척하기 위한 목적이 아니라, 갤러리가 특정 시리즈 이용자 중심으로 굳어지는 것을 방지하기 위한 조치입니다\n\n3. 임시탭 운영\n향후 특정 세계관 또는 시리즈 관련 게시글이 갤러리 대부분을 차지하는 상황이 발생할 경우, 완장진 내부 논의를 거쳐 해당 세계관 또는 시리즈 전용 탭을 한시적으로 이용할 예정입니다\n\n전용 탭 지정은 아래와 같은 경우를 기준으로 검토합니다\n- 동일 세계관 또는 시리즈 관련 게시글이 갤러리의 대부분을 차지하는 경우\n- 단발성 유행이 아니라 신규 캐릭터 출시 등으로 장기화가 예상되는 경우\n\n전용 탭이 개설되면 일반글, 리뷰글 등 해당 세계관 및 시리즈 관련 게시글은 해당 탭 이용을 안내할 예정입니다\n\n다만 이를 사용하지 않았다고 해서 게시글을 삭제하거나 제재하지는 않으며, 해당 탭으로 이동하는 방식으로만 운영할 예정입니다\n탭 이동은 어디까지나 이용자 편의와 갤러리 주제 분산을 위한 조치이며, 특정 세계관이나 시리즈를 배척하기 위한 목적이 아닙니다\n\n최초 지정일로부터 최대 한 달간 운영하며, 관련 글 흐름이 빠르게 줄어들 경우 조기 종료할 수 있습니다\n반대로 한 달이 지난 이후에도 탭 이용이 활발할 경우에는 2주 단위로 운영 기간을 연장할 예정입니다\n\n다만 단순히 며칠간 언급이 늘어나거나, 다른 캐릭터보다 언급량이 조금 많다는 이유만으로 해당 탭 이용을 안내할 생각은 없습니다 갤러리의 전반적인 글 흐름을 고려한 뒤, 논의를 거쳐 필요하다고 판단되는 경우에만 한시적으로 해당 탭 이용을 안내할 예정입니다\n\n탭 이름은 ‘모음탭’으로 운영하는 방향을 생각하고 있습니다\n‘시리즈탭’이나 ‘인기탭’처럼 특정 성격을 전제로 하는 명칭보다는, 관련 게시글을 한곳에 모아 이용 편의를 높이기 위한 임시 분류라는 의미가 더 잘 전달된다고 생각했습니다\n\n위 내용은 아직 확정된 규정이 아닌 운영 방향 초안입니다\n반대 의견이나 추가 의견이 있다면 댓글 또는 건의탭을 통해 자유롭게 남겨주시기 바랍니다 충분히 검토하여 최종 규정에 반영하도록 하겠습니다","img":[],"bk":0,"gt":["캐","완장"],"cm":[{"x":"이 댓글은 게시물 작성자가 삭제하였습니다.","dp":0},{"x":"시리즈의 기준은 캐릭수임?","dp":0},{"x":"시리즈는 캐릭터 수를 기준으로 판단하지 않습니다 동일한 설정 지 않은 항목에 대해서는 이전 글을 참고해 주시기 바랍니다\nhttps://m.dcinside.com/board/aichatting/368338\n\n갤러리 운영에 관하여 - 2  - AI 채팅 마이너 갤러리\n아래 내용은 건의탭에 올라온 글과 공지 댓글을 바탕으로 완장진 논의 후 작성한 내용입니다아래에 언급되지 않았다고 해서 향후 규정에 포함되지 않는 것이 아닙니다 현재 문제가 있다고 언급되었거나 추가 논의가 필요하다고 판\nm.dcinside.com\n\n1. 미성년자 성적 대상화\n미성년자를 성적 대상으로 소비하거나 이를 미화·조장하는 게시글 및 댓글은 절대로 허용하지 않습니다\n예시 :\n- NSFW 설정 캐릭터에 미성년자 페르소나로 플레이한 내용을 전시하는 행위\n- 2세를 이용해 NSFW 상황을 연출하거나 성적으로 언급하는 행위\n미성년자 페르소나의 경우 실제 플레이 내용과 관계없이, NSFW 캐릭터에 해당 페르소나로 들어간 사실을 전시하는 행위 자체를 미성년자 성적 대상화를 조장하는 게시글로 판단하여 금지합니다\n\n또한 성인 페르소나라 하더라도 ‘나이만 성인’, ‘신체만 성인’, ‘유아퇴행’, ‘장애’ 등의 설정을 이용해 사실상 미성년자 설정을 우회하는 경우 역시 동일하게 적용합니다\nOOC 등을 이용하여 NSFW 설정 캐릭터나 페르소나를 미성년자로 설정한 뒤, 이를 전시하는 행위 또한 동일하게 금지합니다\n2세 관련 단순 육아물은 제재하지 않습니다\n\n5. 제작자 언급\n특정 제작자 개인에 대한 언급은 방식과 관계없이 금지합니다\n칭찬, 찬양, 근황 언급 등 긍정적인 내용도 포함됩니다\n또한 제작자의 이름을 직접 언급하지 않더라도, 특정 제작자 한 명이 글의 주가 되는 게시글 역시 동일하게 금지합니다\n직접적인 언급이 없이 근황, 신규 캐릭터, 플랫폼 이동, 이벤트 등 특정 제작자를 특정하거나 유추할 수 있는 내용도 모두 해당됩니다\n같은 맥락으로 ‘나작제’, ‘나큰제’ 등의 사용도 금지합니다\n예시 :\n- ○○○ 공지 봤어?\n- ○○○ 신규 캐릭터 예고 떴다\n- ○○○ 이벤트 한대\n- 내가 좋아하는 제작자 ○○ 플랫폼으로 온대\n- 나작제 이번에 신캐 나온대\n\n반면 특정 제작자가 아닌 제작자 전반에 대한 글이나 질문은 허용합니다\n\n추가로, 본인이 제작자라는 사실을 언급하는 내용이나 제작과 관련된 게시글은 모두 제작탭에 작성해 주시기 바랍니다\n단순한 제작 고민, 제작 프롬프트 관련 이야기, 제작 과정 공유 등 본인이 제작자임을 전제로 작성하는 내용이 모두 해당됩니다\n다만 제작탭 역시 특정 캐릭터의 제작자임을 밝히거나, 자신을 특정 제작자로 유추할 수 있는 내용은 허용하지 않습니다\n\n본인이 특정 캐릭터의 제작자임을 밝히는 행위는 그림탭과 홍보탭에서만 허용합니다\n그림탭과 홍보탭 댓글에서도 해당 제작자에게 아는 척을 하거나 과거 활동을 언급하는 행위, 캐릭터가 아닌 제작자 개인을 찬양하는 행위는 금지합니다\n예시 :\n- 저번 캐릭터도 좋았는데 이번에도 좋네요\n- 지난번 캐릭터랑 분위기가 달라서 좋다!\n- 와… 너무 고능하시다…\n\n본인 캐릭터를 타인인 것처럼 리뷰하면서 제목에 내캐내먹을 표기하지 않은 경우 셀프 바이럴로 판단하여 제재합니다\n\n5-1. 제작자 논란 관련\n본 항목은 박제탭 운영과는 별개의 내용입니다\n제작자 언급 금지 규정으로 인해, 공론화가 필요한 논란까지 모두 언급하지 못하는 상황을 방지하기 위한 절차입니다\n\n제작자 논란에 대해 이야기하려는 경우 바로 일반글을 작성하지 말고, 먼저 신문고를 통해 게시 가능 여부를 확인해야 합니다\n게시가 허용된 경우 이슈탭을 통해 작성할 수 있습니다\n신문고 절차를 거치지 않고 작성된 게시글은 내용이나 댓글 반응과 관계없이 우선 삭제 처리할 예정입니다\n이는 완장진이 논란의 진위를 판단하기 위한 절차가 아니라, 갤러리에서 다룰 수 있는 사안인지 여부를 먼저 확인하기 위한 절차입니다\n최초 게시글 이후 새로운 정보 없이 작성되는 파생글은 금지하며, 관련 논의는 해당 이슈탭 게시글의 댓글에서 이어가도록 할 예정입니다\n\n제작자 논란 게시글 작성이 허용되었다고 해서 해당 내용이 사실이라는 의미는 아닙니다 또한 완장진이 해당 논란의 진위나 사실관계를 확인하거나 보증하는 것도 아닙니다 완장진은 해당 사안이 갤러리에서 논의 가능한 주제인지 여부와, 아래 공지된 기준에 위배되지 않는지만 확인합니다\n\n다시 한번 말씀드리지만, 본 항목은 박제탭 운영과는 별개로 ‘제작자 논란 관련 갤러리 내부 언급’을 어떻게 다룰 것인지에 대한 운영 절차입니다\n\n이용자 간 해당 사안에 대한 의견 차이는 충분히 존재할 수 있으며, 가능한 한 하나의 이슈탭 게시글에서 건전하게 의견을 나눌 수 있도록 하기 위한 목적입니다\n\n아래 사유는 허용하지 않습니다\n- 근거 없이 심증만 존재하는 경우\n- 단순 추측이나 의심\n- 개인 간 분쟁 및 감정싸움 (뒷담화 등)\n- AI 캐릭터 간 유사성 및 표절\n\n박제탭 등재의 경우에는 별도의 절차를 통해 진행할 예정입니다\n\n7. 링크공개 캐릭터\n링크공개 캐릭터 리뷰를 작성하는 경우, 본문에 해당 캐릭터의 링크를 함께 첨부하는 것을 권장합니다\n이는 리뷰를 보고 관심이 생긴 이용자가 바로 접근할 수 있고, 불필요한 링크 요청 게시글을 없애기 위한 조치입니다\n\n다만 이를 의무화하여, 링크를 첨부하지 않았다는 이유만으로 제재할 계획은 없습니다\n현실적으로 갤러리에 올라오는 모든 리뷰 게시글의 캐릭터가 링크공개 상태인지 확인하기 어렵고, 게시글 작성 당시에는 공개였던 캐릭터가 이후 링크공개로 전환되는 등 상황이 변경될 수도 있기 때문입니다\n\n링크가 필요한 경우에는 해당 리뷰 게시글의 댓글을 통해 요청해 주시기 바랍니다\n단, 링크를 댓글로 공유한 이후 임의로 삭제하는 행위(예시 : 확인하면 지울게! 등)는 지양해 주시기 바랍니다\n링크공개 캐릭터인 만큼 다른 이용자도 동일하게 접근할 수 있어야하며, 반복적으로 링크를 삭제하여 동일한 링크 요청이 계속 발생하는 상황은 권장하지 않습니다\n\n‘○○ 링크 있는 사람?’, ‘○○ 링크 좀’과 같이 링크 요청만을 목적으로 게시글을 작성하는 행위는 제재할 예정입니다\n\n---\n\n위 내용은 공지 댓글과 건의탭 게시글을 바탕으로 완장진 내부에서 논의한 사항이며, 다른 의견이 존재할 수 있습니다\n의견이 있다면 글 또는 댓글 편하게 작성해 주시기 바랍니다\n건의글은 원활한 확인과 정리를 위해 건의탭을 꼭 이용해 주시기 바랍니다\n\n본 글은 최종 규정이 아닌 의견 수렴을 위한 임시 규정입니다\n다만 기존 규정 및 임시 규정에 따라 조치가 필요한 경우에는 완장진 판단에 따라 게시글 이동, 삭제 또는 제재가 이루어질 수 있습니다\n감사합니다","img":["https://dcimg4.dcinside.co.kr/viewimage.php?id=2cb4d32ee4c62caf60b8&no=63f39f2fe8d577a26fabd7e44e826b3006087e2c3fd05bb7e7c2328ed1f2793ef1311e0625aede5acf8f17336a50db696c115df4a20cdd6e51beb47b507f2f520bb022b95aa3461b"],"bk":0,"gt":["페소","캐","ooc","내캐내먹","프롬프트","nsfw","완장"],"cm":[{"x":"7에 어차피 링공캐 리뷰에 링크 다는걸 강제가 아닌 권장으로 한다고 하면, 링공캐 공개캐 나눌 필요 없이 그냥 모든 캐릭터 리뷰 통틀어서 링크 다는걸 권장하는건 어떨까 함.","dp":0},{"x":"리뷰글을 쓰면 캐 링크를 첨부하는게 아무래도 자연스럽지","dp":1},{"x":"좋다 같은 이름 있는 캐 있으면 뭐가 맞냐고 확인하지 않아도 되고 ! 어쨌든 권장이니까","dp":1},{"x":"아 나 이거 넘 원했던 바임 예전부터 맛있게 먹었다는 게시글만 있고(이름도 겹치는 캐 많은데!) 뭐먹었냐고 일일이 물어보거나 댓글 기다리는거 좀 불편했어","dp":1},{"x":"가볍게 그냥 휙 쓰고 가는 사람들한테는 부담일 듯 검색 정도는 스스로 하게 권장하고 캐 이름 명시하지 않는 걸 잡는 게 낫다고 봄","dp":1}
